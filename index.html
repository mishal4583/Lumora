      ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=(n>=15?d2cream:d2gold)((1-sp)*0.5);
      ctx.beginPath(); ctx.arc(m.cx,m.cy,lerp(20,130,easeOutCubic(sp)),0,6.28); ctx.stroke(); ctx.restore();
    }
    if(top){
      const sp2=d2seg(elapsed,0.16,0.50);
      if(sp2>0&&sp2<1){
        ctx.save(); ctx.lineWidth=1.4; ctx.strokeStyle=d2cream((1-sp2)*0.38);
        ctx.beginPath(); ctx.arc(m.cx,m.cy,lerp(20,168,easeOutCubic(sp2)),0,6.28); ctx.stroke(); ctx.restore();
      }
    }
  }
  d2DrawChainPill({n,tBreathe:S.t,metrics:m,scale:1+(high?0.22:0.14)*env,
    momentBloom:lerp(high?0.22:0.16,0,easeOutCubic(d2seg(elapsed,0.06,0.66)))});
  if(high){
    const p=clamp(d2seg(elapsed,0.12,0.22)-d2seg(elapsed,1.05,0.30),0,1);
    if(p>0){
      ctx.save(); ctx.globalAlpha=p;
      ctx.textAlign='right'; ctx.textBaseline='alphabetic'; ctx.font='italic 500 19px Georgia,serif';
      ctx.shadowColor=d2gold(0.45); ctx.shadowBlur=16; ctx.fillStyle='#fbf2d4';
      if(top)try{ ctx.letterSpacing='0.5px'; }catch(e){}
      const yy=190+lerp(6,0,easeOutCubic(d2seg(elapsed,0.12,0.22)));
      const str=top?'✦  Glow Chain ×20  ✦':'Glow Chain ×'+n;
      ctx.fillText(str,512,yy); ctx.fillText(str,512,yy); // filled twice, for glow density
      if(top)try{ ctx.letterSpacing='0px'; }catch(e){}
      ctx.restore();
    }
  }
  d2DrawRewardChip(m,D2_REWARD_BY_N[n]||'+5',d2seg(elapsed,0.10,high?0.74:0.62));
  const cnt=top?18:n>=15?14:high?10:0;
  const rr=d2rnd(613);
  for(let i=0;i<cnt;i++){
    const px=m.x+8+rr()*(m.w-16), ph=rr();
    const p=clamp((elapsed-0.06-ph*0.34)/1.0,0,1); if(p<=0||p>=1)continue;
    const y=D2_CPY+D2_CPH-8-p*74, al=Math.sin(p*Math.PI)*0.8;
    d2bloom(px,y,8,D2_GOLD_RGB,al*0.45);
    ctx.beginPath(); ctx.arc(px,y,1.3,0,6.28); ctx.fillStyle=d2gold(al); ctx.fill();
  }
}
// A4: the inversion of every gain moment above, built from the same pill --
// no colour is introduced, gold is withdrawn (same rule D1 used for a
// failed objective), and it falls where every gain moment rises.
function d2DrawChainBreak(elapsed,n){
  const drop=d2seg(elapsed,0.62,0.30);
  const a=1-easeInQuad(drop);
  if(a<=0)return;
  d2DrawChainPill({n,tBreathe:S.t,alpha:a,dy:lerp(0,10,easeInQuad(drop)),
    brokeP:easeOutCubic(d2seg(elapsed,0,0.30)),strikeP:d2seg(elapsed,0.10,0.24),flashBorder:elapsed<0.09});
  const lp=d2seg(elapsed,0.20,0.26)*a;
  if(lp>0){
    ctx.save(); ctx.globalAlpha=lp;
    ctx.textAlign='right'; ctx.textBaseline='alphabetic'; ctx.font='italic 500 13px Georgia,serif';
    ctx.fillStyle=d2haze(0.6);
    ctx.fillText('chain broken',512,182+lerp(0,10,easeInQuad(drop)));
    ctx.restore();
  }
}
// The one entry point drawHUD() calls -- routes to whichever of A1-A4 is
// currently active. Never more than one at a time: break/exit take priority
// over the idle pill (there is nothing live to show once S.chain is 0), and
// a moment IS the pill for its own duration (drawChainMoment() calls
// d2DrawChainPill() itself), never drawn underneath a separate idle pill.
function drawChainHUD(){
  if(S.over)return;
  if(S.d2ChainBreakT>0){ d2DrawChainBreak(S.d2ChainBreakTotal-S.d2ChainBreakT,S.d2ChainBreakN); return; }
  if(S.d2ChainExitT>0){ d2DrawChainPill({n:S.d2ChainLastN,tBreathe:S.t,alpha:clamp(S.d2ChainExitT/0.20,0,1)}); return; }
  if(S.chain<3)return;
  if(S.d2ChainMomentT>0){ d2DrawChainMoment(S.d2ChainMomentTotal-S.d2ChainMomentT,S.d2ChainMomentN); return; }
  let m=d2ChainMetrics(S.chain);
  if(S.d2ChainWidthT>0){
    const we=easeInOutCubic(clamp(1-S.d2ChainWidthT/0.18,0,1));
    const w=lerp(S.d2ChainWidthFrom,m.w,we);
    m={num:m.num,nw:m.nw,lw:m.lw,w,x:D2_CPR-w,cx:D2_CPR-w/2,cy:m.cy};
  }
  const enterActive=S.d2ChainEnterT>0, enterP=enterActive?clamp(1-S.d2ChainEnterT/0.26,0,1):1;
  const tick=S.d2ChainTickT>0?clamp(1-S.d2ChainTickT/0.22,0,1):null;
  d2DrawChainPill({n:S.chain,tBreathe:S.t,metrics:m,tick,
    alpha:enterActive?easeOutCubic(enterP):1, scale:enterActive?lerp(0.86,1,easeOutCubic(enterP)):1});
  // one-shot entry bloom -- simplified to decay across the same 260ms
  // window as the entry itself rather than tracking a second, longer timer
  // for what the handoff describes as a slightly longer 400ms decay.
  if(enterActive)d2bloom(m.cx,m.cy,56,D2_GOLD_RGB,lerp(0.10,0,enterP));
}

// ---- B1/B2: delivery composite -- bottom row baseline ALWAYS y536, rows
// stack upward, so one row or two never creeps the composite toward the jar.
function d2DrawDeliveryRow(kind,label,value,baseline,alpha,tintRGB){
  ctx.font='italic 500 17px Georgia,serif'; const lw=ctx.measureText(label).width;
  ctx.font='600 15px Georgia,serif'; const vw=ctx.measureText(value).width;
  const total=13+10+lw+14+vw, x0=270-total/2;
  ctx.save(); ctx.globalAlpha=alpha;
  if(kind==='rare')d2RareMote(x0+6.5,baseline-5,1.15,1,0,tintRGB);
  else star4Glyph(x0+6.5,baseline-5,6,d2cream(0.95),d2gold(0.45),12); // perfect delivery reuses the existing score glyph
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font='italic 500 17px Georgia,serif'; ctx.fillStyle='rgba(230,217,188,0.92)';
  ctx.shadowColor=d2gold(0.28); ctx.shadowBlur=12; ctx.fillText(label,x0+23,baseline); ctx.shadowBlur=0;
  ctx.font='600 15px Georgia,serif'; ctx.fillStyle=d2gold(0.96);
  ctx.shadowColor=d2gold(0.35); ctx.shadowBlur=10; ctx.fillText(value,x0+23+lw+14,baseline);
  ctx.restore();
}
// No flying chip here -- deliberately: that motion belongs to the chain
// (drawChainHUD()'s reward chip). Delivery blooms where the trip ended.
function drawDeliveryComposite(){
  if(S.d2DeliveryT<=0)return;
  const elapsed=S.d2DeliveryTotal-S.d2DeliveryT, rows=S.d2DeliveryRows, n=rows.length;
  if(!n)return;
  const BASE=536, PITCH=30, hold=n>1?1.45:1.25;
  const inA=d2seg(elapsed,0,0.24), outA=d2seg(elapsed,hold,0.34);
  const a=clamp(inA-outA,0,1); if(a<=0)return;
  const cyB=BASE-(n-1)*PITCH/2-6;
  ctx.save();
  d2bloom(270,cyB,n>1?190:160,D2_GOLD_RGB,
    lerp(0,n>1?0.13:0.12,easeOutCubic(d2seg(elapsed,0,0.14)))*lerp(1,0.45,d2seg(elapsed,0.40,0.70))*(1-easeOutCubic(outA)));
  rows.forEach((r,i)=>{
    const p=d2seg(elapsed,i*0.14,0.24); if(p<=0)return;
    const dy=lerp(6,0,easeOutCubic(p))+lerp(0,-8,easeOutCubic(outA));
    const vp=d2seg(elapsed,i*0.14+0.06,0.20);
    d2DrawDeliveryRow(r.kind,r.label,r.value,BASE-(n-1-i)*PITCH+dy,clamp(p-outA,0,1),S.d2DeliveryTintRGB);
    if(vp>0&&vp<1){
      ctx.font='italic 500 17px Georgia,serif'; const lw=ctx.measureText(r.label).width;
      ctx.font='600 15px Georgia,serif'; const vw=ctx.measureText(r.value).width;
      const total=13+10+lw+14+vw;
      const vx=270-total/2+23+lw+14+vw/2, vy=BASE-(n-1-i)*PITCH+dy-5;
      d2bloom(vx,vy,26,D2_GOLD_RGB,Math.sin(vp*Math.PI)*0.22);
    }
  });
  ctx.restore();
}

// ---- B3: ambient "carrying something valuable" signal, drawn right after
// drawJar() so it layers directly on the jar it orbits. Screenshots 06/07
// (sent to Claude Design) showed the jar's OWN glow radius/brightness is
// already the capacity channel (see drawJar()'s gr/gInt) -- so rarity gets
// a channel that structurally cannot read as "fuller": discrete COOL motes
// on a dashed ring, one per rare firefly currently carried. Zero draw calls
// at rare=0, per direct spec -- nothing here runs unless a rare is carried.
function drawJarRarity(){
  const rareEntries=S.carried.filter(c=>isRareType(c.type));
  const rare=rareEntries.length;
  if(rare<=0)return;
  const cx=S.jar.x, cy=S.jar.y-14; // the same vertical anchor the reticle/capacity glow already use
  const tintRGB=toRgbTriple(TYPES[rarestCarriedType()].glow);
  const full=S.carried.length>=S.cap;
  const cool=Math.min(1,rare/4)*0.45; // rim overstroke intensity: .056/.11/.17/.225(4+ ceiling)
  if(cool>0){
    // overstrokes the SAME jar outline path drawJar() already fills/strokes
    // (own save/scale, so it tracks this jar's own purchased capacity size)
    ctx.save(); ctx.translate(cx,cy+14);
    const jar=currentJar(); const jsc=1+(S.cap-jar.capacity)*0.05; ctx.scale(jsc,jsc);
    ctx.strokeStyle='rgba('+tintRGB+','+(cool*0.5)+')'; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(-19,-30); ctx.quadraticCurveTo(-27,-24,-27,-8); ctx.quadraticCurveTo(-27,16,-18,20);
    ctx.lineTo(18,20); ctx.quadraticCurveTo(27,16,27,-8); ctx.quadraticCurveTo(27,-24,19,-30);
    ctx.stroke(); ctx.restore();
  }
  if(rare>=2){ // the dashed ring only arms once the bonus is actually payout-eligible
    const ra=clamp(S.d2RareRingT/0.5,0,1);
    ctx.save(); ctx.setLineDash([2,9]); ctx.lineWidth=1; ctx.strokeStyle=d2cream(0.10*ra);
    ctx.beginPath(); ctx.ellipse(cx,cy,54,44,0,0,6.28); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }
  const shown=Math.min(6,rare), grow=rare>6?1.32:1;
  for(let i=0;i<shown;i++){
    const th=S.t*0.88+i*6.28318/Math.max(1,shown);
    const entry=rareEntries[i];
    const born=entry.caughtAt==null?1:easeOutCubic(clamp((S.t-entry.caughtAt)/0.55,0,1));
    const rk=lerp(0.11,1,born);
    const mx=cx+Math.cos(th)*54*rk, my=cy+Math.sin(th)*44*rk;
    const al=(0.72+0.28*Math.sin(S.t*1.1+i*2.4))*born;
    d2RareMote(mx,my,grow,al,full?0.06:0,tintRGB);
  }
}

// ---------- Lumora 2.0 D3 (Claude Design spec): Night Contract UI ----------
// Ported the same way D2's own rendering was: function-for-function where
// the handoff's numbers were genuinely new work, adapted to this file's
// plain ctx.* calls and its native ctx.roundRect(). Two corrections against
// the handoff's own claims (both the kind its own CONFIRM section already
// anticipates): Peaceful's "crescent" and Collector's "star4" are claimed
// as reusing existing drawn shapes, but D1's own eyebrow crescent is
// actually the 🌙 EMOJI (not a vector shape -- confirmed while implementing
// D2's own glyph corrections), and no shared star4() function existed
// before this pass (D2's delivery row drew its star inline) -- see
// star4Glyph() above, newly extracted for exactly this reuse. The risk
// dots' colour is corrected to the ACTUAL miss-dot colours (#b98ec9/
// #7b83a8) rather than the handoff's own "lavender rgba(166,168,198)",
// which is a different colour from either of those and doesn't exist
// anywhere else in this file.
function d3CrescentGlyph(cx,cy,r,col,carve){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,6.28); ctx.fillStyle=col; ctx.fill();
  ctx.beginPath(); ctx.arc(cx+r*0.46,cy-r*0.17,r*0.92,0,6.28); ctx.fillStyle=carve||'rgba(10,13,33,0.92)'; ctx.fill();
  ctx.restore();
}
function d3MothGlyph(cx,cy,r,col,blur){
  ctx.save(); if(blur){ ctx.shadowColor=col; ctx.shadowBlur=blur; }
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.moveTo(cx,cy-r*0.18);
  ctx.quadraticCurveTo(cx-r*1.16,cy-r*1.02,cx-r*0.94,cy+r*0.16);
  ctx.quadraticCurveTo(cx-r*0.82,cy+r*0.96,cx-r*0.12,cy+r*0.5);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx,cy-r*0.18);
  ctx.quadraticCurveTo(cx+r*1.16,cy-r*1.02,cx+r*0.94,cy+r*0.16);
  ctx.quadraticCurveTo(cx+r*0.82,cy+r*0.96,cx+r*0.12,cy+r*0.5);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx,cy+r*0.06,r*0.17,r*0.6,0,0,6.28); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(0.8,r*0.1); ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cx-r*0.06,cy-r*0.48); ctx.quadraticCurveTo(cx-r*0.5,cy-r*0.96,cx-r*0.6,cy-r*1.14);
  ctx.moveTo(cx+r*0.06,cy-r*0.48); ctx.quadraticCurveTo(cx+r*0.5,cy-r*0.96,cx+r*0.6,cy-r*1.14);
  ctx.stroke(); ctx.restore();
}
function contractGlyph(kind,cx,cy,r,col,blur,carve){
  if(kind==='moon')d3CrescentGlyph(cx,cy,r,col,carve);
  else if(kind==='ember')d2EmberGlyph(cx,cy,r*0.76,col,blur);
  else if(kind==='moth')d3MothGlyph(cx,cy,r,col,blur);
  else star4Glyph(cx,cy,r,col,col,blur||0);
}
// 0 -> 1 -> 0 pop with a slight overshoot -- used only for the SELECTED
// badge's entrance, same shape the handoff's own reference implementation
// uses for it.
function contractBadgePop(p){
  const c=clamp(p,0,1);
  return c<0.55?easeOutCubic(c/0.55)*1.15:lerp(1.15,1,easeInOutCubic((c-0.55)/0.45));
}

// ---- C2: the card itself -- one function serves all four grid positions,
// every offset card-relative. sel/badge/breathe state all read from the
// module-level contractSel/contractSelAt so the caller only needs to pass
// entry-animation overrides (alpha/dy/scale). ----
function drawContractCard(i,o){
  o=o||{};
  const c=CONTRACTS[i];
  const x=CONTRACT_GRID_X[i%2], y=CONTRACT_GRID_Y[i>>1]+(o.dy||0);
  const sp=clamp(o.selP==null?(i===contractSel?1:0):o.selP,0,1);
  const a=o.alpha==null?1:o.alpha, sc=o.scale==null?1:o.scale;
  if(a<=0)return;
  ctx.save(); ctx.globalAlpha=a;
  ctx.translate(x+CONTRACT_CARD_W/2,y+CONTRACT_CARD_H/2); ctx.scale(sc,sc); ctx.translate(-(x+CONTRACT_CARD_W/2),-(y+CONTRACT_CARD_H/2));
  if(sp>0.02)d2bloom(x+CONTRACT_CARD_W/2,y+CONTRACT_CARD_H/2,168,D2_GOLD_RGB,0.085*sp);
  lumGlassPanel(x,y,CONTRACT_CARD_W,CONTRACT_CARD_H,18); // the Workshop's own material, called directly per the handoff's own CONFIRM instruction
  // D3's own selected-state wash, layered ON TOP of that shared material --
  // lumGlassPanel() itself has no selected concept of its own.
  if(sp>0.02){
    ctx.save();
    ctx.beginPath(); ctx.roundRect(x,y,CONTRACT_CARD_W,CONTRACT_CARD_H,18); ctx.fillStyle=d2gold(0.055*sp); ctx.fill();
    ctx.lineWidth=1+sp; ctx.strokeStyle=d2gold(lerp(0.2,0.85,sp));
    ctx.beginPath(); ctx.roundRect(x+0.5+sp*0.5,y+0.5+sp*0.5,CONTRACT_CARD_W-1-sp,CONTRACT_CARD_H-1-sp,18); ctx.stroke();
    ctx.restore();
  }
  // shelf -- keeps *price* visually separate from *terms*, same split the Workshop card makes
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x,y,CONTRACT_CARD_W,CONTRACT_CARD_H,18); ctx.clip();
  ctx.fillStyle='rgba(5,7,27,0.32)'; ctx.fillRect(x,y+148,CONTRACT_CARD_W,CONTRACT_CARD_H-148);
  ctx.restore();
  ctx.strokeStyle=sp>0.02?d2gold(0.10+0.16*sp):d2haze(0.12); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+1,y+148); ctx.lineTo(x+CONTRACT_CARD_W-1,y+148); ctx.stroke();
  // medallion + glyph
  ctx.save();
  ctx.beginPath(); ctx.arc(x+32,y+34,16,0,6.28); ctx.fillStyle='rgba(10,13,33,0.92)'; ctx.fill();
  ctx.lineWidth=1; ctx.strokeStyle=sp>0.02?d2gold(0.16+0.26*sp):d2haze(0.16); ctx.stroke();
  ctx.restore();
  contractGlyph(c.glyph,x+32,y+34,9,sp>0.02?'#fbd26b':d2gold(0.82),sp>0.02?9:0,'rgba(10,13,33,0.92)');
  // name
  ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.font='600 15px Georgia,serif';
  if(sp>0.02){ ctx.shadowColor=d2gold(0.35*sp); ctx.shadowBlur=10; ctx.fillStyle='#fbf2d4'; } else { ctx.shadowBlur=0; ctx.fillStyle='rgba(230,217,188,0.95)'; }
  ctx.fillText(c.name,x+56,y+39); ctx.shadowBlur=0;
  // description
  ctx.font='italic 500 11.5px Georgia,serif'; ctx.fillStyle=d2haze(0.72);
  ctx.fillText(c.desc,x+16,y+68);
  // rule
  ctx.strokeStyle=d2haze(0.12); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+16,y+84); ctx.lineTo(x+216,y+84); ctx.stroke();
  // modifiers (diamond bullet + text, 1-2 lines)
  c.mods.forEach((md,k)=>{
    const b=y+108+k*22;
    ctx.save(); ctx.translate(x+22,b-4); ctx.rotate(Math.PI/4);
    ctx.fillStyle=d2gold(0.55); ctx.fillRect(-2.2,-2.2,4.4,4.4); ctx.restore();
    ctx.font='500 11px Georgia,serif'; ctx.fillStyle='rgba(230,217,188,0.84)';
    ctx.fillText(md,x+32,b);
  });
  // risk dots -- the existing top-left miss-dot idiom, same colours/shape
  ctx.font='600 8.5px Georgia,serif'; try{ ctx.letterSpacing='1.2px'; }catch(e){}
  ctx.fillStyle=d2haze(0.58); ctx.fillText('RISK',x+16,y+181);
  const rlw=ctx.measureText('RISK').width;
  try{ ctx.letterSpacing='0px'; }catch(e){}
  for(let k=0;k<3;k++){
    ctx.beginPath(); ctx.arc(x+16+rlw+9+k*9,y+177.5,2.6,0,6.28);
    ctx.fillStyle=k<c.risk?'#b98ec9':'#7b83a8'; ctx.fill();
  }
  // reward -- a coin disc for a coin-scaled reward; Collector's own flat
  // Workshop Token skips it (the token's own '✦' already sits in its own
  // label), same "non-coin reward shows as its own thing" rule C5 uses.
  ctx.textAlign='right'; ctx.font='600 12.5px Georgia,serif';
  const rw=ctx.measureText(c.rewardLabel).width;
  if(!c.tokenReward){
    const coinCx=x+CONTRACT_CARD_W-16-rw-11;
    const cg=ctx.createRadialGradient(coinCx-1.35,y+177-1.35,0,coinCx,y+177,4.5);
    cg.addColorStop(0,'#fbf2d4'); cg.addColorStop(0.55,'#fbd26b'); cg.addColorStop(1,'#f09638');
    ctx.save(); ctx.shadowColor=d2gold(0.5); ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(coinCx,y+177,4.5,0,6.28); ctx.fillStyle=cg; ctx.fill(); ctx.restore();
  }
  ctx.fillStyle=d2gold(0.95);
  ctx.fillText(c.rewardLabel,x+CONTRACT_CARD_W-16,y+182);
  // SELECTED badge
  if(sp>0.02){
    const bs=o.badgeScale==null?1:o.badgeScale;
    ctx.save(); ctx.globalAlpha=sp;
    ctx.translate(x+CONTRACT_CARD_W-45,y+21); ctx.scale(bs,bs);
    ctx.beginPath(); ctx.roundRect(-31,-8,62,16,8); ctx.fillStyle='#fbd26b'; ctx.fill();
    ctx.textAlign='center'; ctx.font='600 8px Georgia,serif'; try{ ctx.letterSpacing='1.2px'; }catch(e){}
    ctx.fillStyle='#05071b'; ctx.fillText('SELECTED',0,3.2);
    try{ ctx.letterSpacing='0px'; }catch(e){}
    ctx.restore();
  }
  ctx.restore();
}

// ---- C1/C3: the screen itself -- scrim, head, the 4 cards, and either the
// idle hint or the confirmation dock, depending on contractSel. ----
function drawContractScreen(){
  const t=contractScreenAt;
  const sIn=clamp(t/0.20,0,1);
  const sOut=contractExitAt>=0?clamp((t-contractExitAt)/0.28,0,1):0;
  const scrim=lerp(0,0.74,easeOutCubic(sIn))*(1-easeOutCubic(sOut));
  ctx.save();
  ctx.fillStyle='rgba(5,7,27,'+scrim+')'; ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(270,470,140,270,470,540);
  vg.addColorStop(0,'rgba(5,7,27,0)'); vg.addColorStop(1,'rgba(5,7,27,'+(scrim*(0.5/0.74))+')');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  const hp=clamp((t-0.10)/0.22,0,1), head=clamp(hp-sOut,0,1);
  if(head>0){
    ctx.save(); ctx.globalAlpha=head;
    const lbl='NIGHT '+nightNumber;
    ctx.font='600 11px Georgia,serif'; try{ ctx.letterSpacing='2px'; }catch(e){}
    const lw=ctx.measureText(lbl).width;
    try{ ctx.letterSpacing='0px'; }catch(e){}
    ctx.textAlign='center'; ctx.textBaseline='middle';
    d3CrescentGlyph(270-lw/2-19,178,7,d2gold(0.9));

// ---- C5/D5: the tail rows appended to the Night Complete panel, after the
// objective bonus row (or the 3 stat rows if tonight had none). Static,
// drawn at the panel's own shared alpha (drawOver()'s own single top-level
// S.overT fade) -- a deliberate simplification against the D5 handoff's own
// bespoke per-row reveal/count-up timers (1.52-2.42s staggered): every
// OTHER row on this exact screen (the stat rows, the objective rows, the
// OBJECTIVE BONUS figure) is already a plain, always-rendered value
// computed fresh each frame, never its own tween -- adding staggered
// reveals to JUST these new rows would be the one inconsistent exception
// rather than matching every sibling row already on this screen.
//
// D5 (Claude Design spec): CONTRACT/EVENT/BONUS now stack in this fixed
// order, sharing ONE hairline -- an absent row costs nothing, the next
// present row simply lands in its slot. Each row's `b` is the glyph's own
// cy (panel-y-relative); label/value baselines are always b+4/b+5, matching
// the existing CONTRACT row's own +4 relationship exactly.
function nightCompleteTailRows(hasObjectives,hasContract,hasEvent,hasBonus){
  let base=hasObjectives?306:164;
  const rows=[];
  if(hasContract){ rows.push({kind:'contract',b:base}); base+=26; }
  if(hasEvent){ rows.push({kind:'event',b:base}); base+=26; }
  if(hasBonus){ rows.push({kind:'bonus',b:base}); base+=26; }
  return rows;
}

// ---------- Lumora 2.0 D4 (Claude Design spec): Night Event UI ----------
// Like D2/D3's own rendering, ported function-for-function where the
// numbers were genuinely new work. The handoff itself flags the one thing
// that made this phase different from D1-D3: the PLAN assumed an event has
// a visible duration you could count down ("MOONLIGHT 08s") and a distinct
// ending ("MOONLIGHT COMPLETE") -- the real system does neither. An event
// is rolled once in reset() and holds the WHOLE night; there is no timer,
// no expiry, no lump-sum reward to reveal (Moth Swarm's x1.2 is a silent,
// continuous per-delivery multiplier, already folded into nightEventCoinMult()
// and every coin figure the player already sees). So: no countdown, no
// progress ring, no "ending" moment -- exactly as the handoff insists.
//
// t0 (when the announcement starts) is 400ms after the D1 goals card's own
// dismissal keyframe (4.30), i.e. S.newNightT===4.70 -- reusing that
// EXISTING clock rather than adding a new timestamp field, since it already
// counts up continuously from reset() and never resets until the next one.
const EVENT_ANNOUNCE_T0=4.70;
function eventAnnounceElapsed(){ return S.newNightT-EVENT_ANNOUNCE_T0; }
// Active precisely while the composite OR its flight-to-chip is visible.
// Gated on S.isNewNight (already the exact "this is a genuine new night,
// not a restart" signal ensureNightObjectives() sets) -- a restart
// restores the SAME event but must NOT replay the announcement, per
// ensureNightEvent()'s own comment. Also used by drawHUD() to suppress the
// shared hint slot for this same window (decision 1 in the handoff).
function eventAnnounceActive(){
  if(!S.eventActive||!S.isNewNight)return false;
  const t=eventAnnounceElapsed();
  return t>=0&&t<3.92;
}
function d4RainGlyph(cx,cy,r,col,blur){
  ctx.save(); if(blur){ ctx.shadowColor=col; ctx.shadowBlur=blur; }
  const off=[[-0.66,-0.46,0.78],[0,-0.80,1.06],[0.66,-0.30,0.70]];
  ctx.lineCap='round'; ctx.lineWidth=Math.max(0.9,r*0.15); ctx.strokeStyle=col;
  off.forEach(o=>{
    const x=cx+o[0]*r, y=cy+o[1]*r, ex=x-r*0.10, ey=y+o[2]*r;
    ctx.save(); ctx.globalAlpha=0.5;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke(); ctx.restore();
    ctx.beginPath(); ctx.arc(ex,ey,r*0.19,0,6.28); ctx.fillStyle=col; ctx.fill();
  });
  ctx.restore();
}
// crescent/moth are D1's and D3's own existing glyphs, called directly per
// the handoff's own instruction -- rainGlyph (above) is D4's only new one.
function eventGlyph(kind,cx,cy,r,col,blur,carve){
  if(kind==='moon')d3CrescentGlyph(cx,cy,r,col,carve);
  else if(kind==='rain')d4RainGlyph(cx,cy,r,col,blur);
  else d3MothGlyph(cx,cy,r,col,blur);
}
const EVENT_CHIP_RIGHT=526, EVENT_CHIP_Y=208, EVENT_CHIP_H=30; // right edge mirrors D2's chain pill; same row as D3's chip, opposite column
function eventChipMetrics(){
  const e=EVENT_UI[S.eventActive];
  ctx.font='600 9.5px Georgia,serif'; try{ ctx.letterSpacing='1.2px'; }catch(err){}
  const lw=ctx.measureText(e.name).width;
  try{ ctx.letterSpacing='0px'; }catch(err){}
  const w=Math.round(13+13+8+lw+13);
  return {e,lw,w,x:EVENT_CHIP_RIGHT-w};
}
// D4 (E3): persistent, ambient, not tappable -- identical fill/border/
// radius/label styling to D3's contract chip (deliberately: "a fact, not
// an event," per the handoff's own decision 4). Zero draw calls with no
// event active, or once Night Complete has its own summary.
// Deviation from a literal "chip only ever enters via the announcement's
// flight" (the handoff's own stated rule): on a RESTART of the same night,
// S.isNewNight is false so the announcement never replays, but the event
// itself is still genuinely active -- the chip must still show (there is
// no state where an event is active and the player sees no indicator of
// it at all), just without a flight-in. Documented here since the handoff
// itself doesn't anticipate the restart case explicitly.
function drawEventChip(){
  if(!S.eventActive||S.over)return;
  let alpha=1;
  if(S.isNewNight){
    const t=eventAnnounceElapsed();
    if(t<3.62)return; // the announcement's own flight hasn't landed yet -- see drawEventAnnouncement()
    alpha=clamp((t-3.62)/0.30,0,1);
  }
  const m=eventChipMetrics();
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.beginPath(); ctx.roundRect(m.x,EVENT_CHIP_Y,m.w,EVENT_CHIP_H,EVENT_CHIP_H/2);
  ctx.fillStyle='rgba(25,33,67,0.55)'; ctx.fill();
  ctx.strokeStyle=d2haze(0.14); ctx.lineWidth=1; ctx.stroke();
  eventGlyph(m.e.glyph,m.x+19.5,EVENT_CHIP_Y+15,6.5,'rgba('+m.e.rgb+','+(S.eventActive==='mothSwarm'?0.88:0.78)+')',0,'rgba(10,13,33,0.92)');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font='600 9.5px Georgia,serif'; try{ ctx.letterSpacing='1.2px'; }catch(err){}
  ctx.fillStyle=d2haze(0.62);
  ctx.fillText(m.e.name,m.x+34,EVENT_CHIP_Y+19);
  try{ ctx.letterSpacing='0px'; }catch(err){}
  ctx.restore();
}
// D4 (E1): the once-a-night reveal -- its own field composite (270,306-444),
// NOT the shared hint slot (see drawHUD()'s own suppression guard). Never a
// modal: no hit-test, doesn't pause, taps pass through to the field.
function drawEventAnnouncement(){
  if(!S.eventActive||!S.isNewNight)return;
  const t=eventAnnounceElapsed();
  if(t<0||t>=3.92)return;
  const e=EVENT_UI[S.eventActive];
  if(!S.eventAnnounceFired){ S.eventAnnounceFired=true; sEventAnnounce(); }
  const tint=a=>'rgba('+e.rgb+','+a+')';
  const inA=easeOutCubic(clamp(t/0.26,0,1));
  const outA=clamp((t-3.20)/0.24,0,1);
  const base=clamp(inA-outA,0,1);
  const flightP=clamp((t-3.44)/0.42,0,1);
  if(base>0){
    ctx.save(); ctx.globalAlpha=base;
    d2bloom(270,336,150,e.rgb,e.bloom*easeOutCubic(clamp(t/0.32,0,1)));
    const ruleW=lerp(0,132,easeOutCubic(clamp((t-0.12)/0.22,0,1)));
    if(ruleW>0){
      const rg=ctx.createLinearGradient(270-ruleW/2,0,270+ruleW/2,0);
      rg.addColorStop(0,'rgba(174,184,203,0)'); rg.addColorStop(0.5,d2haze(0.26)); rg.addColorStop(1,'rgba(174,184,203,0)');
      ctx.fillStyle=rg; ctx.fillRect(270-ruleW/2,382,ruleW,1);
    }
    const np=easeOutCubic(clamp((t-0.18)/0.24,0,1));
    if(np>0){
      ctx.save(); ctx.globalAlpha=base*np;
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.font='600 13px Georgia,serif'; try{ ctx.letterSpacing='3px'; }catch(err){}
      ctx.shadowColor=tint(0.30); ctx.shadowBlur=14; ctx.fillStyle=tint(0.95);
      ctx.fillText(e.name,270,408+lerp(5,0,np));
      try{ ctx.letterSpacing='0px'; }catch(err){}
      ctx.restore();
    }
    const lp=easeOutCubic(clamp((t-0.26)/0.26,0,1));
    if(lp>0){
      ctx.save(); ctx.globalAlpha=base*lp;
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.font='italic 500 14.5px Georgia,serif'; ctx.shadowColor=d2gold(0.18); ctx.shadowBlur=12; ctx.fillStyle='rgba(230,217,188,0.90)';
      ctx.fillText(e.line,270,436);
      ctx.restore();
    }
    ctx.restore();
  }
  if(flightP>=1)return;
  const m=eventChipMetrics();
  const k=easeInOutCubic(flightP);
  const cx=lerp(270,m.x+19.5,k), cy=lerp(336,EVENT_CHIP_Y+15,k);
  const entryScale=easeOutCubic(clamp(t/0.26,0,1));
  const sc=lerp(1,6.5/14,k)*lerp(0.82,1,entryScale);
  ctx.save(); ctx.globalAlpha=entryScale;
  if(flightP>0)d2bloom(cx,cy,34,e.rgb,0.26*Math.sin(Math.PI*flightP));
  if(flightP<0.02){
    ctx.beginPath(); ctx.arc(cx,cy,28*sc,0,6.28); ctx.fillStyle='rgba(10,13,33,0.92)'; ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle=tint(0.28); ctx.stroke();
  }
  eventGlyph(e.glyph,cx,cy,14*sc,tint(0.95),12,'rgba(10,13,33,0.92)');
  ctx.restore();
}

// Lumora UI port: ported from src/components/game/RunSummary.tsx -- "Night
// Complete" / "The lights are home", three stat rows (Light Delivered /
// Coins Earned / Village Restored, each a THIS-RUN delta, not an all-time
// total), Continue as the clear primary action, "Visit the workshop" as a
// quiet secondary link below it. Restoration-% delta logic (Depth Pass
// Part 1) and the "N fireflies never made it home" line are preserved,
// just reframed into the new stat-row layout instead of stacked loose text.
function drawOver(){
  const a=Math.min(1,S.overT*1.6);
  ctx.fillStyle='rgba(8,10,26,'+(a*0.72)+')';
  ctx.fillRect(0,0,W,H);

  lumGlow('The lights are home',W/2,H*0.22+38,28,'center');

// Premium Transparent Glassmorphism Redesign: rewritten per direct feedback
// that the previous version (0.36-0.4 fill alpha, flat 0.24-alpha white
// border) still read as "a dark rectangle with a slight glass effect," not
// genuine glass. This is now the ONE shared glass material for the whole
// Workshop -- every tab's cards use this exact function (see the lumPanel
// -> lumGlassPanel swaps below), never a second competing panel system.
// Layers, in order: (1) a soft ambient outer glow so the glass feels like
// it's floating over the scene, not pasted flat onto it; (2) a genuinely
// low-alpha (0.2 top / 0.24 bottom, down from 0.36/0.4) translucent fill --
// the background is meant to read clearly through this, not just tint it;
// (3) one gradient-stroked edge that does "champagne highlight at the top,
// fading to a faint violet-blue lower edge" in a single pass, instead of a
// flat bright border or a separate gold frame; (4) a very low-alpha
// warm-white sheen near the top, clipped to the panel shape, standing in
// for a glass reflection. lumPanel() itself is completely untouched --
// still used byte-for-byte by village/journal/pause, exactly as before.
function lumGlassPanel(x,y,w,h,r){

// Resolves which live gameplay object (if any) the current step should
// highlight -- reads the exact same state the trigger conditions in
// tutorialCheckAdvance() already watch, nothing duplicated. 'village' has
// no single object (it's the delivery zone itself), handled separately in
// drawTutorialHighlight() below.
function tutorialHighlightTarget(kind){
  if(kind==='firefly')return S.flies.length?{x:S.flies[0].x,y:S.flies[0].y}:null;
  if(kind==='moth')return S.moths.length?{x:S.moths[0].x,y:S.moths[0].y}:null;
  if(kind==='magnet')return S.magnet?{x:S.magnet.x,y:S.magnet.y}:null;
  return null;
}
// A subtle animated cue from the jar toward the target -- a few small
// traveling glow dots along the straight line between them, plus a soft
// pulsing ring around the target itself (or, for 'village', a dashed line
// at the actual delivery boundary, echoing the existing "the village"
// marker's own visual language rather than inventing a new one). Purely
// derived from S.t and existing live positions -- no new per-frame state.
function drawTutorialHighlight(kind){
  if(!kind)return;
  const jx=S.jar.x, jy=S.jar.y;
  const pulse=0.5+0.5*Math.sin(S.t*4);
  if(kind==='village'){
    ctx.save();
    ctx.globalAlpha=0.4+0.3*pulse;
    ctx.strokeStyle='rgba(255,214,110,0.85)'; ctx.lineWidth=2;
    ctx.setLineDash([8,8]);
    ctx.beginPath(); ctx.moveTo(26,DELIVER_Y); ctx.lineTo(W-26,DELIVER_Y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    for(let i=0;i<3;i++){
      const t=(S.t*0.5+i/3)%1;
      const cy=lerp(jy,DELIVER_Y,t);
      ctx.globalAlpha=(1-t)*0.7;
      ctx.drawImage(glowSprite(GLOW_Y,7),jx-7,cy-7,14,14);
    }
    ctx.globalAlpha=1;
    return;
  }
  const tgt=tutorialHighlightTarget(kind);
  if(!tgt)return;
  for(let i=0;i<3;i++){
    const t=(S.t*0.6+i/3)%1;
    const cx=lerp(jx,tgt.x,t), cy=lerp(jy,tgt.y,t);
    ctx.globalAlpha=(1-t)*0.7;
    ctx.drawImage(glowSprite(kind==='moth'?'rgba(214,90,90,1)':GLOW_Y,6),cx-6,cy-6,12,12);
  }
  ctx.globalAlpha=1;
  ctx.save();
  ctx.globalAlpha=0.5+0.4*pulse;
  ctx.strokeStyle=kind==='moth'?'rgba(214,90,90,1)':'rgba(255,214,110,1)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(tgt.x,tgt.y,22+pulse*6,0,6.28); ctx.stroke();
  ctx.restore();
}

// Moth-collision feedback -- always-on gameplay polish, NOT tutorial-gated
// (every player benefits, not just new ones during the MOTH step). Fires
// from S.mothWarnT, set in update()'s existing "moth interrupt" block at
// the exact moment a moth actually scares a locked-in firefly -- the real
// existing consequence, not mere proximity. ~0.65s one-shot decay, same
// layered-gradient edge technique as drawFullJarAlert() but red and much
// briefer, per direct instruction against a huge/permanent overlay.
function drawMothWarningFlash(){
  if(S.mothWarnT<=0)return;
  const a=Math.max(0,Math.min(1,S.mothWarnT/0.65));
  ctx.save();
  const bandW=20;
  const mkGrad=(x0,y0,x1,y1)=>{ const g=ctx.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,'rgba(214,70,70,'+(0.5*a)+')'); g.addColorStop(1,'rgba(214,70,70,0)'); return g; };
  ctx.fillStyle=mkGrad(0,0,0,bandW); ctx.fillRect(0,0,W,bandW);
  ctx.fillStyle=mkGrad(0,H,0,H-bandW); ctx.fillRect(0,H-bandW,W,bandW);
  ctx.fillStyle=mkGrad(0,0,bandW,0); ctx.fillRect(0,0,bandW,H);
  ctx.fillStyle=mkGrad(W,0,W-bandW,0); ctx.fillRect(W-bandW,0,bandW,H);
  ctx.globalAlpha=a*0.85;
  ctx.strokeStyle='rgba(214,70,70,1)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(S.jar.x,S.jar.y,34+(1-a)*16,0,6.28); ctx.stroke();
  ctx.globalAlpha=Math.min(1,a*1.6);
  ctx.fillStyle='#f2a0a0'; ctx.font='700 18px Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText('⚠ MOTH!',S.jar.x,S.jar.y-58);
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='top';
}

// Home Page Premium UI Refinement pass: `premium` mode rewritten per
// direct feedback that the previous version (bright radial gold fill,
// three glow rings, four diamond points, a tiny star) had overshot into
// "too bright and visually heavy" -- explicitly "DO NOT copy the elaborate
// glowing medallion" this time. Now: a DARK translucent glass interior
// (same violet-navy family as lumGlassPanel, for visual consistency with
// the rest of the UI), one thin gold border + one subtle secondary inner
// border, a small soft ambient glow (not a bloom), a restrained top-left
// highlight arc (not a full radial fill), and gold text (was dark brown --
// the interior is dark now, so the text needs to be the light element for
// contrast). The other two call sites (WELCOME_CLOSE_BTN's "continue", the
// pause menu's RESUME_BTN) still omit `premium` and get the exact original
// flat-gold orb with dark brown text, completely unchanged.
function glowOrb(btn,label,premium){
  const pl=1+0.03*Math.sin(S.t*3);
  if(premium){
    // Home Page Premium UI Refinement pass, "light inspiring" tweak: the
    // dark-glass version read as too flat/inert, per direct feedback --
    // added a slow-breathing warm light living INSIDE the glass (like a
    // candle behind it), and a touch more presence to the outer ambient
    // glow. Border/rings/text untouched from the previous restrained pass.
    const breathe=0.5+0.5*Math.sin(S.t*0.7);
    ctx.globalAlpha=0.45+0.12*breathe;
    ctx.drawImage(glowSprite(GLOW_Y,btn.r*1.35),btn.x-btn.r*1.35,btn.y-btn.r*1.35,btn.r*2.7,btn.r*2.7);
    ctx.globalAlpha=1;
    const ig=ctx.createRadialGradient(btn.x,btn.y,0,btn.x,btn.y,btn.r*pl);
    ig.addColorStop(0,'rgba(42,34,62,0.88)'); ig.addColorStop(1,'rgba(16,12,28,0.94)');
    ctx.fillStyle=ig;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.clip();
    // warm inner light -- a soft glowing core, breathing slowly, so the
    // dark glass reads as lit from within rather than just dark
    const core=ctx.createRadialGradient(btn.x,btn.y,0,btn.x,btn.y,btn.r*0.85);
    core.addColorStop(0,'rgba(255,214,140,'+(0.22+0.1*breathe)+')');
    core.addColorStop(0.6,'rgba(243,199,95,'+(0.08+0.05*breathe)+')');
    core.addColorStop(1,'rgba(243,199,95,0)');
    ctx.fillStyle=core; ctx.fillRect(btn.x-btn.r,btn.y-btn.r,btn.r*2,btn.r*2);
    const hl=ctx.createRadialGradient(btn.x-btn.r*0.32,btn.y-btn.r*0.35,0,btn.x-btn.r*0.32,btn.y-btn.r*0.35,btn.r*0.95);
    hl.addColorStop(0,'rgba(255,231,163,0.2)'); hl.addColorStop(1,'rgba(255,231,163,0)');
    ctx.fillStyle=hl; ctx.fillRect(btn.x-btn.r,btn.y-btn.r,btn.r*2,btn.r*2);
    ctx.restore();
    ctx.strokeStyle='#F3C75F'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.stroke();
    ctx.strokeStyle='rgba(255,231,163,0.32)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl-6,0,6.28); ctx.stroke();
    ctx.save();
    ctx.shadowColor='rgba(255,214,140,0.5)'; ctx.shadowBlur=6+3*breathe;
    ctx.fillStyle='#FFE7A3'; ctx.font='600 22px Georgia,serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,btn.x,btn.y);
    ctx.restore();
    return;
  } else {
    ctx.drawImage(glowSprite(GLOW_Y,btn.r*1.6),btn.x-btn.r*1.6,btn.y-btn.r*1.6,btn.r*3.2,btn.r*3.2);
    ctx.fillStyle='#f0b95c';
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.fill();
    ctx.fillStyle='#3a2a14'; ctx.font='600 24px Georgia,serif';
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,btn.x,btn.y);
}

// file's existing "simple monochrome symbol, not a colored glyph"

function drawMiniTrophy(cx,cy,color){
  ctx.save();

  ctx.beginPath(); ctx.arc(cx,cy-2,5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();

// Home Page Premium UI pass: visual/UI polish only, per direct instruction
// -- renderBG()/drawVillage()/drawMoon() (the SHARED background/village/
// moon rendering, also used by actual gameplay) are deliberately untouched
// here; only this screen's own scrim/foreground chrome changed. Layout
// reordered to match the requested hierarchy: BEGIN -> Shop/Village/
// Journal -> Best Score -> studio branding (Best Score used to sit ABOVE
// the nav row; now below it, per direct instruction) -- text/position
// only, no hit-test coordinates besides titleNavRects()'s own size moved.
function drawTitle(){
  const a=Math.min(1,S.t*0.7);
  // scrim over the still-animating village
  const cx=W/2, cy=H/2, rad=Math.hypot(W,H)/2;
  const scrim=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  scrim.addColorStop(0,'rgba(8,10,26,0.18)');
  scrim.addColorStop(1,'rgba(8,10,26,0.66)');
  ctx.globalAlpha=a; ctx.fillStyle=scrim; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  // ambient drifting fireflies -- a tiny solid core + two soft wing curves
  // on top of the glow, same shape language as the real in-round drawFly()
  // (core dot + quadratic wing strokes), not just a bare glow blob (which
  // read as "a ball", per direct feedback).
  for(const f of titleFlies){
    const x=f.x+Math.sin(S.t*f.fx+f.px)*f.ax;
    const y=f.y+Math.cos(S.t*f.fy+f.py)*f.ay;
    const tw=0.4+0.6*Math.abs(Math.sin(S.t*f.tw+f.pt));
    ctx.globalAlpha=a*tw*0.75; // glow itself dimmed a touch so it stops burying the body
    ctx.drawImage(glowSprite(f.color,f.r),x-f.r,y-f.r,f.r*2,f.r*2);
    ctx.globalAlpha=a*tw;
    ctx.fillStyle='#fff6d8';
    ctx.beginPath(); ctx.arc(x,y,2.6,0,6.28); ctx.fill();
    ctx.globalAlpha*=0.7;
    ctx.strokeStyle='#fff6d8'; ctx.lineWidth=1.3;
    const wa=Math.sin(f.pt+S.t*6)*0.5;
    ctx.beginPath(); ctx.moveTo(x-2,y-2); ctx.quadraticCurveTo(x-7,y-7-wa*3,x-9,y-3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+2,y-2); ctx.quadraticCurveTo(x+7,y-7-wa*3,x+9,y-3); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // breathing halo behind the wordmark
  const br=0.5+0.5*Math.sin(S.t*0.55), hr=200+br*36;
  ctx.globalAlpha=a*(0.16+0.14*br);
  ctx.drawImage(glowSprite(GLOW_Y,hr),W/2-hr,H*0.30-hr,hr*2,hr*2);
  ctx.globalAlpha=1;
  // thin gold ornamental divider ABOVE the wordmark too (was only below it)
  ornament(H*0.30-64,a,44);
  // antique-gold wordmark (was the shared pale-cream default) -- Workshop-
  // matching palette, title screen's own color choice via wordmark()'s
  // existing optional params; every other wordmark() call site untouched.
  wordmark(H*0.30,78,a,'#F3C75F','rgba(183,122,36,0.35)');
  ctx.globalAlpha=a;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#B9B3D6'; ctx.font='italic 21px Georgia,serif';
  try{ ctx.letterSpacing='1.5px'; }catch(e){}
  const subY=H*0.30+62, subText='a glowkeeper story';
  ctx.fillText(subText,W/2,subY);
  const subW=ctx.measureText(subText).width;
  try{ ctx.letterSpacing='0px'; }catch(e){}
  ctx.fillStyle='rgba(243,199,95,0.55)'; ctx.font='11px Georgia,serif';
  ctx.fillText('✦',W/2-subW/2-16,subY);
  ctx.fillText('✦',W/2+subW/2+16,subY);
  ctx.globalAlpha=1;
  ornament(H*0.30+100,a,60);
  ctx.globalAlpha=a;
  // Home Page Premium UI Refinement pass: the drifting gold motes that used
  // to orbit BEGIN here are removed -- per direct feedback the button
  // itself needed to read as "quiet magical artifact", not "giant glowing
  // power button", and extra particles around it worked against that.
  glowOrb(BEGIN_BTN,'begin',true);
  ctx.globalAlpha=a;
  // Lumora UI port: TitleScreen.tsx's secondary nav row (Shop/Village/
  // Journal -- Settings excluded, Quests removed by the LUMORA
  // clarifications pass in favor of the Village's own Tonight's Quest
  // card). Single source of truth via titleNavRects(), shared with the
  // pointerdown hit-test -- drawTitleNavCard() (NEW) replaces the old
  // plain lumButton('quiet') pill, reusing lumGlassPanel (the same
  // translucent glass the Workshop uses) instead of a flat navy fill.
  // Each card gets its own restrained accent per direct instruction: Shop
  // warm gold (craft), Village gold+green (life/restoration), Journal
  // gold+violet (memory/story).
  const NAV_ACCENTS={shop:'rgba(243,199,95,0.9)', village:'rgba(164,214,150,0.75)', journal:'rgba(190,150,230,0.75)'};
  titleNavRects().forEach(btn=>{ drawTitleNavCard(btn,btn.label,btn.key,NAV_ACCENTS[btn.key]); });
  // Best Score -- was a bare text line ABOVE the nav row; now a small
  // glass capsule BELOW it (matching the requested hierarchy), with a
  // tiny procedural trophy instead of a colored emoji.
  if(best>0){
    const bw=176, bh=32, by=TITLE_NAV_Y+32+34, bx=W/2-bw/2;
    lumGlassPanel(bx,by-bh/2,bw,bh,bh/2);

    ctx.fillStyle='rgba(185,179,214,0.85)'; ctx.font='500 11px Georgia,serif';
    ctx.fillText('BEST',bx+46,by);
    ctx.fillStyle='#F3C75F'; ctx.font='600 16px Georgia,serif';
    ctx.fillText('✦ '+best,bx+92,by+1);
  }
  ctx.fillStyle='rgba(90,98,136,0.75)'; ctx.font='12px Georgia,serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Solotov Studios',W/2,H-40);
  ctx.globalAlpha=1;

// ---------- shop (Stage 2 Part B) ----------
// Reuses the same procedural-canvas approach as everything else (drawHeart,
// drawVillage, renderBG, drawJar) — no images, no new asset pipeline. Vendor
// "avatars" are simple painted busts from the existing palette (cream, forest
// green, midnight blue, warm amber, soft orange, deep indigo), not portraits.
function wrapText(text,x,y,maxWidth,lineHeight,align){
  ctx.textAlign=align||'center';
  const words=text.split(' ');
  let line='', ly=y;
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxWidth&&line){ ctx.fillText(line,x,ly); line=words[i]+' '; ly+=lineHeight; }
    else line=test;
  }
  ctx.fillText(line,x,ly);
  return ly+lineHeight;
}
// Lumora UI port: no more little procedural vendor-character portraits --
// the new design language is jar/light iconography, not shopkeeper sprites.
// drawJarPreview is the shared, lightweight jar renderer for every shop/UI
// context that needs to show a jar WITHOUT the full gameplay state drawJar()
// depends on (S.carried/S.jar position/pulse/shake) -- same vector path as
// drawJar() for visual consistency, parameterized by an arbitrary jar object
// and fill percentage instead.
// Shop UI Visual Redesign, quality pass: per direct feedback that the shop
// jars read as flat placeholder blobs next to the reference art. Same
// silhouette as before (and as drawJar()'s real gameplay jar -- untouched,
// this function is shop-presentation only), but shaded like the reference:
// a grounding shadow, cylindrical glass shading (dark-light-dark across the
// body instead of one flat fill), a genuine light-catching highlight
// streak, a wood-toned (not flat-color) lid with a metal rim, and -- in
// `detailed` mode only (the large hero card) -- a second highlight, a
// bright core point, and a few scattered sparkle flecks, matching the
// reference's own hero-vs-grid detail split (its big Crystal Lantern hero
// has visible internal sparkle; its small grid jars don't).
function drawJarPreview(cx,cy,scale,jarObj,fillPct,detailed){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(scale,scale);
  // grounding drop shadow
  ctx.globalAlpha=0.3;
  ctx.fillStyle='#000000';
  ctx.beginPath(); ctx.ellipse(1,25,19,5,0,0,6.28); ctx.fill();
  ctx.globalAlpha=1;
  const bodyPath=()=>{
    ctx.beginPath();
    ctx.moveTo(-19,-30);
    ctx.quadraticCurveTo(-27,-24,-27,-8);
    ctx.quadraticCurveTo(-27,16,-18,20);
    ctx.lineTo(18,20);
    ctx.quadraticCurveTo(27,16,27,-8);
    ctx.quadraticCurveTo(27,-24,19,-30);
    ctx.closePath();
  };
  ctx.fillStyle=jarObj.glass; ctx.strokeStyle=jarObj.glassStroke; ctx.lineWidth=2.5;
  bodyPath(); ctx.fill(); ctx.stroke();
  // cylindrical shading, clipped to the glass body -- darker at both far
  // edges, a soft lit band left-of-center, so the glass reads as ROUND
  // rather than a flat tinted rectangle.
  ctx.save();
  bodyPath(); ctx.clip();
  const shade=ctx.createLinearGradient(-27,0,27,0);
  shade.addColorStop(0,'rgba(0,0,0,0.18)');
  shade.addColorStop(0.3,'rgba(255,255,255,0.06)');
  shade.addColorStop(0.6,'rgba(0,0,0,0)');
  shade.addColorStop(1,'rgba(0,0,0,0.24)');
  ctx.fillStyle=shade; ctx.fillRect(-27,-30,54,50);
  ctx.restore();
  // glass highlight streak(s) -- the single clearest "this is glass, not
  // plastic" cue the reference relies on. Always at least one; detailed
  // mode adds a thinner second streak for extra richness at hero scale.
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2.2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-17,-23); ctx.quadraticCurveTo(-22,-9,-20,10); ctx.stroke();
  if(detailed){
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(-9,-25); ctx.quadraticCurveTo(-12,-13,-11,-1); ctx.stroke();
  }
  // lid -- a wood-toned gradient (light top edge -> base tone -> darker
  // underside) instead of one flat fill, plus fine grain lines at hero
  // scale, then the existing darker metal rim band underneath.
  const lidG=ctx.createLinearGradient(0,-38,0,-28);
  lidG.addColorStop(0,lerpColorAny(jarObj.lid,'#ffffff',0.3));
  lidG.addColorStop(0.5,jarObj.lid);
  lidG.addColorStop(1,lerpColorAny(jarObj.lid,'#000000',0.3));
  ctx.fillStyle=lidG;
  ctx.beginPath(); ctx.roundRect(-21,-38,42,10,4); ctx.fill();
  if(detailed){
    ctx.strokeStyle='rgba(0,0,0,0.16)'; ctx.lineWidth=1;
    [-35.5,-33,-30.5].forEach(ly=>{ ctx.beginPath(); ctx.moveTo(-18,ly); ctx.lineTo(18,ly); ctx.stroke(); });
  }
  ctx.fillStyle=jarObj.lidRim; ctx.beginPath(); ctx.roundRect(-19,-31,38,3,2); ctx.fill();
  // inner glow (unchanged formula/position from before)
  const igRGB=toRgbTriple(jarObj.glow);
  const ig=ctx.createRadialGradient(0,0,2,0,0,26);
  ig.addColorStop(0,'rgba('+igRGB+','+(0.25+fillPct*0.55)+')');
  ig.addColorStop(1,'rgba('+igRGB+',0)');
  ctx.fillStyle=ig; ctx.fillRect(-27,-30,54,50);
  // bright core + a few scattered sparkle flecks -- detailed (hero) only
  if(detailed){
    ctx.fillStyle='#ffffff';
    ctx.globalAlpha=0.9; ctx.beginPath(); ctx.arc(-2,-2,2,0,6.28); ctx.fill(); ctx.globalAlpha=1;
    [[-9,-10],[7,-13],[10,4],[-8,9],[2,12]].forEach(([fx,fy],i)=>{
      ctx.globalAlpha=0.3+0.4*Math.abs(Math.sin(S.t*1.7+i*1.9));
      ctx.beginPath(); ctx.arc(fx,fy,0.9,0,6.28); ctx.fill();
    });
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
// lerpColor requires both inputs to already be hex -- jar lid/lidRim
// values always are, but this small wrapper guards against a future
// non-hex value (an rgba() lid tone, say) reaching lerpColor and throwing,
// by falling back to the plain color unmodified instead of crashing the
// whole shop screen over a cosmetic gradient stop.
function lerpColorAny(hex,target,t){
  return hex&&hex[0]==='#'?lerpColor(hex,target,t):hex;
}
// Lumora UI port: EquippedJar hero card -- ported from
// src/components/shop/EquippedJar.tsx (jar preview + name + description +
// capacity + an "EQUIPPED" tag).
function drawEquippedJarHero(){
  const r=EQUIPPED_JAR_RECT, jar=currentJar();

// Lumora UI port: Jar Collection grid -- ported from

// Trail System Redesign: a compact preview using the SAME glowSprite()
// infrastructure the real trail particles use (not a separate preview
// renderer) -- a short arc of small dots in the trail's own hues, gently
// bobbing via S.t so it doesn't read as a dead swatch. No new particle
// simulation, no animation loop of its own -- matches section 16's "if
// animation would add unnecessary complexity, use a compact static-style
// preview" guidance.
// Premium Transparent Glassmorphism Redesign: added a soft curved ribbon
// stroke beneath the existing sparkle dots (still the SAME positions/
// animation/glowSprite infrastructure as before) so the preview reads as
// one continuous flowing particle trail rather than isolated dots, per
// direct feedback ("a small elegant flowing particle ribbon rather than a
// flat line"). Cheap addition -- one extra stroke with a handful of
// lineTo() calls, no new particle simulation.
function drawTrailPreview(cx,cy,hues){
  if(!hues||!hues.length){
    ctx.strokeStyle='rgba(174,184,203,0.3)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.arc(cx,cy,15,0,6.28); ctx.stroke();
    return;
  }
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<=12;i++){
    const t=i/12, a=Math.PI*0.7+t*Math.PI*0.9, r=15-t*9;
    const px=cx+Math.cos(a)*13, py=cy+Math.sin(a)*9+Math.sin(S.t*1.5+t*3)*1.4;
    if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  const ribbonRGB=toRgbTriple(hues[0]);
  ctx.strokeStyle='rgba('+ribbonRGB+',0.3)'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.stroke();
  ctx.restore();
  for(let i=0;i<4;i++){
    const t=i/3, a=Math.PI*0.7+t*Math.PI*0.9, r=15-t*9;
    const px=cx+Math.cos(a)*13, py=cy+Math.sin(a)*9+Math.sin(S.t*1.5+i)*1.4;
    ctx.globalAlpha=0.5+0.5*(1-t);
    ctx.drawImage(glowSprite(hues[i%hues.length],r*0.9),px-r*0.9,py-r*0.9,r*1.8,r*1.8);
  }
  ctx.globalAlpha=1;
}

function questRewardLabel(q){
  if(q.reward.kind==='coins')return q.reward.val+' coins';

  if(q.reward.kind==='luck')return q.reward.val+'s luck boost';

// has always had a live fallback (grant the coin-equivalent instead, once
// Garden Lanterns are already owned) -- but since all 3 quests reroll every
// single day, that fallback becomes the COMMON case for deliver20 after day
// 1, not a rare edge case. questRewardLabel(q) alone always says "Garden
// Lanterns" regardless of which will actually happen. This one function is
// the single source of truth for "will this deco reward actually fall back
// to coins" — reads the exact same live upgrades.deco check
// grantQuestReward() itself uses, so preview and reality can never drift apart.
function questWillFallbackToCoins(q){ return q.reward.kind==='deco'&&upgrades.deco; }
// pre-completion preview: what will ACTUALLY happen if this quest is
// finished right now. Reuses questRewardLabel() for every case except the

function questRewardPreviewLabel(q){ return questWillFallbackToCoins(q)?(q.reward.val+' coins'):questRewardLabel(q); }
// post-completion: what ACTUALLY happened, read from q.grantedKind/
// grantedVal -- recorded once, at the exact moment grantQuestReward() ran
// (not recomputed from live state, since upgrades.deco may have changed
// again by the time this renders). Falls back to the live preview for a
// quest that was already done() before this field existed — safe migration
// for an old save, same "degrade gracefully" discipline as every other field.
function questGrantedLabel(q){
  if(q.grantedKind==='coins')return q.grantedVal+' coins';
  if(q.grantedKind==='deco')return 'Garden Lanterns';
  if(q.grantedKind==='luck')return q.grantedVal+'s luck boost';

// on the recorded kind (not string-sniffing questGrantedLabel()'s text) so
// it stays correct regardless of the exact wording above.
function questGrantedMessage(q){
  const kind=q.grantedKind||(questWillFallbackToCoins(q)?'coins':q.reward.kind); // same old-save migration fallback as questGrantedLabel()
  const val=q.grantedVal!=null?q.grantedVal:q.reward.val;
  if(kind==='deco')return 'Garden Lanterns added to the village.';
  if(kind==='luck')return 'A '+val+'s luck boost was granted.';

      ctx.fillStyle='rgba(174,184,203,0.8)'; ctx.font='italic 12px Georgia,serif'; ctx.textBaseline='top';
      wrapText(discovered?T.desc:'Catch one to record it in the journal.',tx,rect.y+38,rect.w-76-70,14,'left');
      ctx.fillStyle='rgba(174,184,203,0.7)'; ctx.font='500 10px Georgia,serif'; ctx.textAlign='right'; ctx.textBaseline='alphabetic';
      ctx.fillText('CAUGHT',rect.x+rect.w-16,rect.y+28);
      ctx.fillStyle=LUM_CREAM; ctx.font='500 18px Georgia,serif';
      ctx.fillText(caught+'',rect.x+rect.w-16,rect.y+50);
    });
  }
  ctx.textAlign='center'; ctx.textBaseline='top';
}
// ---------- welcome-back overlay (Stage 3 Part C, Section 6.5) ----------
// Drawn ON TOP of the title screen (see showWelcomeBack), never a separate
// `screen` value — so it structurally cannot delay or reorder gameReady,
// which only ever checks screen==='title'. Content is derived entirely from
// existing data (best + LIGHTS' own thresholds via homesRestoredCount()) —
// no new stat invented. Dismiss mirrors the shop's own close-button + Esc
// convention, plus a generous "tap anywhere near the button" target since
// this is the overlay's only action.
// Lumora UI port: ported from src/pages/WelcomeBackScreen.tsx -- eyebrow +
// glow title, a 2-up Village/Coins stat grid, a "Tonight's Night" card
// reading the SAME live weather system already driving gameplay (not a
// second, parallel weather picker), Continue button. Kept as a non-blocking
// overlay on top of the title screen, same architecture as before (see the
// comment on showWelcomeBack itself for why that matters for gameReady).
function drawWelcomeBack(){
  const cx=W/2, cy=H/2, rad=Math.hypot(W,H)/2;
  const vig=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  vig.addColorStop(0,'rgba(8,10,26,0.9)');
  vig.addColorStop(1,'rgba(8,10,26,0.97)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  lumEyebrow('Welcome Back',W/2,H*0.18,'center');
  ctx.save();
  ctx.font='500 24px Georgia,serif'; ctx.shadowColor='rgba(251,210,107,0.6)'; ctx.shadowBlur=20;
  ctx.fillStyle=LUM_CREAM; ctx.textAlign='center'; ctx.textBaseline='top';
  const titleEnd=wrapText('The village kept your lights burning',W/2,H*0.18+26,420,30,'center');
  ctx.restore();

  const statY=titleEnd+24, statW=200, gap=16, statX0=W/2-statW-gap/2, statX1=W/2+gap/2;
  lumPanel(statX0,statY,statW,90,16);
  lumPanel(statX1,statY,statW,90,16);
  lumEyebrow('Village',statX0+18,statY+26,'left');
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=LUM_CREAM; ctx.font='500 26px Georgia,serif';
  ctx.fillText(restorationPct(best)+'%',statX0+18,statY+62);
  lumEyebrow('Coins',statX1+18,statY+26,'left');
  ctx.fillStyle=LUM_CREAM; ctx.font='500 26px Georgia,serif';
  ctx.fillText(coins.toLocaleString(),statX1+18,statY+62);

  const weatherR={x:W/2-160,y:statY+110,w:320,h:88};
  lumPanel(weatherR.x,weatherR.y,weatherR.w,weatherR.h,16);
  lumEyebrow('Tonight\'s Night',weatherR.x+18,weatherR.y+24,'left');
  ctx.fillStyle=LUM_CREAM; ctx.font='500 15px Georgia,serif'; ctx.textAlign='left'; ctx.textBaseline='top';
  wrapText(WEATHER_INFO[S.weather]?WEATHER_INFO[S.weather].msg:'A quiet night — still air, no rare weather yet.',weatherR.x+18,weatherR.y+38,weatherR.w-36,18,'left');

  ctx.textAlign='center'; ctx.textBaseline='middle';
  glowOrb(WELCOME_CLOSE_BTN,'continue');
  ctx.textBaseline='top';
}
// Lumora UI port: ported from src/components/game/PauseOverlay.tsx --
// "Paused" title, Resume (primary), Restart Night (new, see RESTART_BTN's
// own comment for what was deliberately left out and why). Score/best
// readout preserved from the original.
function drawPaused(){
  const cx=W/2, cy=H/2, rad=Math.hypot(W,H)/2;
  const vig=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  vig.addColorStop(0,'rgba(8,10,26,0.62)');
  vig.addColorStop(1,'rgba(8,10,26,0.9)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  lumEyebrow('Paused',W/2,H*0.28,'center');
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  lumGlow('The night waits',W/2,H*0.28+36,26,'center');
  ctx.fillStyle=LUM_CREAM; ctx.font='600 22px Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('✦ '+S.score,W/2,H*0.32+90);
  ctx.fillStyle='rgba(174,184,203,0.85)'; ctx.font='500 15px Georgia,serif';
  ctx.fillText('best '+best,W/2,H*0.32+118);
  if(pauseReason==='user'){
    if(pauseConfirm==='restart'){
      drawConfirmModal('Restart this night?','Your current night progress will be lost. Any fireflies currently held in your jar will be discarded. Your permanent coins, upgrades, equipped jar, village restoration, and journal progress will remain safe.','Restart Night');
    } else if(pauseConfirm==='gohome'){
      drawConfirmModal('Leave this night?','Your current collected light will be lost. Permanent progress will remain safe.','Go Home');
    } else {
      glowOrb(RESUME_BTN,'resume');
      lumButton(RESTART_BTN,'Restart Night','outline');
      lumButton(GOHOME_BTN,'Go Home','quiet');
    }
  }
  ctx.textBaseline='top';
}
function draw(){
  drawVillage();
  drawMoon();
  if(screen==='play'){
    if(S.magnet)drawMagnet(S.magnet);
    for(const f of S.flies)drawFly(f);
    for(const m of S.moths)drawMoth(m);
    drawDeliverWaves();
    drawSparks();
    drawJar();
    drawJarRarity(); // D2 (B3): rare-carry ring/motes, layered right on the jar it orbits
    drawDeliveryComposite(); // D2 (B1/B2): perfect/rare delivery reveal, above the jar
    for(const p of S.parts){
      // Trail System Redesign: optional peak-alpha multiplier (p.a), used by
      // the new layered trail particles below so different layers (soft
      // glow/medium/spark/highlight) can have different peak brightness, not
      // just different life/size. Backward-compatible: every OTHER particle
      // source in the file (catch streaks, fountain droplets, puff(), etc.)
      // never sets p.a, so `?? 1` leaves their existing behavior byte-for-byte
      // unchanged.
      ctx.globalAlpha=Math.max(0,p.life/p.maxL)*(p.a??1);
      ctx.drawImage(glowSprite(p.color,p.r*4),p.x-p.r*4,p.y-p.r*4,p.r*8,p.r*8);
    }
    ctx.globalAlpha=1;
    drawHUD();
    if(S.carried.length>=S.cap&&!S.over)drawFullJarAlert();
    drawMothWarningFlash(); // always-on gameplay feedback, independent of the tutorial
    if(newNightCardVisible())drawNewNightCard(); // D1: drawn over live gameplay + HUD, per direct spec ("nothing is gated: the jar is spawned")
    if(S.over)drawOver();
    if(S.extraLifeOfferOpen)drawExtraLifeOffer(); // shown INSTEAD of drawOver() the instant the normal 5-miss ending is reached -- S.over is still false while this is up
    if(paused)drawPaused();
    if(tutorialPanelOpen)drawTutorialPanel(); // topmost overlay, same precedent as drawPaused()/drawOver() above
  } else if(screen==='contract'){
    drawContractScreen();
  } else if(screen==='shop'){
    drawShop();
  } else if(screen==='village'){
    drawVillageScreen();
  } else if(screen==='journal'){
    drawJournalScreen();
  } else {
    drawTitle();
    // welcome-back is an overlay ON TOP of the title screen, not its own
    // `screen` value — see maybeShowWelcomeBack()'s comment for why that
    // matters for the gameReady lifecycle hook
    if(showWelcomeBack)drawWelcomeBack();
  }
}

// ---------- loop ----------
let lastT=performance.now();
function loop(now){
  if(cv.width===0||window.innerWidth!==lastVW||window.innerHeight!==lastVH)resize(); // catches viewport changes even without a 'resize' event (e.g. fullscreen exit in some hosts)
  let dt=Math.min(0.033,(now-lastT)/1000); lastT=now;
  // First-Night Tutorial: an open tutorial panel gates simulation the exact
  // same way `paused` already does -- fireflies/moths/timers all freeze,
  // draw() still runs every frame so the frozen scene + panel actually
  // render. Does not touch paused/pauseReason at all, per direct
  // instruction not to interfere with the existing pause/resume system.
  // "One More Chance" gates simulation the exact same sibling way the
  // tutorial panel already does -- see requestExtraLife()/declineExtraLife().
  // D1: the new-night reveal card's own clock advances even while it gates
  // update(dt) below (same "the card's timer keeps going, gameplay's
  // timers don't" split the spec itself calls for) -- a tap dismiss jumps
  // S.newNightT straight to the 4.30 keyframe (see the pointerdown guard),
  // so this increment is the ONLY normal path that advances it otherwise.
  if(screen==='play')S.newNightT+=dt;
  // D3: the contract screen's own clock -- see contractScreenAt's own
  // comment. Not part of S, not gated by paused/tutorial (none of those
  // apply on this screen), so it advances unconditionally while shown.
  // Once the 280ms ACCEPT exit finishes, hand off to actual play.
  if(screen==='contract'){
    contractScreenAt+=dt;
    if(contractExitAt>=0&&contractScreenAt-contractExitAt>=0.28)finishContractAccept();
  }
  if(!paused&&!tutorialPanelOpen&&!S.extraLifeOfferOpen&&!newNightCardActive())update(dt);
  draw(); // renders the title screen (our splash/main-menu) on the very first call

  // Lifecycle Hook 1: the first visual frame is now on screen.
  if(!firstFrameSent&&cv.width>0){
    firstFrameSent=true;
    if(YT&&YT.game&&YT.game.firstFrameReady){ try{ YT.game.firstFrameReady(); }catch(e){} }
  }
  // Lifecycle Hook 2: the title screen is our main menu and is interactive
  // (its "begin" button is hit-testable) as soon as it's drawn — signal
  // gameReady the moment that screen is actually showing.
  if(!gameReadySent&&cv.width>0&&screen==='title'){
    gameReadySent=true;
    if(YT&&YT.game&&YT.game.gameReady){ try{ YT.game.gameReady(); }catch(e){} }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// NOTE: no Page Visibility API usage — pause/resume is driven exclusively by ytgame.system hooks (platform requirement).
</script>
