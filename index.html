// whatever the player watched escalate mid-round), delivery marks right --
// each independently present, no heading (the marks already self-identify).

const BONUS_ROW_CHAIN_FLOOR=3;
function nightCompleteHasBonusRow(){
  return S.bestChainThisRound>=BONUS_ROW_CHAIN_FLOOR||S.perfectDeliveryCount>0||S.rareDeliveryCount>0;

function drawBonusRow(panelR,b){
  const L=panelR.x+22, R=panelR.x+panelR.w-18, ch=S.bestChainThisRound, pf=S.perfectDeliveryCount, ra=S.rareDeliveryCount;
  const T=d2TierOf(ch);
  const marks=[];
  if(pf>0)marks.push({g:'star',s:pf>1?'PERFECT ×'+pf:'PERFECT'});
  if(ra>0)marks.push({g:'mote',s:ra>1?'RARE ×'+ra:'RARE'});
  ctx.font='600 10.5px Georgia,serif'; try{ ctx.letterSpacing='1.4px'; }catch(e){}
  let word=ch>=BONUS_ROW_CHAIN_FLOOR?'BEST CHAIN':'';
  const num=ch>=BONUS_ROW_CHAIN_FLOOR?'×'+ch:'';
  const wordW=()=>{ const w=ctx.measureText(word).width; return w; };
  ctx.font='600 12.5px Georgia,serif'; const numW=ctx.measureText(num).width;
  const marksW=()=>marks.reduce((s,m)=>{ ctx.font='600 10.5px Georgia,serif'; try{ ctx.letterSpacing='1.4px'; }catch(e){} return s+15+ctx.measureText(m.s).width+16; },0)-16;
  ctx.font='600 10.5px Georgia,serif'; try{ ctx.letterSpacing='1.4px'; }catch(e){}
  const lw=()=>word?(wordW()+6+numW):0;
  try{ ctx.letterSpacing='0px'; }catch(e){}
  if(word&&lw()+20+Math.max(0,marksW())>R-(L+18))word='CHAIN'; // overflow rung 1: drop "BEST "
  if(ch>=BONUS_ROW_CHAIN_FLOOR){
    d2TierGlyph(T.glyph,L,panelR.y+b,T.gr,T.gc,T.gb?6:0);
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font='600 10.5px Georgia,serif'; try{ ctx.letterSpacing='1.4px'; }catch(e){}
    ctx.fillStyle='rgba(230,217,188,0.9)';
    ctx.fillText(word,L+18,panelR.y+b+4);
    const ww=ctx.measureText(word).width;
    try{ ctx.letterSpacing='0px'; }catch(e){}
    ctx.font='600 12.5px Georgia,serif'; ctx.fillStyle=T.num;
    ctx.fillText(num,L+18+ww+6,panelR.y+b+4.5);
  }
  let x=R-Math.max(0,marksW());
  marks.forEach(m=>{
    if(m.g==='star')star4Glyph(x+6,panelR.y+b,5.5,d2cream(0.95),d2gold(0.4),8);
    else d2RareMote(x+6,panelR.y+b,1.05,1,0,null);
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font='600 10.5px Georgia,serif'; try{ ctx.letterSpacing='1.4px'; }catch(e){}
    ctx.fillStyle='rgba(230,217,188,0.88)';
    ctx.fillText(m.s,x+15,panelR.y+b+4);
    const mw=ctx.measureText(m.s).width;
    try{ ctx.letterSpacing='0px'; }catch(e){}
    x+=15+mw+16;
  });
}

// ---------- Lumora 2.0 D4 (Claude Design spec): Night Event UI ----------
// Like D2/D3's own rendering, ported function-for-function where the
// numbers were genuinely new work. The handoff itself flags the one thing
// that made this phase different from D1-D3: the PLAN assumed an event has
// a visible duration you could count down ("MOONLIGHT 08s") and a distinct
// ending ("MOONLIGHT COMPLETE") -- the real system does neither. An event
// is rolled once in reset() and holds the WHOLE night; there is no timer,
// no expiry, no lump-sum reward to reveal (Moth Swarm's x1.2 is a silent,
// continuous per-delivery multiplier, already folded into nightEventCoinMult()
// and every coin figure the player already sees). So: no countdown, no
// progress ring, no "ending" moment -- exactly as the handoff insists.
//
// t0 (when the announcement starts) is 400ms after the D1 goals card's own
// dismissal keyframe (4.30), i.e. S.newNightT===4.70 -- reusing that
// EXISTING clock rather than adding a new timestamp field, since it already
// counts up continuously from reset() and never resets until the next one.
const EVENT_ANNOUNCE_T0=4.70;
function eventAnnounceElapsed(){ return S.newNightT-EVENT_ANNOUNCE_T0; }
// Active precisely while the composite OR its flight-to-chip is visible.
// Gated on S.isNewNight (already the exact "this is a genuine new night,
// not a restart" signal ensureNightObjectives() sets) -- a restart
// restores the SAME event but must NOT replay the announcement, per
// ensureNightEvent()'s own comment. Also used by drawHUD() to suppress the
// shared hint slot for this same window (decision 1 in the handoff).
function eventAnnounceActive(){
  if(!S.eventActive||!S.isNewNight)return false;
  const t=eventAnnounceElapsed();
  return t>=0&&t<3.92;
}
function d4RainGlyph(cx,cy,r,col,blur){
  ctx.save(); if(blur){ ctx.shadowColor=col; ctx.shadowBlur=blur; }
  const off=[[-0.66,-0.46,0.78],[0,-0.80,1.06],[0.66,-0.30,0.70]];
  ctx.lineCap='round'; ctx.lineWidth=Math.max(0.9,r*0.15); ctx.strokeStyle=col;
  off.forEach(o=>{
    const x=cx+o[0]*r, y=cy+o[1]*r, ex=x-r*0.10, ey=y+o[2]*r;
    ctx.save(); ctx.globalAlpha=0.5;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke(); ctx.restore();
    ctx.beginPath(); ctx.arc(ex,ey,r*0.19,0,6.28); ctx.fillStyle=col; ctx.fill();
  });
  ctx.restore();
}
// crescent/moth are D1's and D3's own existing glyphs, called directly per
// the handoff's own instruction -- rainGlyph (above) is D4's only new one.
function eventGlyph(kind,cx,cy,r,col,blur,carve){
  if(kind==='moon')d3CrescentGlyph(cx,cy,r,col,carve);
  else if(kind==='rain')d4RainGlyph(cx,cy,r,col,blur);
  else d3MothGlyph(cx,cy,r,col,blur);
}
const EVENT_CHIP_RIGHT=526, EVENT_CHIP_Y=208, EVENT_CHIP_H=30; // right edge mirrors D2's chain pill; same row as D3's chip, opposite column
function eventChipMetrics(){
  const e=EVENT_UI[S.eventActive];
  ctx.font='600 9.5px Georgia,serif'; try{ ctx.letterSpacing='1.2px'; }catch(err){}
  const lw=ctx.measureText(e.name).width;
  try{ ctx.letterSpacing='0px'; }catch(err){}
  const w=Math.round(13+13+8+lw+13);
  return {e,lw,w,x:EVENT_CHIP_RIGHT-w};
}
// D4 (E3): persistent, ambient, not tappable -- identical fill/border/
// radius/label styling to D3's contract chip (deliberately: "a fact, not
// an event," per the handoff's own decision 4). Zero draw calls with no
// event active, or once Night Complete has its own summary.
// Deviation from a literal "chip only ever enters via the announcement's
// flight" (the handoff's own stated rule): on a RESTART of the same night,
// S.isNewNight is false so the announcement never replays, but the event
// itself is still genuinely active -- the chip must still show (there is
// no state where an event is active and the player sees no indicator of
// it at all), just without a flight-in. Documented here since the handoff
// itself doesn't anticipate the restart case explicitly.
function drawEventChip(){
  if(!S.eventActive||S.over)return;
  let alpha=1;
  if(S.isNewNight){
    const t=eventAnnounceElapsed();
    if(t<3.62)return; // the announcement's own flight hasn't landed yet -- see drawEventAnnouncement()
    alpha=clamp((t-3.62)/0.30,0,1);
  }
  const m=eventChipMetrics();
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.beginPath(); ctx.roundRect(m.x,EVENT_CHIP_Y,m.w,EVENT_CHIP_H,EVENT_CHIP_H/2);
  ctx.fillStyle='rgba(25,33,67,0.55)'; ctx.fill();
  ctx.strokeStyle=d2haze(0.14); ctx.lineWidth=1; ctx.stroke();
  eventGlyph(m.e.glyph,m.x+19.5,EVENT_CHIP_Y+15,6.5,'rgba('+m.e.rgb+','+(S.eventActive==='mothSwarm'?0.88:0.78)+')',0,'rgba(10,13,33,0.92)');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font='600 9.5px Georgia,serif'; try{ ctx.letterSpacing='1.2px'; }catch(err){}
  ctx.fillStyle=d2haze(0.62);
  ctx.fillText(m.e.name,m.x+34,EVENT_CHIP_Y+19);
  try{ ctx.letterSpacing='0px'; }catch(err){}
  ctx.restore();
}
// D4 (E1): the once-a-night reveal -- its own field composite (270,306-444),
// NOT the shared hint slot (see drawHUD()'s own suppression guard). Never a
// modal: no hit-test, doesn't pause, taps pass through to the field.
function drawEventAnnouncement(){
  if(!S.eventActive||!S.isNewNight)return;
  const t=eventAnnounceElapsed();
  if(t<0||t>=3.92)return;
  const e=EVENT_UI[S.eventActive];
  if(!S.eventAnnounceFired){ S.eventAnnounceFired=true; sEventAnnounce(); }
  const tint=a=>'rgba('+e.rgb+','+a+')';
  const inA=easeOutCubic(clamp(t/0.26,0,1));
  const outA=clamp((t-3.20)/0.24,0,1);
  const base=clamp(inA-outA,0,1);
  const flightP=clamp((t-3.44)/0.42,0,1);
  if(base>0){
    ctx.save(); ctx.globalAlpha=base;
    d2bloom(270,336,150,e.rgb,e.bloom*easeOutCubic(clamp(t/0.32,0,1)));
    const ruleW=lerp(0,132,easeOutCubic(clamp((t-0.12)/0.22,0,1)));
    if(ruleW>0){
      const rg=ctx.createLinearGradient(270-ruleW/2,0,270+ruleW/2,0);
      rg.addColorStop(0,'rgba(174,184,203,0)'); rg.addColorStop(0.5,d2haze(0.26)); rg.addColorStop(1,'rgba(174,184,203,0)');
      ctx.fillStyle=rg; ctx.fillRect(270-ruleW/2,382,ruleW,1);
    }
    const np=easeOutCubic(clamp((t-0.18)/0.24,0,1));
    if(np>0){
      ctx.save(); ctx.globalAlpha=base*np;
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.font='600 13px Georgia,serif'; try{ ctx.letterSpacing='3px'; }catch(err){}
      ctx.shadowColor=tint(0.30); ctx.shadowBlur=14; ctx.fillStyle=tint(0.95);
      ctx.fillText(e.name,270,408+lerp(5,0,np));
      try{ ctx.letterSpacing='0px'; }catch(err){}
      ctx.restore();
    }
    const lp=easeOutCubic(clamp((t-0.26)/0.26,0,1));
    if(lp>0){
      ctx.save(); ctx.globalAlpha=base*lp;
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.font='italic 500 14.5px Georgia,serif'; ctx.shadowColor=d2gold(0.18); ctx.shadowBlur=12; ctx.fillStyle='rgba(230,217,188,0.90)';
      ctx.fillText(e.line,270,436);
      ctx.restore();
    }
    ctx.restore();
  }
  if(flightP>=1)return;
  const m=eventChipMetrics();
  const k=easeInOutCubic(flightP);
  const cx=lerp(270,m.x+19.5,k), cy=lerp(336,EVENT_CHIP_Y+15,k);
  const entryScale=easeOutCubic(clamp(t/0.26,0,1));
  const sc=lerp(1,6.5/14,k)*lerp(0.82,1,entryScale);
  ctx.save(); ctx.globalAlpha=entryScale;
  if(flightP>0)d2bloom(cx,cy,34,e.rgb,0.26*Math.sin(Math.PI*flightP));
  if(flightP<0.02){
    ctx.beginPath(); ctx.arc(cx,cy,28*sc,0,6.28); ctx.fillStyle='rgba(10,13,33,0.92)'; ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle=tint(0.28); ctx.stroke();
  }
  eventGlyph(e.glyph,cx,cy,14*sc,tint(0.95),12,'rgba(10,13,33,0.92)');
  ctx.restore();
}

// Night Complete tips: one shown per round-end, picked at random (see the
// S.tip assignment beside S.misses>=5 in update()). Each line is checked
// against the actual mechanic it describes, not guessed -- e.g. "avoid
// moths" was deliberately left OUT: moths are purely ambient/decorative (the
// overloaded-jar homing mechanic they used to have was removed, see the
// Capacity Enforcement Bug comment above CARRY_OVERFLOW_HEADROOM) -- a tip
// warning about them would just be wrong. A miss is caused ONLY by a
// firefly's own patience running out (f.patience<=0), never by a moth.
const NIGHT_TIPS=[
  'Fireflies get impatient — catch them before they drift off. Five missed fireflies ends the night.',
  'Upgrade Jar Reach and Magnet Reach in the Workshop to catch fireflies from farther away.',
  'Catch the drifting magnet orb for a temporary boost to your catching radius.',

// Lumora UI port: ported from src/components/game/RunSummary.tsx -- "Night
// Complete" / "The lights are home", three stat rows (Light Delivered /
// Coins Earned / Village Restored, each a THIS-RUN delta, not an all-time
// total), Continue as the clear primary action, "Visit the workshop" as a
// quiet secondary link below it. Restoration-% delta logic (Depth Pass
// Part 1) and the "N fireflies never made it home" line are preserved,
// just reframed into the new stat-row layout instead of stacked loose text.
function drawOver(){
  const a=Math.min(1,S.overT*1.6);
  ctx.fillStyle='rgba(8,10,26,'+(a*0.72)+')';
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=a;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  lumEyebrow('Night Complete',W/2,H*0.22,'center');
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  lumGlow('The lights are home',W/2,H*0.22+38,28,'center');
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(S.carried.length>0){
    ctx.font='italic 13px Georgia,serif'; ctx.fillStyle='rgba(174,184,203,0.75)';
    ctx.fillText(S.carried.length+' fireflies never made it home',W/2,H*0.22+66);
  }

  // E30 fix: "Village Restored" must track how much THIS night's
  // completion advanced the CURRENT village's own building-restoration
  // progress (bestNightDelivered/completionThreshold -- the exact metric
  // Village Details shows), not the old, separate score-based Village
  // Heart/season meter (restorationPct(best)). That old meter saturates
  // at just 25 total weighted points -- trivially crossed by almost any
  // single night -- so it showed a misleading "+100%" on essentially
  // every night ever played (0%->100% the moment `best` first passes 25,
  // then stuck at +0% forever after). restorationPct(best) itself, and
  // every OTHER place it's used (Village Heart season art, story chapter
  // unlocks, the Master Glowkeeper Statue), is a genuinely separate,
  // still-correct system and is left completely untouched.
  const villageCur=currentVillageProgress(), villageThresh=villageCur.completionThreshold;
  const restBefore=villageThresh!=null?Math.round(100*clamp(villageBestAtRoundStart/villageThresh,0,1)):0;
  const restAfter=villageThresh!=null?Math.round(100*clamp(villageCur.bestNightDelivered/villageThresh,0,1)):0;
  const restDelta=restAfter-restBefore;
  const coinsEarned=coins-coinsAtRoundStart;
  // E29 fix: "Light Delivered" must show the actual delivered firefly
  // COUNT (S.deliveredN), matching Village Details and every other
  // "delivered" figure in the game, not the weighted score (S.score).
  // Reported live: village correctly showed 74 while this row showed
  // 104, because it was reading S.score (weighted points, 1-5 per
  // firefly type) under a label that reads as a count. S.score itself,
  // its calculation, and every other row here are untouched.
  // E30: added a dedicated "Score" row above it so the weighted score
  // (previously only ever shown on the HUD/title screen as "best score")
  // is still visible on this screen too, now that "Light Delivered" no
  // longer doubles as its display.
  const rows=[['Score',S.score+''],['Light Delivered',S.deliveredN+''],['Coins Earned','+'+coinsEarned],['Village Restored','+'+Math.max(0,restDelta)+'%']];
  // Lumora 2.0 Phase 1: hasObjectives is false for the tutorial night (its
  // own S.objectiveActive is always []), so the ENTIRE block below --
  // taller panel, the objectives sub-section, and the resulting shift to
  // playBtn/SHOP_BTN_OVER/tipY/DOUBLE_COINS_BTN -- collapses back to
  // exactly the original, unmodified layout there. Real nights only.
  const hasObjectives=!!(S.objectiveActive&&S.objectiveActive.length);
  // D1 (Claude Design spec, section 6): objective rows widened from 21px to
  // 28px pitch ("tighter than the 44px stat rows on purpose -- these are a
  // list, not headline stats" per direct spec) -- objExtra grew from 116 to
  // 130 to match (3*28=84 vs 3*21=63, +21, offset by -7 of re-tightened
  // existing whitespace per the spec's own "net +18" reasoning applied to
  // this file's real base numbers rather than the spec's screenshot-
  // measured approximation of them).
  // D5 (Claude Design spec): CONTRACT/EVENT/BONUSES now stack as one
  // unified tail -- nightCompleteTailRows() decides which rows exist and
  // where, each present row costing +26 after whichever came before it

  // baked into its py+306/py+164 anchor, not a special case here). An
  // absent row costs nothing; the next present row simply lands in its slot.

  // recomputes the exact same before/after pair every time (nightNumber is
  // unchanged by reset()), so this can never fire twice for one real night

  const villageLevelBefore=villageLevelFor(bestAtRoundStart,nightNumber-1);
  const hasVillageLevelUp=villageLevel()>villageLevelBefore;
  // E7: same gate continueFromOver() uses to decide whether THIS completed

  const hasStreak=upgrades.tutorialDone;

  const hasVillageCompleted=!!S.villageCompletedThisNight;

    const allObjectivesDone=S.objectiveActive.length===3&&S.objectiveActive.every(o=>o.done);
    if(allObjectivesDone){

      ctx.fillText('OBJECTIVE BONUS',panelR.x+20,boy);

  // E22 (v2): same pill system, 'quiet' variant (same style GOHOME_BTN
  // uses on the pause screen) so Home reads as a clear third action
  // without competing with Continue's primary emphasis.

  if(S.tip&&tipBand>=40){

const WS_GOLD_PRICE='#E5B957';  // prices, EQUIPPED / IN YOUR HANDS
// single-source-of-truth rect hit-test, alongside the existing circular dist()
// -- every new pill/panel button below is one {x,y,w,h} object shared by both
// its draw call and this check, same discipline as every existing circular button.
const inRect=(px,py,r)=>px>=r.x-r.w/2&&px<=r.x+r.w/2&&py>=r.y-r.h/2&&py<=r.y+r.h/2;
function lumPanel(x,y,w,h,r){
  ctx.save();
  ctx.fillStyle='rgba(25,33,67,0.72)'; // --lumora-glass (indigo), a bit more opaque than the web version's since canvas has no real backdrop-blur to lean on
  ctx.strokeStyle='rgba(174,184,203,0.22)'; // --lumora-glass-line (haze @ 22%)
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); ctx.stroke();
  ctx.restore();
}
// Premium Transparent Glassmorphism Redesign: rewritten per direct feedback
// that the previous version (0.36-0.4 fill alpha, flat 0.24-alpha white
// border) still read as "a dark rectangle with a slight glass effect," not
// genuine glass. This is now the ONE shared glass material for the whole
// Workshop -- every tab's cards use this exact function (see the lumPanel
// -> lumGlassPanel swaps below), never a second competing panel system.
// Layers, in order: (1) a soft ambient outer glow so the glass feels like
// it's floating over the scene, not pasted flat onto it; (2) a genuinely
// low-alpha (0.2 top / 0.24 bottom, down from 0.36/0.4) translucent fill --
// the background is meant to read clearly through this, not just tint it;
// (3) one gradient-stroked edge that does "champagne highlight at the top,
// fading to a faint violet-blue lower edge" in a single pass, instead of a
// flat bright border or a separate gold frame; (4) a very low-alpha
// warm-white sheen near the top, clipped to the panel shape, standing in
// for a glass reflection. lumPanel() itself is completely untouched --
// still used byte-for-byte by village/journal/pause, exactly as before.
function lumGlassPanel(x,y,w,h,r){
  ctx.save();
  ctx.shadowColor='rgba(90,80,150,0.22)'; ctx.shadowBlur=14;
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'rgba(58,66,108,0.2)');
  g.addColorStop(1,'rgba(16,20,42,0.24)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  ctx.shadowBlur=0; ctx.shadowColor='transparent';
  const edge=ctx.createLinearGradient(0,y,0,y+h);
  edge.addColorStop(0,'rgba(232,214,168,0.35)');
  edge.addColorStop(0.3,'rgba(170,175,220,0.2)');
  edge.addColorStop(1,'rgba(110,102,150,0.12)');
  ctx.strokeStyle=edge; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.clip();
  const sheen=ctx.createLinearGradient(0,y,0,y+h*0.4);
  sheen.addColorStop(0,'rgba(255,250,235,0.07)');
  sheen.addColorStop(1,'rgba(255,250,235,0)');
  ctx.fillStyle=sheen; ctx.fillRect(x,y,w,h*0.4);
  ctx.restore();
  ctx.restore();
}
// Jar Card Size + Glassmorphism pass: optional `size` (5th param) --
// every pre-existing call site omits it and keeps the original 11px, so
// this is purely additive. Needed so the enlarged Jars-tab cards can use a
// bigger, more legible eyebrow label without changing the dozens of other
// lumEyebrow() call sites across the file (section labels, village/journal
// screens, every other shop tab).
// Golden Typography Color Refinement: optional `color` (NEW, 6th param) --
// every pre-existing call site (village milestones, journal, pause, most
// of the Workshop's own smaller labels) omits it and keeps the original
// muted lavender-gray, so this is purely additive. Lets the Workshop's own
// card-level section headers (CURRENT JAR, CAPACITY, Jar Reach, etc.) opt
// into the new WS_GOLD_HEADER tone without touching any other screen.
function lumEyebrow(text,x,y,align,size,color){
  ctx.save();
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.font='600 '+(size||11)+'px Georgia,serif';
  try{ ctx.letterSpacing='2.2px'; }catch(e){}
  ctx.fillStyle=color||'rgba(174,184,203,0.8)';
  ctx.fillText(text.toUpperCase(),x,y);
  try{ ctx.letterSpacing='0px'; }catch(e){}
  ctx.restore();
}
// Premium Transparent Glassmorphism Redesign: optional `color`/`glowColor`
// (NEW, 6th/7th params) -- every pre-existing call site (title, game-over,
// village restoration %, confirm modal) omits both and keeps the exact
// original LUM_CREAM fill / gold-0.6-alpha glow, so this is purely
// additive. Lets the Workshop's jar name / AURORA heading use a softer
// ivory fill and a dimmer glow ("restrained glow... no heavy shadows",
// per direct feedback) without touching any other screen's glow text.
function lumGlow(text,x,y,size,align,color,glowColor){
  ctx.save();
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.font='500 '+size+'px Georgia,serif';
  ctx.shadowColor=glowColor||'rgba(251,210,107,0.6)'; ctx.shadowBlur=size*0.9;
  ctx.fillStyle=color||LUM_CREAM;
  ctx.fillText(text,x,y);
  ctx.restore();
}
function lumBar(x,y,w,h,pct){
  const p=clamp(pct,0,100)/100;
  ctx.save();
  ctx.fillStyle=LUM_INDIGO;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,h/2); ctx.fill();
  if(p>0){
    const g=ctx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,LUM_EMBER); g.addColorStop(0.5,LUM_AMBER); g.addColorStop(1,LUM_GOLD);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.roundRect(x,y,Math.max(h,w*p),h,h/2); ctx.fill();
  }
  ctx.restore();
}
// E2 Shop Economy 2.0: optional 7th param `maxWidth` -- every pre-existing
// call site (Season/Weekly/Prestige journal tabs, all with small, fixed
// tier counts of 10 or fewer) omits it and keeps the exact original fixed
// pipW/gap, so this is purely additive. Needed because several Workshop
// upgrade lines now have 20-32 tiers -- at the original fixed pipW=15/
// gap=4, a 32-tier row would be 32*19=608px wide, well past this game's
// own 540px virtual canvas. When maxWidth is given, pipW/gap are scaled
// down (never up) so all `max` pips fit inside it -- same pip-per-tier
// visual language at every tier count, just auto-thinning instead of
// silently overflowing off-screen.
function lumTierPips(x,y,tier,max,pipW,gap,maxWidth){
  pipW=pipW||16; gap=gap||5;
  if(maxWidth&&max>0){
    const natural=max*pipW+(max-1)*gap;
    if(natural>maxWidth){
      const scale=maxWidth/natural;
      pipW=Math.max(1,pipW*scale); gap=Math.max(0.5,gap*scale);
    }
  }
  for(let i=0;i<max;i++){
    ctx.fillStyle=i<tier?LUM_GOLD:'rgba(43,51,84,0.6)';
    ctx.beginPath(); ctx.roundRect(x+i*(pipW+gap),y,pipW,5,Math.min(2.5,pipW/2)); ctx.fill();
  }
}
function lumCoinIcon(x,y,r){
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,0,x,y,r);
  g.addColorStop(0,LUM_CREAM); g.addColorStop(1,LUM_AMBER);
  ctx.save(); ctx.shadowColor='rgba(251,210,107,0.7)'; ctx.shadowBlur=r*2;
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill();
  ctx.restore();
}
// Premium Transparent Glassmorphism Redesign: optional `color` (NEW, 6th
// param) -- every pre-existing call site (gameplay HUD, coin balance
// footer) omits it and keeps LUM_CREAM, so the gameplay HUD is completely
// untouched. Lets the Workshop's own price displays use the softer
// LUM_CHAMPAGNE tone ("PRICES: soft champagne/gold", per direct feedback)
// instead of bright cream.
function lumCurrency(x,y,amount,align,size,color){
  size=size||14;
  ctx.save();
  ctx.textBaseline='middle';
  const text=Math.round(amount).toLocaleString();
  ctx.font='600 '+size+'px Georgia,serif';
  const textW=ctx.measureText(text).width;
  const r=size*0.28, gap=size*0.4;
  let coinX, textX, textAlignUsed;
  if(align==='right'){ textAlignUsed='right'; textX=x; coinX=x-textW-gap-r; }
  // Shop UI Visual Redesign: 'center' (NEW) -- centers the whole icon+text
  // group on x, unlike 'left'/'right' which anchor one edge of the group to
  // x. Needed for the jar-grid price row, which is centered inside a
  // narrow card rather than pinned to either edge. Purely additive --
  // every existing 'left'/'right' call site is untouched.
  else if(align==='center'){ textAlignUsed='left'; const totalW=r*2+gap+textW, startX=x-totalW/2; coinX=startX+r; textX=startX+r*2+gap; }
  else { textAlignUsed='left'; coinX=x+r; textX=x+r*2+gap; }
  ctx.textAlign=textAlignUsed;
  lumCoinIcon(coinX,y,r);
  ctx.fillStyle=color||LUM_CREAM;
  ctx.fillText(text,textX,y);
  ctx.restore();
}
// Shop UI Visual Redesign -- reference-matching decorative atoms, all new,
// all additive: none of these replace or alter lumPanel/lumEyebrow/lumGlow
// (still used everywhere else in the file -- village screen, journal, pause
// menu, decor/trail/upgrade cards) so nothing outside the Jars tab's own
// presentation changes shape or behavior.
// Centered section heading flanked by thin gold rule lines + sparkles --
// e.g. "✦ —— JAR COLLECTION —— ✦", matching the reference's ornamental
// divider treatment. Text-only look (lumEyebrow) elsewhere is untouched.
function lumSectionHeading(text,cx,y){
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font='600 12px Georgia,serif';
  try{ ctx.letterSpacing='2px'; }catch(e){}
  const label=text.toUpperCase();
  const textW=ctx.measureText(label).width;
  // Golden Typography Color Refinement: this IS one of the spec's own
  // "Section Headers" examples (JAR COLLECTION) -> WS_GOLD_HEADER, the
  // muted antique gold, not the plain ivory the previous pass used.
  ctx.fillStyle=WS_GOLD_HEADER;
  ctx.fillText(label,cx,y);
  try{ ctx.letterSpacing='0px'; }catch(e){}
  const lineW=30, gap=10;
  ctx.strokeStyle='rgba(183,123,47,0.4)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(cx-textW/2-gap-lineW,y-4); ctx.lineTo(cx-textW/2-gap,y-4);
  ctx.moveTo(cx+textW/2+gap,y-4); ctx.lineTo(cx+textW/2+gap+lineW,y-4);
  ctx.stroke();
  ctx.fillStyle='rgba(248,196,79,0.6)'; ctx.font='10px Georgia,serif';
  ctx.fillText('✦',cx-textW/2-gap-lineW-9,y);
  ctx.fillText('✦',cx+textW/2+gap+lineW+9,y);
  ctx.restore();
}
// Small L-shaped corner brackets -- restrained "premium panel" framing for
// the hero card only (see section 19's "thin ornamental corner lines").
// Deliberately only the two top corners: the bottom corners already carry
// the Capacity readout and Equipped badge, so accents there would clash.
function lumCornerAccents(x,y,w,h){
  const len=16, inset=14;
  ctx.save();
  ctx.strokeStyle='rgba(251,210,107,0.32)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(x+inset,y+inset+len); ctx.lineTo(x+inset,y+inset); ctx.lineTo(x+inset+len,y+inset); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+w-inset-len,y+inset); ctx.lineTo(x+w-inset,y+inset); ctx.lineTo(x+w-inset,y+inset+len); ctx.stroke();
  ctx.restore();
}
// Soft atmospheric halo behind a jar's art -- reuses the existing
// glowSprite() cache (same infrastructure as every other glow in the file,
// no new rendering system). Shop-presentation only: never called from
// drawJar()/drawJarPreview() itself, so the actual gameplay jar rendering
// (and its established `.glow` field) is completely untouched.
function lumJarHalo(cx,cy,color,r,alpha){
  const rgb=toRgbTriple(color);
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.drawImage(glowSprite('rgba('+rgb+',1)',r),cx-r,cy-r,r*2,r*2);
  ctx.restore();
}
// A few tiny twinkling violet-white flecks -- Aurora's own "subtle
// celestial decoration" (section 15), shop-only, layered on top of
// (never replacing) the existing Aurora gameplay effects elsewhere in the
// file. Fixed relative positions (deterministic, not Math.random()), just
// an S.t-driven twinkle -- same discipline as the file's existing star
// fields.
function lumCelestialFlecks(cx,cy,w,h){
  const pts=[[-0.34,-0.3],[0.3,-0.26],[-0.22,0.28],[0.32,0.2]];
  ctx.save();
  pts.forEach(([fx,fy],i)=>{
    ctx.globalAlpha=0.3+0.35*Math.abs(Math.sin(S.t*1.3+i*1.7));
    ctx.fillStyle='rgba(222,195,255,1)';
    ctx.beginPath(); ctx.arc(cx+fx*w,cy+fy*h,1.1,0,6.28); ctx.fill();
  });
  ctx.restore();
}
// A faint fern/botanical silhouette in a card's bottom corner (section 19's
// "botanical silhouettes"/"restrained decorative details") -- 3 thin curved
// blades, very low alpha, drawn once per corner so it reads as a watermark
// rather than actual scenery. `flip` mirrors it for the opposite corner.
function lumFernAccent(x,y,scale,flip){
  const s=(flip?-1:1)*scale;
  ctx.save();
  ctx.strokeStyle='rgba(140,160,130,0.16)'; ctx.lineWidth=1; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+10*s,y-6*scale,x+17*s,y-19*scale); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+6*s,y-11*scale,x+9*s,y-23*scale); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x-3*s,y-9*scale,x-1*s,y-20*scale); ctx.stroke();
  ctx.restore();
}
// Dark translucent pill behind the footer coin balance (section 18) --
// wraps the EXISTING lumCurrency() call rather than reimplementing coin
// rendering; anchors to the same (rightX,y) point the old bare call used,
// so nothing about the balance's position or data source changes.
// Golden Typography Color Refinement: optional `color` (NEW, 4th param) --
// omitted, keeps the exact prior look.
function drawCoinBalancePill(rightX,y,amount,color){
  const size=16;
  ctx.save(); ctx.font='600 '+size+'px Georgia,serif';
  const text=Math.round(amount).toLocaleString();
  const textW=ctx.measureText(text).width;
  const r=size*0.28, gap=size*0.4;
  const contentW=r*2+gap+textW, padX=14, h=30;
  const pillW=contentW+padX*2, pillLeft=rightX-pillW;
  ctx.fillStyle='rgba(10,14,36,0.7)'; ctx.strokeStyle='rgba(174,184,203,0.28)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(pillLeft,y-h/2,pillW,h,h/2); ctx.fill(); ctx.stroke();
  ctx.restore();
  lumCurrency(rightX-padX,y,amount,'right',size,color);
}
// pill button, 4 variants matching LumoraButton.tsx -- btn is {x,y,w,h}, the
// same object inRect() hit-tests against, never duplicated coordinates
function lumButton(btn,label,variant,disabled){
  variant=variant||'primary';
  ctx.save();
  ctx.globalAlpha=disabled?0.4:1;
  ctx.beginPath(); ctx.roundRect(btn.x-btn.w/2,btn.y-btn.h/2,btn.w,btn.h,btn.h/2);
  if(variant==='primary'){
    const g=ctx.createLinearGradient(0,btn.y-btn.h/2,0,btn.y+btn.h/2);
    g.addColorStop(0,LUM_GOLD); g.addColorStop(1,LUM_AMBER);
    ctx.save(); ctx.shadowColor='rgba(251,210,107,0.45)'; ctx.shadowBlur=24;
    ctx.fillStyle=g; ctx.fill(); ctx.restore();
    ctx.fillStyle=LUM_NIGHT_DEEP;
  } else if(variant==='outline'){
    ctx.fillStyle='rgba(25,33,67,0.4)'; ctx.fill();
    ctx.strokeStyle='rgba(174,184,203,0.22)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=LUM_CREAM;
  } else if(variant==='quiet'){
    ctx.fillStyle='rgba(25,33,67,0.6)'; ctx.fill();
    ctx.fillStyle=LUM_CREAM;
  } else if(variant==='glass'){
    // Premium Transparent Glassmorphism Redesign: a NEW variant -- the
    // Workshop's own Upgrade/Buy buttons used the solid bright-gold
    // 'primary' fill before, which read as a standard HTML button rather
    // than part of the glass UI. 'primary' itself is untouched (title nav,
    // pause confirm still use it), so this only affects call sites that
    // opt in explicitly (see cardButtonRect() usages below).
    const bg=ctx.createLinearGradient(0,btn.y-btn.h/2,0,btn.y+btn.h/2);
    bg.addColorStop(0,'rgba(70,60,110,0.32)'); bg.addColorStop(1,'rgba(28,24,54,0.36)');
    ctx.fillStyle=bg; ctx.fill();
    // Golden Typography Color Refinement: border/text retinted to the
    // antique-gold system (was the older LUM_CHAMPAGNE-based rgba).
    ctx.strokeStyle='rgba(183,123,47,0.45)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=WS_GOLD_PRICE;
  } else { // ghost
    ctx.fillStyle=LUM_HAZE;
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='600 '+(btn.fontSize||13)+'px Georgia,serif';
  try{ ctx.letterSpacing='1.4px'; }catch(e){}
  ctx.fillText(label.toUpperCase(),btn.x,btn.y+1);
  try{ ctx.letterSpacing='0px'; }catch(e){}
  ctx.restore();
}
// LUMORA clarifications pass: shared confirmation modal for Restart Night
// and Go Home — a real destructive-action confirm, but built from the same
// glass-panel/gold-button language as everything else (spec explicitly
// calls for "visually strong... NOT an aggressive red horror-style

// pause vignette/title, not a separate screen — CONFIRM_CANCEL_BTN/
// CONFIRM_ACTION_BTN are the single source of truth shared with the

function drawConfirmModal(heading,body,actionLabel){

// ---------- first-night tutorial ----------
// Resolves which live gameplay object (if any) the current step should
// highlight -- reads the exact same state the trigger conditions in
// tutorialCheckAdvance() already watch, nothing duplicated. 'village' has
// no single object (it's the delivery zone itself), handled separately in
// drawTutorialHighlight() below.
function tutorialHighlightTarget(kind){
  if(kind==='firefly')return S.flies.length?{x:S.flies[0].x,y:S.flies[0].y}:null;
  if(kind==='moth')return S.moths.length?{x:S.moths[0].x,y:S.moths[0].y}:null;
  if(kind==='magnet')return S.magnet?{x:S.magnet.x,y:S.magnet.y}:null;
  return null;
}
// A subtle animated cue from the jar toward the target -- a few small
// traveling glow dots along the straight line between them, plus a soft
// pulsing ring around the target itself (or, for 'village', a dashed line
// at the actual delivery boundary, echoing the existing "the village"
// marker's own visual language rather than inventing a new one). Purely
// derived from S.t and existing live positions -- no new per-frame state.
function drawTutorialHighlight(kind){
  if(!kind)return;
  const jx=S.jar.x, jy=S.jar.y;
  const pulse=0.5+0.5*Math.sin(S.t*4);
  if(kind==='village'){
    ctx.save();
    ctx.globalAlpha=0.4+0.3*pulse;
    ctx.strokeStyle='rgba(255,214,110,0.85)'; ctx.lineWidth=2;
    ctx.setLineDash([8,8]);
    ctx.beginPath(); ctx.moveTo(26,DELIVER_Y); ctx.lineTo(W-26,DELIVER_Y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    for(let i=0;i<3;i++){
      const t=(S.t*0.5+i/3)%1;
      const cy=lerp(jy,DELIVER_Y,t);
      ctx.globalAlpha=(1-t)*0.7;
      ctx.drawImage(glowSprite(GLOW_Y,7),jx-7,cy-7,14,14);
    }
    ctx.globalAlpha=1;
    return;
  }
  const tgt=tutorialHighlightTarget(kind);
  if(!tgt)return;
  for(let i=0;i<3;i++){
    const t=(S.t*0.6+i/3)%1;
    const cx=lerp(jx,tgt.x,t), cy=lerp(jy,tgt.y,t);
    ctx.globalAlpha=(1-t)*0.7;
    ctx.drawImage(glowSprite(kind==='moth'?'rgba(214,90,90,1)':GLOW_Y,6),cx-6,cy-6,12,12);
  }
  ctx.globalAlpha=1;
  ctx.save();
  ctx.globalAlpha=0.5+0.4*pulse;
  ctx.strokeStyle=kind==='moth'?'rgba(214,90,90,1)':'rgba(255,214,110,1)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(tgt.x,tgt.y,22+pulse*6,0,6.28); ctx.stroke();
  ctx.restore();
}
// The tutorial panel itself -- one shared function driven by
// TUTORIAL_STEPS[tutorialStep], not a per-step draw function, so every
// step's look/behavior stays identical by construction. Same glass-panel/
// gold-typography language as drawConfirmModal() above; the one MOTH step
// swaps in a restrained red accent (item 10: "restrained red warning
// accent", not a full red redesign).
function drawTutorialPanel(){
  const step=TUTORIAL_STEPS[tutorialStep];
  if(!step)return;
  // dim the (frozen) gameplay behind the panel -- subtler than the confirm
  // modal's own scrim since the highlight cue underneath needs to stay
  // legible, per item 10's "subtle dimming", not a heavy blackout
  ctx.fillStyle='rgba(5,7,27,0.45)'; ctx.fillRect(0,0,W,H);
  drawTutorialHighlight(step.highlight);
  const x=TUTORIAL_PANEL_X, y=TUTORIAL_PANEL_Y, w=TUTORIAL_PANEL_W, h=TUTORIAL_PANEL_H;
  lumPanel(x,y,w,h,20);
  if(step.warn)lumEdgeAccent({x,y,w,h},'rgba(214,90,90,1)');
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const glyph=step.warn?'⚠':'✦';
  lumGlow(glyph+' '+step.heading.toUpperCase()+(step.warn?'':' '+glyph),W/2,y+46,19,'center',step.warn?'#e8b0b0':undefined,step.warn?'rgba(214,90,90,0.55)':undefined);
  ctx.fillStyle='rgba(174,184,203,0.92)'; ctx.font='14px Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='top';
  let ly=wrapText(step.body,W/2,y+76,w-72,20,'center');
  if(step.action){
    ly+=14;
    ctx.fillStyle=WS_GOLD_HEADER; ctx.font='600 13px Georgia,serif'; ctx.textAlign='center';
    try{ ctx.letterSpacing='1px'; }catch(e){}
    ctx.fillText(step.action,W/2,ly);

// the exact moment a moth actually scares a locked-in firefly -- the real
// existing consequence, not mere proximity. ~0.65s one-shot decay, same

// briefer, per direct instruction against a huge/permanent overlay.
function drawMothWarningFlash(){
  if(S.mothWarnT<=0)return;

// Home Page Premium UI Refinement pass: `premium` mode rewritten per
// direct feedback that the previous version (bright radial gold fill,
// three glow rings, four diamond points, a tiny star) had overshot into
// "too bright and visually heavy" -- explicitly "DO NOT copy the elaborate
// glowing medallion" this time. Now: a DARK translucent glass interior
// (same violet-navy family as lumGlassPanel, for visual consistency with
// the rest of the UI), one thin gold border + one subtle secondary inner
// border, a small soft ambient glow (not a bloom), a restrained top-left
// highlight arc (not a full radial fill), and gold text (was dark brown --
// the interior is dark now, so the text needs to be the light element for
// contrast). The other two call sites (WELCOME_CLOSE_BTN's "continue", the
// pause menu's RESUME_BTN) still omit `premium` and get the exact original
// flat-gold orb with dark brown text, completely unchanged.
function glowOrb(btn,label,premium){
  const pl=1+0.03*Math.sin(S.t*3);
  if(premium){
    // Home Page Premium UI Refinement pass, "light inspiring" tweak: the
    // dark-glass version read as too flat/inert, per direct feedback --
    // added a slow-breathing warm light living INSIDE the glass (like a
    // candle behind it), and a touch more presence to the outer ambient
    // glow. Border/rings/text untouched from the previous restrained pass.
    const breathe=0.5+0.5*Math.sin(S.t*0.7);
    ctx.globalAlpha=0.45+0.12*breathe;
    ctx.drawImage(glowSprite(GLOW_Y,btn.r*1.35),btn.x-btn.r*1.35,btn.y-btn.r*1.35,btn.r*2.7,btn.r*2.7);
    ctx.globalAlpha=1;
    const ig=ctx.createRadialGradient(btn.x,btn.y,0,btn.x,btn.y,btn.r*pl);
    ig.addColorStop(0,'rgba(42,34,62,0.88)'); ig.addColorStop(1,'rgba(16,12,28,0.94)');
    ctx.fillStyle=ig;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.clip();
    // warm inner light -- a soft glowing core, breathing slowly, so the
    // dark glass reads as lit from within rather than just dark
    const core=ctx.createRadialGradient(btn.x,btn.y,0,btn.x,btn.y,btn.r*0.85);
    core.addColorStop(0,'rgba(255,214,140,'+(0.22+0.1*breathe)+')');
    core.addColorStop(0.6,'rgba(243,199,95,'+(0.08+0.05*breathe)+')');
    core.addColorStop(1,'rgba(243,199,95,0)');
    ctx.fillStyle=core; ctx.fillRect(btn.x-btn.r,btn.y-btn.r,btn.r*2,btn.r*2);
    const hl=ctx.createRadialGradient(btn.x-btn.r*0.32,btn.y-btn.r*0.35,0,btn.x-btn.r*0.32,btn.y-btn.r*0.35,btn.r*0.95);
    hl.addColorStop(0,'rgba(255,231,163,0.2)'); hl.addColorStop(1,'rgba(255,231,163,0)');
    ctx.fillStyle=hl; ctx.fillRect(btn.x-btn.r,btn.y-btn.r,btn.r*2,btn.r*2);
    ctx.restore();
    ctx.strokeStyle='#F3C75F'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.stroke();
    ctx.strokeStyle='rgba(255,231,163,0.32)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl-6,0,6.28); ctx.stroke();
    ctx.save();
    ctx.shadowColor='rgba(255,214,140,0.5)'; ctx.shadowBlur=6+3*breathe;
    ctx.fillStyle='#FFE7A3'; ctx.font='600 22px Georgia,serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,btn.x,btn.y);
    ctx.restore();
    return;
  } else {
    ctx.drawImage(glowSprite(GLOW_Y,btn.r*1.6),btn.x-btn.r*1.6,btn.y-btn.r*1.6,btn.r*3.2,btn.r*3.2);
    ctx.fillStyle='#f0b95c';
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.fill();
    ctx.fillStyle='#3a2a14'; ctx.font='600 24px Georgia,serif';
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,btn.x,btn.y);
}

// ---------- shop (Stage 2 Part B) ----------
// Reuses the same procedural-canvas approach as everything else (drawHeart,
// drawVillage, renderBG, drawJar) — no images, no new asset pipeline. Vendor
// "avatars" are simple painted busts from the existing palette (cream, forest
// green, midnight blue, warm amber, soft orange, deep indigo), not portraits.
function wrapText(text,x,y,maxWidth,lineHeight,align){
  ctx.textAlign=align||'center';
  const words=text.split(' ');
  let line='', ly=y;
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxWidth&&line){ ctx.fillText(line,x,ly); line=words[i]+' '; ly+=lineHeight; }
    else line=test;
  }
  ctx.fillText(line,x,ly);
  return ly+lineHeight;
}

// silhouette as before (and as drawJar()'s real gameplay jar -- untouched,
// this function is shop-presentation only), but shaded like the reference:
// a grounding shadow, cylindrical glass shading (dark-light-dark across the

// streak, a wood-toned (not flat-color) lid with a metal rim, and -- in
// `detailed` mode only (the large hero card) -- a second highlight, a

function drawJarPreview(cx,cy,scale,jarObj,fillPct,detailed){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(scale,scale);

  // edges, a soft lit band left-of-center, so the glass reads as ROUND
  // rather than a flat tinted rectangle.
  ctx.save();
  bodyPath(); ctx.clip();
  const shade=ctx.createLinearGradient(-27,0,27,0);
  shade.addColorStop(0,'rgba(0,0,0,0.18)');

  // underside) instead of one flat fill, plus fine grain lines at hero

// lerpColor requires both inputs to already be hex -- jar lid/lidRim
// values always are, but this small wrapper guards against a future
// non-hex value (an rgba() lid tone, say) reaching lerpColor and throwing,
// by falling back to the plain color unmodified instead of crashing the
// whole shop screen over a cosmetic gradient stop.
function lerpColorAny(hex,target,t){
  return hex&&hex[0]==='#'?lerpColor(hex,target,t):hex;
}

// Trail System Redesign: a compact preview using the SAME glowSprite()
// infrastructure the real trail particles use (not a separate preview
// renderer) -- a short arc of small dots in the trail's own hues, gently
// bobbing via S.t so it doesn't read as a dead swatch. No new particle
// simulation, no animation loop of its own -- matches section 16's "if
// animation would add unnecessary complexity, use a compact static-style
// preview" guidance.
// Premium Transparent Glassmorphism Redesign: added a soft curved ribbon
// stroke beneath the existing sparkle dots (still the SAME positions/
// animation/glowSprite infrastructure as before) so the preview reads as
// one continuous flowing particle trail rather than isolated dots, per
// direct feedback ("a small elegant flowing particle ribbon rather than a
// flat line"). Cheap addition -- one extra stroke with a handful of
// lineTo() calls, no new particle simulation.
function drawTrailPreview(cx,cy,hues){
  if(!hues||!hues.length){
    ctx.strokeStyle='rgba(174,184,203,0.3)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.arc(cx,cy,15,0,6.28); ctx.stroke();
    return;
  }
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<=12;i++){
    const t=i/12, a=Math.PI*0.7+t*Math.PI*0.9, r=15-t*9;
    const px=cx+Math.cos(a)*13, py=cy+Math.sin(a)*9+Math.sin(S.t*1.5+t*3)*1.4;
    if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  const ribbonRGB=toRgbTriple(hues[0]);
  ctx.strokeStyle='rgba('+ribbonRGB+',0.3)'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.stroke();
  ctx.restore();
  for(let i=0;i<4;i++){
    const t=i/3, a=Math.PI*0.7+t*Math.PI*0.9, r=15-t*9;
    const px=cx+Math.cos(a)*13, py=cy+Math.sin(a)*9+Math.sin(S.t*1.5+i)*1.4;
    ctx.globalAlpha=0.5+0.5*(1-t);
    ctx.drawImage(glowSprite(hues[i%hues.length],r*0.9),px-r*0.9,py-r*0.9,r*1.8,r*1.8);
  }
  ctx.globalAlpha=1;
}

function questRewardLabel(q){

// has always had a live fallback (grant the coin-equivalent instead, once
// Garden Lanterns are already owned) -- but since all 3 quests reroll every
// single day, that fallback becomes the COMMON case for deliver20 after day
// 1, not a rare edge case. questRewardLabel(q) alone always says "Garden

// the single source of truth for "will this deco reward actually fall back
// to coins" — reads the exact same live upgrades.deco check
// grantQuestReward() itself uses, so preview and reality can never drift apart.
function questWillFallbackToCoins(q){ return q.reward.kind==='deco'&&upgrades.deco; }

// finished right now. Reuses questRewardLabel() for every case except the

function questRewardPreviewLabel(q){ return questWillFallbackToCoins(q)?(q.reward.val+' coins'):questRewardLabel(q); }
// post-completion: what ACTUALLY happened, read from q.grantedKind/
// grantedVal -- recorded once, at the exact moment grantQuestReward() ran
// (not recomputed from live state, since upgrades.deco may have changed
// again by the time this renders). Falls back to the live preview for a
// quest that was already done() before this field existed — safe migration
// for an old save, same "degrade gracefully" discipline as every other field.
function questGrantedLabel(q){
  if(q.grantedKind==='coins')return q.grantedVal+' coins';
  if(q.grantedKind==='deco')return 'Garden Lanterns';
  if(q.grantedKind==='luck')return q.grantedVal+'s luck boost';

}
// natural-language completion line for the "Quest Complete" state, branching
// on the recorded kind (not string-sniffing questGrantedLabel()'s text) so
// it stays correct regardless of the exact wording above.
function questGrantedMessage(q){
  const kind=q.grantedKind||(questWillFallbackToCoins(q)?'coins':q.reward.kind); // same old-save migration fallback as questGrantedLabel()

  if(kind==='deco')return 'Garden Lanterns added to the village.';
  if(kind==='luck')return 'A '+val+'s luck boost was granted.';

}

    const statusColor=restored?LUM_GOLD:(isNext?LUM_CYAN:'rgba(174,184,203,0.5)');

    ctx.fillText(m.desc,44,y+16);

  // this card is now the only place any of that surfaces to the player.
  // Two real states only (A: in progress, C: complete) -- there is no
  // "reward ready to claim" state in the existing architecture (grantQuestReward()

  const reqY=listY+34+VILLAGE_MILESTONES.length*milestoneRowH+20;

    ctx.fillStyle=LUM_CREAM; ctx.font='600 16px Georgia,serif'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(q.desc,reqR.x+18,reqR.y+42);

    lumBar(reqR.x+18,reqR.y+112,reqR.w-36,7,100*clamp(q.progress/q.target,0,1));

    ctx.fillStyle='rgba(174,184,203,0.85)'; ctx.font='12px Georgia,serif'; ctx.textBaseline='top';
    ctx.fillText(Math.min(q.progress,q.target)+' / '+q.target,reqR.x+18,reqR.y+126);
    lumEyebrow('Reward',reqR.x+18,reqR.y+152,'left');
    ctx.fillStyle=LUM_GOLD; ctx.font='italic 14px Georgia,serif'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText(questRewardPreviewLabel(q),reqR.x+18,reqR.y+172);
    ctx.fillStyle='rgba(174,184,203,0.6)'; ctx.font='italic 11px Georgia,serif'; ctx.textBaseline='top';
    ctx.fillText('Continue playing to complete the request.',reqR.x+18,reqR.y+188);
  } else {
    ctx.fillStyle='rgba(174,184,203,0.75)'; ctx.font='italic 14px Georgia,serif'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('The village is quiet tonight.',reqR.x+18,reqR.y+42);

  // happened" (per direct instruction); this is the one bridge between them.
  const rj=villageReadJournalRect();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(251,210,107,0.8)'; ctx.font='italic 13px Georgia,serif';
  ctx.fillText('Read Journal →',rj.x,rj.y);

  const vt=villageThemesLinkRect();
  ctx.fillStyle='rgba(174,184,203,0.75)'; ctx.font='italic 13px Georgia,serif';
  ctx.fillText('🎨 Village Themes',vt.x,vt.y);
  ctx.textAlign='center'; ctx.textBaseline='top';

// ---------- E21/E22: Village Journey hub ----------

// row-list visual language (lumPanel row + name + status + optional bar,
// the same shape journalRowRects()/weeklyRowRects()/themeRowRects() already
// use) rather than porting the D6 design-canvas mockup's own bespoke CSS,
// which has no meaning against a Canvas 2D surface anyway. Reads every
// number LIVE from villageProgression/isVillageUnlocked/isVillageCompleted
// -- nothing here is a second cached percentage, so it can never disagree
// with the actual persisted state (same discipline as villageLevel()/
// restorationPct() already establish for the OLD system).
// IMPORTANT IMPLEMENTATION CHANGE pass: exactly TWO selectable village
// cards -- Lumora and Moonfall. Aurora deliberately excluded from this
// list (it still exists in villageProgression.villages for the generic
// unlock-chain math elsewhere, but it gets no visible card, no selection,
// no content, per direct instruction not to build a third village card
// yet). E21: this exclusion is now backed up by isVillageUnlocked() itself
// -- Aurora's completionThreshold stays null, so isVillageUnlocked('aurora')
// stays false even after Moonfall completes; it is NOT scheduled to unlock
// "once Moonfall completes" the way this comment previously (incorrectly,
// for this release) implied.
// Rects are CENTER x/y + full w/h -- the convention inRect() actually
// implements (px between x-w/2 and x+w/2), same as storyRowRects()/
// journalTabRects() elsewhere in this file. (themeRowRects()/
// journalRowRects()/weeklyRowRects() use a left-edge x with this same
// inRect() and are consequently only reliably tappable across their own
// left half -- a pre-existing quirk in code this phase doesn't touch;
// not repeating it here since this row's own right-aligned "View Details"
// link would otherwise sit outside its tappable zone entirely, which is
// exactly the bug a live coordinate-based test caught during this pass.)
// E31: card height grown from 110 to 170 -- purely to fit a properly
// sized "View Details" button (see journeyViewDetailsRect() below)
// underneath the progress bar without overlapping it or crowding the
// card's bottom edge. gap (14, the space BETWEEN the two cards) and
// everything else about this formula is unchanged, so the two rows still
// stack automatically off this one shared h with zero extra bookkeeping.
function journeyRowRects(){
  const top=210, h=170, gap=14;
  return villageProgression.villages
    .filter(v=>v.id==='lumora'||v.id==='moonfall')
    .map((v,i)=>({key:v.id,x:W/2,y:top+h/2+i*(h+gap),w:W-40,h}));

// ---------- E20: Village Details screen ----------
// Reads ENTIRELY through the generic accessor API above (getVillageProgress/
// getVillageLandmarks/getRestoredMilestones/getNextMilestone/
// villageDetailsRows) -- no thresholds or landmark names are re-typed here,
// so a config change to VILLAGE1_MILESTONES/MOONFALL_MILESTONES is
// automatically reflected here with zero further edits, per direct
// instruction ("ONE SOURCE OF TRUTH").
//
// Layout is computed once by villageDetailsLayout() and consumed by BOTH
// the draw function and the input handler (single source of truth for
// hit-testing too, same discipline as journeyRowRects() etc.) -- genuinely
// scrollable (villageDetailsScroll, clamped to real content height every
// frame), not just a fixed list that happens to fit today.
function villageDetailsLayout(id){
  const rows=villageDetailsRows(id);
  const top=200, gap=10;
  let y=top;
  const items=rows.map(r=>{
    const h=r.state==='NEXT'?108:60;
    const item=Object.assign({},r,{y,h});
    y+=h+gap;
    return item;
  });
  let legacyLink=null;
  if(id==='lumora'){
    legacyLink={y,h:36};
    y+=36+gap;
  }
  return {items, legacyLink, top, totalHeight:Math.max(0,y-top-gap)};
}
// Single source of truth for the scrollable viewport's screen-space bounds --
// draw, drag-scroll (pointermove), wheel-scroll, and the legacy-link hit-test
// all previously hand-copied "sy=94, sh=...?108:88" independently, which is
// exactly the kind of drift CLAUDE.md's shared-layout-function convention
// (see journeyRowRects) exists to prevent.
function villageDetailsViewport(id){
  const sy=94, sh=isVillageCompleted(id)?108:88;
  return {sy, sh, viewTop:sy+sh+12, viewBottom:H-24};

    ctx.font=(active?'700 ':'600 ')+'11px Georgia,serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.label.toUpperCase(),t.x,t.y+1);
  });

  if(journalTab==='story'){
    drawStoryList();
  } else if(journalTab==='weekly'){
    drawWeeklyJournal();
  } else if(journalTab==='season'){
    drawSeasonJournal();
  } else if(journalTab==='prestige'){
    drawPrestigeJournal();
  } else {
    const order=Object.keys(TYPES);
    const discoveredCount=order.filter(t=>journal[t]>0).length;
    ctx.fillStyle=LUM_HAZE; ctx.font='13px Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(discoveredCount+' of '+order.length+' species recorded',W/2,172);

    ctx.beginPath(); ctx.arc(TRACKER_TOGGLE.x,TRACKER_TOGGLE.y,TRACKER_TOGGLE.r,0,6.28);
    ctx.fillStyle=trackerOn?LUM_GOLD:'rgba(25,33,67,0.6)'; ctx.fill();
    ctx.strokeStyle='rgba(174,184,203,0.4)'; ctx.lineWidth=1.3; ctx.stroke();
    if(trackerOn){ ctx.fillStyle=LUM_NIGHT_DEEP; ctx.font='600 13px Georgia,serif'; ctx.fillText('✓',TRACKER_TOGGLE.x,TRACKER_TOGGLE.y+1); }
    ctx.fillStyle='rgba(174,184,203,0.85)'; ctx.font='italic 12px Georgia,serif'; ctx.textAlign='left';
    ctx.fillText('Tracker — a gentle hint toward fireflies you haven\'t met yet',TRACKER_TOGGLE.x+24,TRACKER_TOGGLE.y+1);

    journalRowRects().forEach(rect=>{
      const T=TYPES[rect.key], caught=journal[rect.key]||0, discovered=caught>0;
      lumPanel(rect.x,rect.y,rect.w,rect.h,16);
      const moteX=rect.x+40, moteY=rect.y+rect.h/2;
      ctx.save();
      ctx.shadowColor=discovered?T.glow:'transparent'; ctx.shadowBlur=discovered?18:0;
      ctx.fillStyle=discovered?T.glow:'rgba(90,98,136,0.5)';
      ctx.beginPath(); ctx.arc(moteX,moteY,13,0,6.28); ctx.fill();
      ctx.restore();
      const tx=rect.x+76;
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.fillStyle=LUM_CREAM; ctx.font='500 16px Georgia,serif';
      ctx.fillText(discovered?T.name:'Undiscovered',tx,rect.y+28);
      ctx.fillStyle='rgba(174,184,203,0.8)'; ctx.font='italic 12px Georgia,serif'; ctx.textBaseline='top';
      wrapText(discovered?T.desc:'Catch one to record it in the journal.',tx,rect.y+38,rect.w-76-70,14,'left');
      ctx.fillStyle='rgba(174,184,203,0.7)'; ctx.font='500 10px Georgia,serif'; ctx.textAlign='right'; ctx.textBaseline='alphabetic';
      ctx.fillText('CAUGHT',rect.x+rect.w-16,rect.y+28);
      ctx.fillStyle=LUM_CREAM; ctx.font='500 18px Georgia,serif';
      ctx.fillText(caught+'',rect.x+rect.w-16,rect.y+50);
    });
  }
  // Phase 12: the Prestige confirmation modal, drawn ON TOP of the tab
  // content above -- same "extra dim+panel layer on top of what's already
  // drawn" construction drawConfirmModal()'s own comment describes for the
  // pause overlay's Restart/Go Home confirms, just reused here for the
  // Journal screen instead. Nothing is reset by a real Prestige, so the
  // body copy says so explicitly, per "if nothing is reset, say so clearly".
  if(prestigeConfirmOpen){
    const r=PRESTIGE_REWARDS.find(x=>x.level===prestigeLevel+1);
    const rewardLine=r?(r.label+(upgrades[r.field]?' (already owned -- you will receive +'+r.price+' Coins instead)':'')):'';
    drawConfirmModal('Begin a new Prestige cycle?','You will receive Prestige '+(prestigeLevel+1)+' and: '+rewardLine+'. Nothing is reset -- your collection, village, jars, themes, and trails all remain exactly as they are.','Prestige');
  }
  ctx.textAlign='center'; ctx.textBaseline='top';
}
// ---------- welcome-back overlay (Stage 3 Part C, Section 6.5) ----------
// Drawn ON TOP of the title screen (see showWelcomeBack), never a separate
// `screen` value — so it structurally cannot delay or reorder gameReady,
// which only ever checks screen==='title'. Content is derived entirely from
// existing data (best + LIGHTS' own thresholds via homesRestoredCount()) —
// no new stat invented. Dismiss mirrors the shop's own close-button + Esc
// convention, plus a generous "tap anywhere near the button" target since
// this is the overlay's only action.
// Lumora UI port: ported from src/pages/WelcomeBackScreen.tsx -- eyebrow +
// glow title, a 2-up Village/Coins stat grid, a "Tonight's Night" card
// reading the SAME live weather system already driving gameplay (not a
// second, parallel weather picker), Continue button. Kept as a non-blocking
// overlay on top of the title screen, same architecture as before (see the
// comment on showWelcomeBack itself for why that matters for gameReady).
function drawWelcomeBack(){
  const cx=W/2, cy=H/2, rad=Math.hypot(W,H)/2;
  const vig=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  vig.addColorStop(0,'rgba(8,10,26,0.9)');
  vig.addColorStop(1,'rgba(8,10,26,0.97)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  lumEyebrow('Welcome Back',W/2,H*0.18,'center');
  ctx.save();
  ctx.font='500 24px Georgia,serif'; ctx.shadowColor='rgba(251,210,107,0.6)'; ctx.shadowBlur=20;
  ctx.fillStyle=LUM_CREAM; ctx.textAlign='center'; ctx.textBaseline='top';
  const titleEnd=wrapText('The village kept your lights burning',W/2,H*0.18+26,420,30,'center');
  ctx.restore();

  const statY=titleEnd+24, statW=200, gap=16, statX0=W/2-statW-gap/2, statX1=W/2+gap/2;
  lumPanel(statX0,statY,statW,90,16);
  lumPanel(statX1,statY,statW,90,16);
  lumEyebrow('Village',statX0+18,statY+26,'left');
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=LUM_CREAM; ctx.font='500 26px Georgia,serif';
  ctx.fillText(restorationPct(best)+'%',statX0+18,statY+62);
  lumEyebrow('Coins',statX1+18,statY+26,'left');
  ctx.fillStyle=LUM_CREAM; ctx.font='500 26px Georgia,serif';
  ctx.fillText(coins.toLocaleString(),statX1+18,statY+62);

  const weatherR={x:W/2-160,y:statY+110,w:320,h:88};
  lumPanel(weatherR.x,weatherR.y,weatherR.w,weatherR.h,16);
  lumEyebrow('Tonight\'s Night',weatherR.x+18,weatherR.y+24,'left');
  ctx.fillStyle=LUM_CREAM; ctx.font='500 15px Georgia,serif'; ctx.textAlign='left'; ctx.textBaseline='top';
  wrapText(WEATHER_INFO[S.weather]?WEATHER_INFO[S.weather].msg:'A quiet night — still air, no rare weather yet.',weatherR.x+18,weatherR.y+38,weatherR.w-36,18,'left');

  ctx.textAlign='center'; ctx.textBaseline='middle';
  glowOrb(WELCOME_CLOSE_BTN,'continue');
  ctx.textBaseline='top';
}
// Lumora UI port: ported from src/components/game/PauseOverlay.tsx --
// "Paused" title, Resume (primary), Restart Night (new, see RESTART_BTN's
// own comment for what was deliberately left out and why). Score/best
// readout preserved from the original.
function drawPaused(){
  const cx=W/2, cy=H/2, rad=Math.hypot(W,H)/2;
  const vig=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  vig.addColorStop(0,'rgba(8,10,26,0.62)');
  vig.addColorStop(1,'rgba(8,10,26,0.9)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  lumEyebrow('Paused',W/2,H*0.28,'center');
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  lumGlow('The night waits',W/2,H*0.28+36,26,'center');
  ctx.fillStyle=LUM_CREAM; ctx.font='600 22px Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('✦ '+S.score,W/2,H*0.32+90);
  ctx.fillStyle='rgba(174,184,203,0.85)'; ctx.font='500 15px Georgia,serif';
  ctx.fillText('best score '+best,W/2,H*0.32+118); // E22: same relabel as the main HUD, same reasoning
  if(pauseReason==='user'){
    if(pauseConfirm==='restart'){
      drawConfirmModal('Restart this night?','Your current night progress will be lost. Any fireflies currently held in your jar will be discarded. Your permanent coins, upgrades, equipped jar, village restoration, and journal progress will remain safe.','Restart Night');
    } else if(pauseConfirm==='gohome'){
      drawConfirmModal('Leave this night?','Your current collected light will be lost. Permanent progress will remain safe.','Go Home');
    } else {
      glowOrb(RESUME_BTN,'resume');
      lumButton(RESTART_BTN,'Restart Night','outline');
      lumButton(GOHOME_BTN,'Go Home','quiet');
    }
  }
  ctx.textBaseline='top';
}
function draw(){
  drawVillage();
  drawMoon();
  if(screen==='play'){
    if(S.magnet)drawMagnet(S.magnet);
    if(S.lucky)drawLuckyFirefly(S.lucky);
    for(const f of S.flies)drawFly(f);
    for(const m of S.moths)drawMoth(m);
    drawDeliverWaves();
    drawSparks();
    drawJar();
    drawJarRarity(); // D2 (B3): rare-carry ring/motes, layered right on the jar it orbits
    drawDeliveryComposite(); // D2 (B1/B2): perfect/rare delivery reveal, above the jar
    for(const p of S.parts){
      // Trail System Redesign: optional peak-alpha multiplier (p.a), used by
      // the new layered trail particles below so different layers (soft
      // glow/medium/spark/highlight) can have different peak brightness, not
      // just different life/size. Backward-compatible: every OTHER particle
      // source in the file (catch streaks, fountain droplets, puff(), etc.)
      // never sets p.a, so `?? 1` leaves their existing behavior byte-for-byte
      // unchanged.
      ctx.globalAlpha=Math.max(0,p.life/p.maxL)*(p.a??1);
      ctx.drawImage(glowSprite(p.color,p.r*4),p.x-p.r*4,p.y-p.r*4,p.r*8,p.r*8);
    }
    ctx.globalAlpha=1;
    drawHUD();
    if(S.carried.length>=S.cap&&!S.over)drawFullJarAlert();
    drawMothWarningFlash(); // always-on gameplay feedback, independent of the tutorial
    if(newNightCardVisible())drawNewNightCard(); // D1: drawn over live gameplay + HUD, per direct spec ("nothing is gated: the jar is spawned")
    if(S.over)drawOver();
    if(S.extraLifeOfferOpen)drawExtraLifeOffer(); // shown INSTEAD of drawOver() the instant the normal 5-miss ending is reached -- S.over is still false while this is up
    if(S.luckyOfferOpen)drawLuckyFireflyOffer(); // shown the instant S.lucky is caught -- see the proximity check in update()
    if(paused)drawPaused();
    if(tutorialPanelOpen)drawTutorialPanel(); // topmost overlay, same precedent as drawPaused()/drawOver() above
  } else if(screen==='contract'){
    drawContractScreen();
  } else if(screen==='shop'){
    drawShop();
  } else if(screen==='village'){
    drawVillageScreen();
  } else if(screen==='journey'){
    drawJourneyScreen();
  } else if(screen==='villageDetails'){
    drawVillageDetailsScreen();
  } else if(screen==='journal'){
    drawJournalScreen();
  } else if(screen==='themes'){
    drawThemesScreen();
  } else {
    drawTitle();
    // welcome-back is an overlay ON TOP of the title screen, not its own
    // `screen` value — see maybeShowWelcomeBack()'s comment for why that
    // matters for the gameReady lifecycle hook
    if(showWelcomeBack)drawWelcomeBack();
  }
}

// ---------- loop ----------
let lastT=performance.now();
function loop(now){
  if(cv.width===0||window.innerWidth!==lastVW||window.innerHeight!==lastVH)resize(); // catches viewport changes even without a 'resize' event (e.g. fullscreen exit in some hosts)
  // E21: lower-bounded too -- a clock regression (now<lastT) previously produced
  // a negative dt with nothing to catch it, which could drive any unclamped
  // "+=dt*rate" accumulator (e.g. S.smoke[i].r) negative and crash a later
  // ctx.arc()/drawImage() call with a negative-radius IndexSizeError.
  let dt=Math.max(0,Math.min(0.033,(now-lastT)/1000)); lastT=now;
  // Phase 8: Cosmetic Trial countdown -- unconditional, independent of
  // pause/screen (a trial represents "enjoy this for N real minutes," not
  // a gameplay-bound timer), same "advances unconditionally while shown"
  // precedent the contract screen's own clock already established below.
  if(cosmeticTrialT>0){ cosmeticTrialT-=dt; if(cosmeticTrialT<=0)endCosmeticTrial(); }
  // First-Night Tutorial: an open tutorial panel gates simulation the exact
  // same way `paused` already does -- fireflies/moths/timers all freeze,
  // draw() still runs every frame so the frozen scene + panel actually
  // render. Does not touch paused/pauseReason at all, per direct
  // instruction not to interfere with the existing pause/resume system.
  // "One More Chance" gates simulation the exact same sibling way the
  // tutorial panel already does -- see requestExtraLife()/declineExtraLife().
  // D1: the new-night reveal card's own clock advances even while it gates
  // update(dt) below (same "the card's timer keeps going, gameplay's
  // timers don't" split the spec itself calls for) -- a tap dismiss jumps
  // S.newNightT straight to the 4.30 keyframe (see the pointerdown guard),
  // so this increment is the ONLY normal path that advances it otherwise.
  if(screen==='play')S.newNightT+=dt;
  // D3: the contract screen's own clock -- see contractScreenAt's own
  // comment. Not part of S, not gated by paused/tutorial (none of those
  // apply on this screen), so it advances unconditionally while shown.
  // Once the 280ms ACCEPT exit finishes, hand off to actual play.
  if(screen==='contract'){
    contractScreenAt+=dt;
    if(contractExitAt>=0&&contractScreenAt-contractExitAt>=0.28)finishContractAccept();
  }
  if(!paused&&!tutorialPanelOpen&&!S.extraLifeOfferOpen&&!S.luckyOfferOpen&&!newNightCardActive())update(dt);
  draw(); // renders the title screen (our splash/main-menu) on the very first call

  // Lifecycle Hook 1: the first visual frame is now on screen.
  if(!firstFrameSent&&cv.width>0){
    firstFrameSent=true;
    if(YT&&YT.game&&YT.game.firstFrameReady){ try{ YT.game.firstFrameReady(); }catch(e){} }
  }
  // Lifecycle Hook 2: the title screen is our main menu and is interactive
  // (its "begin" button is hit-testable) as soon as it's drawn — signal
  // gameReady the moment that screen is actually showing.
  if(!gameReadySent&&cv.width>0&&screen==='title'){
    gameReadySent=true;
    if(YT&&YT.game&&YT.game.gameReady){ try{ YT.game.gameReady(); }catch(e){} }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// NOTE: no Page Visibility API usage — pause/resume is driven exclusively by ytgame.system hooks (platform requirement).
</script>
