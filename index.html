const W=540, H=960;
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false}); // canvas is always fully opaque; skip alpha compositing for cheaper mobile rasterization
let scale=1, dpr=Math.min(window.devicePixelRatio||1,2);
let lastVW=0, lastVH=0; // last viewport size we actually sized for — lets the render loop notice changes even when a 'resize' event never fires (e.g. some fullscreen enter/exit paths)
// Zero-viewport init fix: YouTube's own Playables docs document that the
// game may initially load inside a hidden WebView whose viewport starts at
// 0x0, and game code MUST initialize/render regardless. The old
// scale=Math.min(vw/W,vh/H) went straight to 0 whenever vw/vh were 0,
// zeroing cv.width/cv.height and making ctx.setTransform degenerate (a
// 0-scale matrix) -- draw() kept being called every frame, but painted
// nothing into a zero-area buffer, and firstFrameReady()/gameReady() (both
// gated on cv.width>0 in loop(), intentionally, so they never fire before a
// real frame exists) then had no real frame to ever detect, so they never
// fired at all. That's the exact loading-spinner symptom: the Test Suite
// waits on gameReady(), which was permanently blocked. It's also exactly
// why entering fullscreen "fixed" it -- fullscreen forces the host to
// finally give the page a real, non-zero viewport, which drove vw/vh
// non-zero, which let this same function compute a real scale for the
// first time, which finally made cv.width>0 true on the very next frame.
// Fix: fall back to scale=1 (the virtual resolution's own 1:1 pixel size)
// whenever the real viewport isn't available yet, so the canvas's INTERNAL
// drawing resolution (cv.width/cv.height) and the transform are always
// valid and non-zero from the very first call -- draw() actually paints a
// real frame immediately, independent of any external viewport event, and
// firstFrameReady()/gameReady() can fire on their normal schedule. This is
// a presentation-layer fallback only: the virtual resolution (W/H=540/960)
// and every gameplay coordinate are completely unchanged. Once a real
// viewport does arrive, this same function (already re-invoked by loop()'s
// per-frame poll below on any innerWidth/innerHeight change) recomputes the
// real scale/letterboxing exactly as before -- this just stops "no real
// viewport yet" from meaning "never initialize."
function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  lastVW=vw; lastVH=vh;
  scale=(vw>0&&vh>0)?Math.min(vw/W, vh/H):1;
  cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px';
  cv.width=Math.round(W*scale*dpr); cv.height=Math.round(H*scale*dpr);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}

const glowCache={};
function glowSprite(color,r){
  r=Math.max(1,Math.round(r)); // quantize so pulsing radii (sin-driven) hit the cache instead of allocating a new canvas every frame
  const key=color+'|'+r;
  if(glowCache[key])return glowCache[key];
  const s=document.createElement('canvas'); s.width=s.height=Math.ceil(r*2);
  const g=s.getContext('2d');
  const gr=g.createRadialGradient(r,r,0,r,r,r);
  gr.addColorStop(0,color); gr.addColorStop(0.35,color.replace('1)','0.45)')); gr.addColorStop(1,color.replace('1)','0)'));
  g.fillStyle=gr; g.fillRect(0,0,r*2,r*2);
  glowCache[key]=s; return s;
}

// ---------- Village Heart / season / environmental-detail tier (Stage 1) ----------
// One derived value drives all three systems below — the Heart's own visual
// state, the seasonal palette, and the environmental-detail props — so they
// can never drift out of sync with each other. It's computed fresh from
// `best` (the same all-time score already persisted via saveData/loadData
// for sendScore) wherever it's needed; nothing caches or re-derives it
// independently. Tier 6 (Luminary) is the ceiling — scores past 25 don't
// invent a 7th tier, matching the plan's tier table.
const HEART_TIER_THRESH=[0,5,10,15,20,25]; // minimum bestScore to REACH tier (index+1)
function heartTier(scoreVal){
  let t=1;
  for(let i=1;i<HEART_TIER_THRESH.length;i++){ if(scoreVal>=HEART_TIER_THRESH[i])t=i+1; }
  return t;
}
// Luminary sub-progress: Tier 6 covers bestScore>=25 with no ceiling, which made
// "just reached 25" and "pushed deep past Bloom" render pixel-identical. Rather
// than a second discrete tier (which would just relocate the pop this stage
// already fixed to a new boundary), this is a continuous 0->1 value between the
// two thresholds that already exist elsewhere in the codebase (25 = Luminary,
// 35 = the Lumora Bloom milestone) — no new number invented, no new save field.
function heartBloomProgress(scoreVal){ return clamp((scoreVal-25)/10,0,1); }

function treeline(g,baseY,amp,color,seed){
  g.fillStyle=color; g.beginPath(); g.moveTo(0,H); g.lineTo(0,baseY);
  let x=0;
  while(x<W){
    const w=30+((Math.sin(seed+x*0.7)+1)*22);
    const h=amp*(0.55+0.45*Math.sin(seed*3+x*0.13));
    g.quadraticCurveTo(x+w/2,baseY-h,x+w,baseY);
    x+=w;
  }
  g.lineTo(W,H); g.closePath(); g.fill();
}
function house(g,x,y,w,h,roofH,color){
  g.fillStyle=color;
  g.beginPath();
  g.moveTo(x,y); g.lineTo(x,y-h);
  g.quadraticCurveTo(x,y-h-roofH*0.35,x+w*0.12,y-h-roofH*0.45);
  g.quadraticCurveTo(x+w*0.5,y-h-roofH,x+w*0.88,y-h-roofH*0.45);
  g.quadraticCurveTo(x+w,y-h-roofH*0.35,x+w,y-h);
  g.lineTo(x+w,y); g.closePath(); g.fill();
  g.fillRect(x+w*0.68,y-h-roofH*0.75,w*0.1,roofH*0.5);
}
// Gameplay Background Rebuild pass: a small dark foliage-cluster silhouette
// (overlapping arcs, no gradient/glow of its own) for the new foreground
// vegetation layer below -- reused per spot rather than one-off inline
// shapes, same "one small helper, called from renderBG only" discipline as
// house()/treeline() above it. Purely a dark flat silhouette so it can never
// read as a light source or compete with fireflies/decor.
function bush(g,x,y,scale,color){
  g.fillStyle=color;
  [[0,0,1],[-0.55,0.15,0.72],[0.55,0.12,0.72],[-0.25,-0.28,0.6],[0.28,-0.26,0.6]].forEach(([dx,dy,r])=>{
    g.beginPath(); g.arc(x+dx*18*scale,y+dy*14*scale,r*13*scale,0,6.28); g.fill();
  });
}
// Visual Refinement pass: a mountain profile with real peak variety (sharp
// AND rounded, per-segment), replacing treeline()'s uniform sine-wave
// silhouette for the mountain layers specifically. treeline() itself is
// untouched and still used below for smooth forest-canopy fills, where a
// soft wavy edge reads better than jagged peaks.
function ridgeline(g,baseY,amp,color,seed){
  g.fillStyle=color; g.beginPath(); g.moveTo(0,H); g.lineTo(0,baseY);
  let x=0,i=0;
  while(x<W){
    const w=44+((Math.sin(seed+i*1.7)+1)*32);
    const peakH=amp*(0.45+0.55*Math.abs(Math.sin(seed*2.2+i*0.85)));
    if(Math.sin(seed*5+i*2.3)>0.1){ g.lineTo(x+w*0.5,baseY-peakH); g.lineTo(x+w,baseY); }
    else{ g.quadraticCurveTo(x+w*0.5,baseY-peakH,x+w,baseY); }
    x+=w; i++;
  }
  g.lineTo(W,H); g.closePath(); g.fill();
}
// A small forest tree -- alternates pine (stacked triangles) and rounded
// canopy so a cluster of them reads as mixed woodland, not one shape
// repeated. Purely a flat silhouette, same discipline as bush() above.
function forestTree(g,x,y,scale,color,pine){
  g.fillStyle=color;
  if(pine){
    for(let i=0;i<3;i++){
      const w=15*scale*(1-i*0.22), yy=y-i*9*scale;
      g.beginPath(); g.moveTo(x-w/2,yy); g.lineTo(x,yy-13*scale); g.lineTo(x+w/2,yy); g.closePath(); g.fill();
    }
    g.fillRect(x-1.4*scale,y,2.8*scale,5*scale);
  } else {
    g.beginPath(); g.arc(x-6*scale,y-9*scale,8*scale,0,6.28); g.fill();
    g.beginPath(); g.arc(x+6*scale,y-9*scale,8*scale,0,6.28); g.fill();
    g.beginPath(); g.arc(x,y-15*scale,9*scale,0,6.28); g.fill();
    g.fillRect(x-1.4*scale,y-3*scale,2.8*scale,7*scale);
  }
}
// A cluster of forestTree() calls along one edge of the screen only (see
// renderBG()'s left/right-edge calls below) -- deterministic spacing/scale
// via the seed, no per-frame randomness, no Math.random().
function forestEdge(g,x0,x1,baseY,color,seed){
  const n=Math.max(2,Math.round((x1-x0)/26));
  for(let i=0;i<n;i++){
    const t=i/Math.max(1,n-1);
    const x=x0+t*(x1-x0);
    const y=baseY+Math.sin(seed*2+i*1.4)*7;
    const scale=0.65+((Math.sin(seed*4+i*1.9)+1)*0.3);
    forestTree(g,x,y,scale,color,i%2===0);
  }
}
// A richer cottage than the original house(): a plain pitched roof (not
// house()'s scalloped one), an optional chimney, and 1-3 baked-in warm
// windows at their own alpha (some brighter, some dimmer, per the "not a
// row of identical lit boxes" requirement). These windows are ambient/
// always-on -- deliberately distinct from LIGHTS' score-gated windows,
// which stay exclusively on the original 5 house() buildings below so the
// two systems never double up on the same wall. Only ever called at
// x<130 or x>470 (see renderBG()) -- outside that band sits the live
// Fountain/Garden-Lantern/Village-Heart/environmental-detail coordinate
// cluster, and a baked warm window there could look like a decoration the
// player hasn't actually unlocked yet.
// House Quality pass: replaces the old single flat-box cottage() with a
// richer primitive (roof overhang + ridge highlight + optional secondary
// roof plane/chimney/dormer/door/stepped body) plus five fixed, deterministic
// archetypes below (houseTypeA-E) built on top of it -- a real procedural
// cottage family, not one shape called with different x/y. wallColor/
// roofColor are passed in already palette-derived by the caller (renderBG),
// per direct instruction to keep season adaptation centralized there.
// E24: one switch controls every baked window this primitive ever draws --
// see cottagePrimitive()'s own window-drawing line for the full story on
// why this defaults to false.
const COTTAGE_WINDOWS_LIT=false;
function cottagePrimitive(g,x,y,w,h,roofH,wallColor,roofColor,opts){
  opts=opts||{};
  g.fillStyle=wallColor;
  if(opts.step){ // an organic two-step silhouette instead of one flat rectangle
    const sw=w*0.6;
    g.fillRect(x,y-h,sw,h);
    g.fillRect(x+sw-2,y-h*0.68,w-sw+2,h*0.68);
  } else {
    g.fillRect(x,y-h,w,h);
  }
  const overhang=w*0.09, peak=x+w*(opts.roofPeak||0.5);
  g.fillStyle=roofColor;
  g.beginPath(); g.moveTo(x-overhang,y-h); g.lineTo(peak,y-h-roofH); g.lineTo(x+w+overhang,y-h); g.closePath(); g.fill();
  // ridge highlight: a faint lighter line along one roof slope only, so the
  // roof reads as a real angled surface rather than a flat silhouette
  g.strokeStyle=lerpColor(roofColor,'#4a5a80',0.4); g.globalAlpha=0.45; g.lineWidth=1;
  g.beginPath(); g.moveTo(x-overhang,y-h); g.lineTo(peak,y-h-roofH); g.stroke();
  g.globalAlpha=1;
  if(opts.secondaryRoof){ // a small lean-to roof over a side extension
    g.fillStyle=roofColor;
    g.beginPath();
    g.moveTo(x+w+overhang,y-h*0.56); g.lineTo(x+w+overhang+w*0.26,y-h*0.76); g.lineTo(x+w+overhang+w*0.26,y-h*0.34); g.lineTo(x+w+overhang,y-h*0.34);
    g.closePath(); g.fill();
  }
  if(opts.chimney){ g.fillStyle=roofColor; g.fillRect(x+w*0.68,y-h-roofH*0.62,w*0.09,roofH*0.5); }
  if(opts.dormer){ // a tiny roof window poking through the pitched roof, its own small triangle + lit pane
    const dx=x+w*0.32, dTop=y-h-roofH*0.42;
    g.fillStyle=roofColor;
    g.beginPath(); g.moveTo(dx-6,dTop+11); g.lineTo(dx,dTop); g.lineTo(dx+6,dTop+11); g.closePath(); g.fill();
    // E24: same COTTAGE_WINDOWS_LIT switch as the regular windows below --
    // this pane was ALWAYS at least 0.1 alpha even when not "dormerLit",
    // the same always-on-regardless-of-anything bug.
    g.globalAlpha=COTTAGE_WINDOWS_LIT?(opts.dormerLit?0.3:0.1):0; g.fillStyle='rgba(255,196,120,1)';
    g.fillRect(dx-2.2,dTop+3,4.4,6.5); g.globalAlpha=1;
  }
  if(opts.door){ g.fillStyle=lerpColor(wallColor,'#000000',0.3); g.fillRect(x+w*0.42,y-h*0.32,w*0.14,h*0.32); }
  // E24: these "ambient/always-on" baked windows (see this function's own
  // header comment) were a real, separate bug -- direct player report,
  // screenshotted twice, of buildings reading as lit with zero restoration
  // and only a handful of fireflies caught. These 15 houseTypeA-E cottages
  // (in renderBG()'s background/midground/foreground bands) are baked into
  // the cached per-season bg canvas and were lit from FRAME 1 of every
  // round, completely independent of S.score AND of restoration -- a THIRD
  // light source, never gated by anything, that the E20/E23 ambient-vs-
  // restoration work never touched because it lives entirely outside the
  // LIGHTS/S.lightAnim/S.landmarkAnim systems. The original rationale (kept
  // strictly at x<130/x>470, "outside the live coordinate cluster, so it
  // can never be mistaken for an unlocked decoration") assumed a player
  // reads the screen zone-by-zone; in practice a player sees one village
  // and any lit window reads as "this building is lit," full stop,
  // regardless of which x-range drew it. Fixed by not drawing them at all --
  // COTTAGE_WINDOWS_LIT below is the one on/off switch (kept, not deleted,
  // so the "per-window brightness variation" design intent stays visible
  // and trivially restorable if a FUTURE feature ever wants these dark
  // silhouettes to earn their own light some other way).
  if(COTTAGE_WINDOWS_LIT)(opts.windows||[]).forEach(win=>{ // each window carries its OWN brightness -- see section 8: some houses bright, some dim, never a uniform lit row
    g.globalAlpha=win.a; g.fillStyle='rgba(255,196,120,1)';
    g.fillRect(x+win.dx*w-2.4,y-h+win.dy*h-3,4.8,7); g.globalAlpha=1;
  });
}
// Type A: small cottage -- steep roof, one modest window, a door.
function houseTypeA(g,x,y,scale,wallColor,roofColor){
  cottagePrimitive(g,x,y,32*scale,24*scale,17*scale,wallColor,roofColor,{windows:[{dx:0.42,dy:0.4,a:0.24}],door:true});
}

// Type E: the largest building (an inn-like silhouette) -- chimney plus five

function houseTypeE(g,x,y,scale,wallColor,roofColor){

// Visual Refinement pass: renderBG() rebuilt for real art-direction depth --
// a richer multi-stop sky with soft cloud wisps, three ridgeline mountain
// layers (was two flat treeline layers), a discrete forest layer framing the
// village at its edges, village paths, a plaza clearing, a moonlit river
// highlight, four new edge cottages with ambient warm windows, and denser
// foreground vegetation -- still 100% procedural (no image asset), same
// offscreen-canvas/per-tier-cache/cross-fade mechanism as before, same
// `pal` parameterization so all 6 SEASON_PALETTES keep working unchanged.
// Every element a LIVE system depends on for exact position is still
// untouched: the 5 original house() calls (LIGHTS' window rects are
// calibrated to sit on THESE), the 4 lamppost stems, the bridge, the
// windmill tower (blades in drawVillage() rotate around a fixed anchor
// matching this tower), and the LIGHTS unlit-window rects loop. Every new
// light-emitting element (cottage windows) stays strictly at x<130 or
// x>470 -- outside the live Fountain/Garden-Lantern/Village-Heart/
// environmental-detail coordinate cluster (roughly x:150-460), so nothing
// baked here can ever be mistaken for a decoration the player hasn't
// actually unlocked yet.
function renderBG(tier){
  // tier defaults to 1 (Summer) so the unconditional call below — made at
  // module load, before `best` even exists yet — has something valid to draw;
  // the update() loop re-renders with the real tier on the very first frame
  // (see lastHeartTier below), before this canvas is ever actually shown.
  const pal=SEASON_PALETTES[tier||1];
  const g=bg.getContext('2d');
  // Visual bug found in the live browser pass on Snow specifically: pal.tree1/
  // tree2 are intentionally LIGHT for that season (snow-capped peaks), but
  // used directly as a full-size, full-opacity mountain/forest silhouette
  // fill they wash out almost the entire lower half of the screen, wrecking
  // sky contrast and text/jar readability. mtn1/mtn2 keep each season's own
  // hue (still derived from the palette, per direct instruction) but are
  // pulled toward dark enough that every season's silhouettes read as
  // nighttime shapes, not just Summer/Autumn's already-dark ones.
  //
  // House Quality + Celestial pass follow-up: per direct feedback, blending
  // toward flat near-black ('#0a0f1a') still let Spring's own green tree
  // colors read as visibly green (see the reference screenshot). Blending
  // toward a deep VIOLET anchor instead -- at a stronger ratio -- fixes that
  // (green shifts toward plum/violet instead of staying green) and doubles
  // as the "more violet, like the reference" ask, in one change. Still
  // genuinely palette-derived (each season's own hue still shows through at
  // 30%), not a hardcoded flat color.
  const NIGHT_VIOLET='#150c28';
  const mtn1=lerpColor(pal.tree1,NIGHT_VIOLET,0.58);
  const mtn2=lerpColor(pal.tree2,NIGHT_VIOLET,0.6);
  // richer sky: 6 stops instead of 4, the extra two interpolated between the
  // existing palette colors (lerpColor) -- no new color data, just smoother
  // gradation, so every season still reads as itself, just less flat.
  //
  // Background Seam fix: the sky's violet richness used to come from a
  // SEPARATE low-alpha rgba() rectangle drawn on TOP of this gradient
  // (g.fillRect(0,H*0.32,W,H*0.5)) -- a flat-alpha layer whose top edge sat
  // at a boundary the gradient itself knew nothing about, and that boundary
  // is exactly what read as a visible horizontal seam across the full width
  // of the sky. Root-caused, not papered over: the violet is now folded
  // directly into the gradient's OWN color stops below, so the whole sky is
  // one continuously-interpolated gradient with no second shape for a seam
  // to exist at. Blend ratio grows gradually from the top stop (0, so the
  // very top stays "deep navy/almost black") down to the bottom stop
  // (0.26, "subtle darker violet atmosphere") -- same richness as before,
  // just with nothing left to seam against.
  const VIOLET_RICH='#5a2d8c';
  const sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,pal.sky[0]);
  sky.addColorStop(0.26,lerpColor(lerpColor(pal.sky[0],pal.sky[1],0.55),VIOLET_RICH,0.06));
  sky.addColorStop(0.48,lerpColor(pal.sky[1],VIOLET_RICH,0.14));
  sky.addColorStop(0.7,lerpColor(lerpColor(pal.sky[1],pal.sky[2],0.5),VIOLET_RICH,0.2));
  sky.addColorStop(0.86,lerpColor(pal.sky[2],VIOLET_RICH,0.24));
  sky.addColorStop(1,lerpColor(pal.sky[3],VIOLET_RICH,0.26));
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  // soft cloud wisps (NEW): extremely low-alpha, blended toward each
  // season's own moon tone for a natural cool haze -- fixed positions, well
  // below the ~20% HUD-safe line, well above the mountain layers so they
  // never read as a mountain-backlight glow.
  g.save();
  g.globalAlpha=1;
  const cloudColor=lerpColor(pal.sky[1],pal.moon,0.22);
  [[110,170,150,26],[380,210,170,22],[250,260,130,20]].forEach(([cx,cy,cw,ch])=>{
    const cg=g.createRadialGradient(cx,cy,0,cx,cy,cw/2);
    cg.addColorStop(0,cloudColor.replace('rgb','rgba').replace(')',',0.05)'));
    cg.addColorStop(1,cloudColor.replace('rgb','rgba').replace(')',',0)'));
    g.fillStyle=cg; g.fillRect(cx-cw/2,cy-ch/2,cw,ch);
  });
  g.restore();
  // three mountain layers (was two), farthest to nearest, each a genuine
  // ridgeline() with mixed sharp/rounded peaks rather than a uniform wave --
  // colors step from hazy (blended toward the sky) to fully saturated
  // pal.tree1, giving real atmospheric depth instead of one flat silhouette.
  // Visual bug found in the live browser pass on Autumn specifically: at
  // full opacity, a hazy ridge blended toward pal.tree1 (a warm brown for
  // Autumn/some other seasons) sitting between the sky's own lightening
  // bottom stop and the darker layers below it read exactly like a
  // forbidden sunrise glow -- a lightness-profile problem, not just a hue
  // one. Fixed by making the two atmospheric (far/mid) layers genuinely
  // translucent (globalAlpha, blending toward whatever is already there
  // instead of a hard full-opacity fill) and biasing their blend further
  // toward the sky than the tree color, on every season, not just Autumn.
  g.save(); g.globalAlpha=0.5;

const REWARDED_AD_IDS={

// "Double the Glow" -- Night Complete screen. Doubles ONLY the coins earned
// during the completed night (coins-coinsAtRoundStart, the same
// authoritative value the existing stat row already displays), never the
// player's running balance, never quest/other rewards. Granted exactly
// once, only after requestRewardedAd() resolves strictly true. Pending/
// claimed state lives on S.rewardedDoubleCoinsPending/
// ...Claimed (see reset()) so it's per-round like every other over-screen
// flag here -- a fresh round always gets a fresh opportunity, and a stale
// callback landing after the round has already moved on (roundS!==S) is a
// no-op.
function requestDoubleNightCoins(){
  if(!S.over||S.rewardedDoubleCoinsPending||S.rewardedDoubleCoinsClaimed)return;
  if(!upgrades.tutorialDone)return; // first-night tutorial stays completely ad-free
  if(!rewardedAdsAvailable())return;
  // S.coinsEarnedThisNight (snapshotted once in finalizeNight(), see below) --
  // NOT a live coins-coinsAtRoundStart recompute. Deep-check finding: the
  // Night Complete screen lets a player visit the Workshop and claim its
  // own +75 favor, then return here, WITHOUT this round ever resetting --
  // a live recompute would silently fold that +75 into "tonight's
  // earnings" and double it too, directly violating "do NOT double other
  // rewarded-ad rewards." The frozen snapshot is the actual, authoritative
  // gameplay-earned amount, taken at the exact moment the night ended,
  // before any post-round reward could touch `coins`.
  const earned=S.coinsEarnedThisNight;
  if(earned<=0)return; // nothing meaningful to double -- caller (drawOver/pointerdown) already hides the button for this case too
  S.rewardedDoubleCoinsPending=true;
  const roundS=S;
  let result;
  try{ result=YT.ads.requestRewardedAd(REWARDED_AD_IDS.DOUBLE_NIGHT_COINS); }
  catch(e){ roundS.rewardedDoubleCoinsPending=false; return; }
  Promise.resolve(result).then(res=>{
    if(roundS!==S)return; // round already moved on -- discard
    roundS.rewardedDoubleCoinsPending=false;
    if(res===true){
      roundS.rewardedDoubleCoinsClaimed=true;
      roundS.rewardedDoubleCoinsAmount=earned; // snapshotted for the confirmation text -- coins-coinsAtRoundStart would silently grow to include the reward itself once granted
      coins+=earned; // exactly the night's earnings, duplicated once -- never the running balance
      if(!YT){ try{ localStorage.setItem('gk2_coins',''+coins); }catch(e){} }
      saveProgress();
    }
  },()=>{ if(roundS===S)roundS.rewardedDoubleCoinsPending=false; });
}
// "One More Chance" / Extra Life -- offered exactly once, the instant the
// player would otherwise hit the normal 5-miss ending (see the
// S.misses>=missLimit check in update() below). Declining, a false/
// rejected/thrown ad request, or an unavailable SDK all fall through to
// the exact same finalizeNight() the normal ending already used -- never a
// frozen/half-paused state. S.extraLifeAvailable is the mechanical gate
// (bumps the miss LIMIT from 5 to 6 for the rest of this round, never
// touches S.misses itself); S.extraLifeUsed is the one-shot "already
// offered/claimed" gate that prevents a second offer on the next miss.
// Both are per-round (see reset()) and are NEVER persisted -- this is not
// permanent progression.
function finalizeNight(){
  // E15: re-entry guard. The miss-detection loop (see the S.flies for-loop
  // above) never breaks/returns after a single miss, so if MORE THAN ONE
  // firefly independently crosses patience<=0 in the SAME frame -- entirely
  // realistic under a high-spawn contract/event (Rush, Firefly Rain), where
  // several fireflies can be drifting near expiry at once -- each one
  // re-checks S.misses>=missLimit and, absent the Extra Life offer, would
  // call finalizeNight() again before S.over's own early-return in update()
  // ever gets a chance to matter (that check only guards the NEXT frame,
  // not further iterations of the SAME for-loop pass). Without this guard,
  // a second call would double-push contractsCompleted and, for a Collector
  // night, double-grant its Workshop Token -- a real, reachable duplicate-
  // reward bug, not a contrived one. This is a pure idempotency check, the
  // same "check right before mutation" discipline jarCanAcceptCatch()
  // already established -- the first, legitimate call always sees
  // S.over===false (only finalizeNight() itself ever sets it true), so
  // nothing about the real ending sequence changes.
  if(S.over)return;
  // Frozen once, right here -- the one authoritative "gameplay earned this
  // night" figure Double the Glow reads (see requestDoubleNightCoins()).
  // Taken before S.over flips true, so nothing reachable from the Night
  // Complete screen (Workshop's own favor, a stray double-claim) can ever
  // contaminate it after the fact.
  S.coinsEarnedThisNight=coins-coinsAtRoundStart;
  // Miss-category objectives no longer need anything evaluated here -- they
  // were redefined to be live-scored (checked at the same delivery-success
  // moment reach_score already uses, see objectiveProgress()) after the
  // original "evaluate at night's end" design turned out to be permanently
  // unwinnable (see the comment where evaluateMissObjectives() used to be
  // defined, just above the D3 section header).
  // D3: record which contract ran, once, at this exact authoritative moment
  // -- same "the night has genuinely ended" site nightNumber/
  // nightsCompletedThisSession update at (in continueFromOver()). The coin
  // multiplier reward already landed continuously all night via
  // grantDeliveryCoins() (see contractPayoutCoins() for the display-only
  // re-derivation); Collector's flat Workshop Token has no continuous hook
  // to ride along with, so it's granted here instead.
  if(activeContract>=0){
    contractsCompleted.push(CONTRACTS[activeContract].id);
    if(CONTRACTS[activeContract].tokenReward)workshopTokens++;
  }
  S.over=true; S.overT=0; sOver(); saveProgress(); recordNightEconomy();
  // Night Complete tips: picked once, right here, rather than re-rolled
  // every drawOver() frame -- same "pick once at the moment of the event"
  // discipline as S.batchPerfect elsewhere.
  S.tip=NIGHT_TIPS[Math.floor(Math.random()*NIGHT_TIPS.length)];

  if(YT&&YT.engagement&&YT.engagement.sendScore){ try{ YT.engagement.sendScore({value:best}); }catch(e){} }
  if(humGain)humGain.gain.setTargetAtTime(0.0001,AC.currentTime,0.3);
  S.flies.forEach(o=>{ if(o.state==='drift'){o.state='leaving';o.vy=-30;} });
}

function declineExtraLife(){

function requestExtraLife(){
  if(!S.extraLifeOfferOpen||S.extraLifePending||S.extraLifeUsed)return;
  if(!rewardedAdsAvailable()){ declineExtraLife(); return; } // defensive -- the offer itself only opens when ads are available, see update()
  S.extraLifePending=true;
  const roundS=S;
  let result;
  try{ result=YT.ads.requestRewardedAd(REWARDED_AD_IDS.EXTRA_LIFE); }
  catch(e){ roundS.extraLifePending=false; if(roundS===S)declineExtraLife(); return; }
  Promise.resolve(result).then(res=>{
    if(roundS!==S)return; // round already moved on -- discard
    roundS.extraLifePending=false;
    if(res===true){
      // grants zero coins, on purpose -- purely one additional miss before the night ends
      roundS.extraLifeAvailable=true;
      roundS.extraLifeUsed=true;
      roundS.extraLifeOfferOpen=false; // closes the overlay; loop()'s update() gate un-freezes next frame
    } else if(roundS===S){
      declineExtraLife();
    }
  },()=>{ if(roundS===S){ roundS.extraLifePending=false; declineExtraLife(); } });
}

// duration, lightValue -- already increases monotonically from simple to
// aurora, with no jar ever trading a stat away for another. That's a real
// "buy the next tier" progression, not a playstyle choice, and none of it
// is touched here (per direct instruction: no price/capacity/reach/
// magnetReach/duration/lightValue number changes in this phase). This is
// purely an ADDITIVE identity layer: one small, distinct passive per jar,
// layered on top via the existing multiplicative-layer discipline
// (nightEventCoinMult()/contractCoinMult() already stack this way) rather
// than a second stat system. Two jars deliberately get NO new passive:
// simple (the free baseline -- "no bonus" is itself an honest, legitimate
// identity) and aurora (already the highest stat in every single column;
// stacking a 6th lever on the already-strongest jar would directly
// contradict "no jar should be the universal best choice" -- its
// identity is its own already-existing prestige treatment: highest raw
// stats, exclusive Aurora Trail, shimmer FX). The remaining four each get
// exactly one small (10-15%) bonus, deliberately smaller than every
// existing comparable multiplier in the file (contractCoinMult() reaches
// 1.65, nightEventCoinMult() 1.20) so no identity reads as "obviously
// mandatory." Each bonus's THEME was picked to match that jar's own
// existing name/flavor text, not assigned arbitrarily -- see each
// entry's own comment.
const JAR_IDENTITY={
  simple:  { name:'Balanced',     effect:'No bonus, no drawback — the honest baseline every other jar is measured against.' },
  // "Made for Glowkeepers who learned to carry the light farther" -- its
  // own existing desc already names range; the identity effect is a small
  // EXTRA boost specifically while the Glow Magnet buff is active (not a
  // flat passive reach increase, which would just be another stat), so it
  // rewards actually chasing the magnet pickup, a playstyle choice.
  lantern: { name:'Range Keeper', effect:'The Glow Magnet reaches 10% farther while active.' },
  // "Its glass holds a little moonlight of its own" -- ties directly to
  // Phase 4's existing Night Event system (S.eventActive), not a new
  // detector.
  moon:    { name:'Night Watcher', effect:'+10% coins on deliveries during an active Night Event.' },
  // "Cut facets scatter each spark into a dozen smaller ones" -- ties to
  // the existing Glow Chain milestone rewards (CHAIN_MILESTONES), not a
  // new chain mechanic.
  crystal: { name:'Chain Keeper', effect:'Glow Chain milestone rewards are 15% larger.' },
  // Named after the Elder firefly type itself -- ties to the existing
  // isRareType() rarity classification (the same one Weekly Progression's
  // own 'rare' goal already reuses), not a new rarity system.
  elder:   { name:'Rare Seeker',  effect:'+15% coins on deliveries that include a rare firefly.' },
  // Kept deliberately short (unlike the other 5 effect strings) -- Aurora's
  // OWN desc already wraps to 2 lines in the equipped-jar hero card
  // (jar.aurora shifts the identity block's start down), leaving less
  // vertical room before the card's fixed Capacity anchor than any other
  // jar has. A longer sentence here was verified live to overflow into
  // "CAPACITY" below it -- found and fixed during this phase's own live
  // browser check, not guessed at.
  aurora:  { name:'Prestige',     effect:'Its already-leading stats are its own bonus.' }
};
function jarIdentity(jarObjOrKey){
  const key=typeof jarObjOrKey==='string'?jarObjOrKey:jarObjOrKey.key;
  return JAR_IDENTITY[key]||JAR_IDENTITY.simple;
}
// One small function per effect, each a single equipped-jar key check --
// cheap (currentJar() is already called many times per frame elsewhere in
// this file), never a scan of all jars, no per-frame polling of its own.
function jarIdentityCoinMult(type){
  const jar=currentJar();
  if(jar.key==='elder'&&isRareType(type))return 1.15;
  if(jar.key==='moon'&&S.eventActive)return 1.10;
  return 1;
}
function jarIdentityMagnetRangeMult(){ return currentJar().key==='lantern'?1.10:1; }
function jarIdentityChainRewardMult(){ return currentJar().key==='crystal'?1.15:1; }

// amount -- used by BOTH advanceChain()'s real grant and the D2 reward-chip
// display (see D2_REWARD_BY_N's own comment), so the on-screen number can
// never disagree with what was actually added to coins.
function chainMilestoneReward(baseReward){ return Math.round(baseReward*jarIdentityChainRewardMult()); }

// jar and independent of which one is currently equipped — "equipped jar +
// its own permanent upgrade level = current capacity" (spec section 8).

function jarCapTierOwned(jarKey){ return (upgrades.jarCapTiers&&upgrades.jarCapTiers[jarKey])||0; }

// flat +1-per-tier count -- the target BASE->MAX spans (e.g. Simple 4->7)

// several levels necessarily repeat the same integer capacity.

// (EXPLICIT_TIER_PRICES) is locked to its previously-approved flat/
// escalating values -- a "filler" level (capacity repeats) costs the
// same as its neighbors, per direct instruction, not a discounted
// amount. "Capacity is the ONLY stat where multiple levels may display
// the same whole-number capacity because the gameplay quantity is
// integer-based" is explicitly acknowledged and accepted in that lock.
// CAPACITY_LEVELS is the explicit, real per-level integer capacity,
// index 0 = 0 tiers owned (= jarObj.capacity), last index =
// CAP_TIER_COUNT[key] tiers owned (= jarObj.maxCapacity exactly).

// Clamped, not a bare index -- a corrupted/tampered/stale save's
// jarCapTiers could exceed CAP_TIER_COUNT (the old Math.min(...,
// maxCapacity) formula clamped this for free; a raw array index does not).
function jarCurrentCapacity(jarObj){ const levels=CAPACITY_LEVELS[jarObj.key]; return levels[Math.min(jarCapTierOwned(jarObj.key),levels.length-1)]; }
// E26 Round 2: maxed means "every tier bought", NOT "capacity value has
// reached its ceiling" -- these used to be identical (flat +1/tier), but
// now several jars' capacity VALUE reaches maxCapacity one or more tiers
// before their real last tier (see CAPACITY_LEVELS' own trailing
// duplicates). Basing "maxed" on the stat value instead of the tier count
// would hide the real final (filler) tier(s) behind "MAX LEVEL" in the
// shop UI, making them permanently unpurchasable -- a real bug, not a
// cosmetic one.
function jarCapMaxed(jarObj){ return jarCapTierOwned(jarObj.key)>=CAP_TIER_COUNT[jarObj.key]; }

const COIN_VALUE_LEVELS=60, COIN_VALUE_STEP=0.0125, COIN_VALUE_START_PRICE=60, COIN_VALUE_ENDGAME_MULT=2.5;
// Upgrade Cost Escalation pass: per direct instruction, Capacity/Range
// (Jar Reach + Magnet Reach)/Light Value/Magnet Duration all needed to feel
// much steeper per tier than the old flat linear step. "Triple the next
// upgrade" taken as a literal, uncapped 3x-per-tier compound would have
// been unplayable on Aurora's longer ladders (its 13-tier Capacity line
// alone would total ~30 MILLION coins) -- so this tapers instead: the first
// two tier-to-tier steps are a genuine 3x, then the ratio decays toward a
// 1.2x floor so long lines stay steep early without becoming absurd late.
// LOCKED shape (floor 1.2, decay 0.35) after reviewing the exact resulting
// price tables — see jarCapUpgradeCost()/jarStatUpgradeCost() below, which
// both compound off this one shared ratio function. Applies ONLY to these
// four per-jar upgrade lines — explicitly NOT jar purchase price, NOT the
// shared Coin Value line (TIER_LINES.light), NOT quest rewards.
function tierCostRatio(tier){ return tier<2?3.0:1.2+(3.0-1.2)*Math.pow(0.35,tier-1); }
function compoundTierCost(base,tier){ let c=base; for(let t=0;t<tier;t++)c=Math.round(c*tierCostRatio(t)); return c; }
// Shop Economy 2.0 (E2): replaces compoundTierCost()/tierCostRatio() as the
// live price formula for every per-jar upgrade line and the shared Coin
// Value line -- those two functions above are left completely intact (not
// deleted, not rewired) purely so old code/tests that reference them
// directly keep working; nothing in the live purchase path calls them
// anymore as of this pass. E1's own audit found the old 3x/3x/decay-to-1.2x
// curve produced genuinely catastrophic totals once a line's tier count
// grew past ~15 (Aurora's old 13-tier Capacity line alone reached ~21,000
// coins), so a from-scratch compound curve was never a safe option for the
// much longer E2 ladders -- this is the E1-approved BANDED + INTERPOLATED
// curve instead: five progression bands (very-early/early/mid/late/
// endgame), each spanning ceil(totalTiers/5) tier indices, with price
// interpolated SMOOTHLY within a band (every single tier moves the price a
// little, never a flat same-price band and never a sudden spike between
// bands). BAND_TARGETS are E1's own average-player-income-calibrated
// figures (60 coins/night reference: ~1.5/2.5/4/6.5/11.5 nights per level
// in each band) -- scaled proportionally to THIS LINE's own real starting
// price (so a cheap line like Duration gets proportionally cheap bands,
// never Coin-Value-sized absolute numbers), and the endgame reach is
// additionally scaled by `endgameMult`, applied PROGRESSIVELY across the 5
// bands (band 0 gets none of it, band 4 gets all of it) -- so a jar's
// EARLY price is completely unaffected by its own endgame multiplier; only
// the far ceiling moves. This is what keeps Simple's first purchase cheap
// while still letting Aurora's last purchase be enormous, per E1 Section 9
// ("these multipliers apply ONLY to the late/endgame portion").
//
// Two real bugs were found and fixed while implementing this (not present
// in the shape E1's own report described, only in a first literal
// translation of it into code):
// (1) Scaling every band by (startPrice/BAND_TARGETS[0]) made band 0's own
//     END collapse to EXACTLY startPrice by construction (BAND_TARGETS[0]
//     divided by itself is always 1) -- the "very early" band was
//     perfectly FLAT, the exact "cheap, cheap, cheap, then a jump" shape
//     Section 8 explicitly warns against. Fixed by scaling against a fixed
//     REFERENCE_START_PRICE (60, Coin Value's own real starting price --
//     the line BAND_TARGETS was originally calibrated against) instead of
//     against BAND_TARGETS[0] itself, so band 0 now genuinely grows from
//     startPrice up to its own real target.
// (2) With bug (1) fixed, a band's very first tier (t=0) still landed
//     EXACTLY on the previous band's last tier's price (band N's end IS
//     band N+1's start, by construction), producing one flat repeated
//     price at each of the 4 band seams. Fixed by nudging every band
//     AFTER band 0 to start at t=1/bandCount instead of t=0 -- band 0
//     itself is deliberately excluded from this nudge, since its own
//     first tier (tier index 0) must stay EXACTLY startPrice (the
//     player's real, unchanged first-upgrade price).
const REFERENCE_START_PRICE=60; // Coin Value's own real starting price -- what BAND_TARGETS below was calibrated against
const BAND_TARGETS=[90,150,240,390,690];
function bandedTierCost(startPrice,tierIndex,totalTiers,endgameMult){
  endgameMult=endgameMult||1;
  const bandLen=Math.max(1,Math.ceil(totalTiers/5));
  const bandIdx=Math.min(4,Math.floor(tierIndex/bandLen));
  const bandStartIdx=bandIdx*bandLen;
  const bandCount=Math.min(bandLen,totalTiers-bandStartIdx);
  const bandEndFor=b=>BAND_TARGETS[b]*(startPrice/REFERENCE_START_PRICE)*(1+(endgameMult-1)*(b/4));
  const bandStartPrice=bandIdx===0?startPrice:bandEndFor(bandIdx-1);
  const bandEndPrice=bandEndFor(bandIdx);
  const posInBand=tierIndex-bandStartIdx;
  let t;
  if(bandCount<=1)t=1;
  else if(bandIdx===0)t=posInBand/(bandCount-1); // band 0's own first tier must stay EXACTLY startPrice
  else t=(posInBand+1)/bandCount; // later bands: skip t=0 so a band's own first tier never exactly repeats the previous band's last
  return Math.max(1,Math.round(bandStartPrice+(bandEndPrice-bandStartPrice)*t));
}

function tryUpgradeJarCap(jarKey){
  const jar=JARS.find(j=>j.key===jarKey);
  if(!jar||!upgrades.ownedJars[jarKey])return false; // must own the jar first, same as any other jar action

// Migration only: the frozen shape of the OLD shared "Bonus Capacity" tier

// jarTier (0-7) into a real capacity bonus. Never used by any live gameplay
// code; do not wire this back into TIER_LINES.
const LEGACY_CAPACITY_STEPS=[1,1,1,2,2,3,5];
function legacyCapacityBonus(tier){ let s=0; for(let i=0;i<Math.min(tier,LEGACY_CAPACITY_STEPS.length);i++)s+=LEGACY_CAPACITY_STEPS[i]; return s; }
// Converts an old save's shared jarTier into the new per-jar model. Direct
// decision: the old bonus seeds ONLY the jar that was equipped at save
// time (dstUpgrades.equippedJar, already resolved by the time this is
// called — see call sites) — every other owned jar starts fresh at its own
// base, "your workshop investment followed you to the jar you were
// actually using," not a blanket unlock across the whole collection. The
// raw bonus converts 1:1 into jarCapTiers steps (that field is just a
// tier-owned COUNT, no per-tier step table of its own), capped at that
// jar's own real tier count so an old high jarTier can't overshoot it.
// E26 Round 2: the cap used to be jar.maxCapacity-jar.capacity, which was
// exactly the real tier count back when capacity was flat +1/tier -- now
// that capacity's own span can be narrower than its tier count (see
// CAPACITY_LEVELS), the real bound is CAP_TIER_COUNT, not the raw stat span.
function migrateJarTier(src,dstUpgrades){
  if(typeof src.jarTier!=='number'||src.jarTier<=0)return;
  const bonus=legacyCapacityBonus(src.jarTier);
  const jar=JARS.find(j=>j.key===(dstUpgrades.equippedJar||'simple'));
  if(!jar)return;
  const seeded=Math.min(CAP_TIER_COUNT[jar.key],bonus);
  if(seeded>(dstUpgrades.jarCapTiers[jar.key]||0))dstUpgrades.jarCapTiers[jar.key]=seeded;
}
// Phase 1 economy pass: generic per-jar progression for Jar Reach, Magnet
// Reach, Magnet Duration, and (new this pass) Light Value — same shape as
// Capacity's own per-jar model just above, genericized by `statKey`
// ('reach'|'magnetReach'|'duration'|'lightValue') instead of four
// near-duplicate copies of the same five functions, matching the
// precedent TIER_LINES already set for the shared lines (one data-driven
// system, not N hand-copied ones). upgrades.<statKey>Tiers[jarKey] is how
// many +1 upgrades THAT jar has had for THAT stat — fully independent per
// jar, same "equipped jar's own permanent upgrade level" principle as
// Capacity.
//
// Base/max now genuinely differ per jar (see JARS above) -- tier COUNT is
// therefore derived per jar via jarStatTierCount(), not assumed uniform.
// Step size (the fixed effect-per-upgrade) and the price FORMULA (not a
// fixed-length array anymore -- Capacity already proved a formula is the
// right shape once tier counts vary per jar, 3 for Simple up to 10 for

function jarStatBase(statKey,jarObj){ return jarObj[statKey+'Base']; }

function jarStatTiersField(statKey){ return statKey+'Tiers'; }

// (no hand-authored Duration table exists, per direct instruction); reach/

// straight from JAR_STAT_TIER_COUNT instead of deriving it from a step.
function jarStatTierCount(statKey,jarObj){
  if(statKey==='duration')return Math.ceil((jarStatMax(statKey,jarObj)-jarStatBase(statKey,jarObj))/PER_JAR_STAT_STEP[statKey][jarObj.key]);

  if(statKey==='duration')return Math.min(jarStatBase(statKey,jarObj)+jarStatTierOwned(statKey,jarObj.key)*PER_JAR_STAT_STEP[statKey][jarObj.key], jarStatMax(statKey,jarObj));

// own cost curve above -- every per-jar stat line prices Aurora's tiers
// higher than Simple's at the same tier index, not just longer overall.
// E2 Shop Economy 2.0: bandedTierCost() instead of compoundTierCost() --

function jarStatUpgradeCost(statKey,jarObj){
  if(statKey!=='duration')return EXPLICIT_TIER_PRICES[jarObj.key][statKey][jarStatTierOwned(statKey,jarObj.key)];
  return bandedTierCost(Math.round(PER_JAR_STAT_PRICE_BASE[statKey]*JAR_COST_MULTIPLIER[jarObj.key]),jarStatTierOwned(statKey,jarObj.key),jarStatTierCount(statKey,jarObj),JAR_ENDGAME_MULTIPLIER[jarObj.key]);
}
function tryUpgradeJarStat(statKey,jarKey){
  const jar=JARS.find(j=>j.key===jarKey);
  if(!jar||!upgrades.ownedJars[jarKey])return false; // must own the jar first, same as Capacity
  if(jarStatMaxed(statKey,jar))return false;

  if(coins<cost)return false;

// Migration: converts an old save's SHARED tier count (0-3, from the
// retired jarReachTier/magnetReachTier/durationTier scalars) into the new
// per-jar model. Same philosophy as migrateJarTier() above: seeds ONLY the
// jar that was equipped at save time (dstUpgrades.equippedJar, already
// resolved by the time this is called), every other owned jar starts
// fresh. Old tier count converts 1:1 into the new per-jar tier count
// (lossless for THIS pass specifically because the placeholder base/max/
// step above are identical to the old shared values — see JARS note),
// capped by however many tiers the equipped jar's own range supports.
function migrateSharedStatTier(statKey,oldTierCount,dstUpgrades){
  if(typeof oldTierCount!=='number'||oldTierCount<=0)return;
  const jar=JARS.find(j=>j.key===(dstUpgrades.equippedJar||'simple'));
  if(!jar)return;
  const seeded=Math.min(jarStatTierCount(statKey,jar),oldTierCount);
  const tiers=dstUpgrades[jarStatTiersField(statKey)];
  if(seeded>(tiers[jar.key]||0))tiers[jar.key]=seeded;
}
// E2 Shop Economy 2.0 migration -- the ONE place an existing player's OLD
// tierOwned counts (bought under the pre-E2 step/ceiling/steps-array
// shapes) are converted into their NEW equivalents. Guarded by
// upgrades.economyV2Migrated so it runs EXACTLY ONCE per save, ever,
// regardless of reload/repeated load callbacks/reopening the Workshop/
// restarting a night -- none of those touch this flag, and it's part of
// the same `upgrades` object every other purchase already persists through
// (no new save key introduced). Principle throughout (per E2 Sections
// 15-17): reconstruct the OLD stat value the player's OLD tierOwned count
// actually produced (using the frozen OLD_* constants, never the live
// post-E2 JARS/PER_JAR_STAT_STEP), then find the SMALLEST NEW tierOwned
// count whose NEW stat output is >= that old value -- "preserve or
// slightly increase power, never reduce it." Capacity is deliberately NOT
// touched here: its formula (base + tierOwned, flat +1/tier) never
// changed, only its ceiling rose, so an existing jarCapTiers count is
// already exactly as correct under the new ceiling as it was under the
// old one -- converting it would be pure risk for zero benefit.
function migrateEconomyV2(){
  if(upgrades.economyV2Migrated)return;
  // Coin Value: reconstruct the OLD bonus from the OLD flat 3-entry step
  // array, then find the smallest NEW level (flat COIN_VALUE_STEP) whose
  // cumulative bonus meets or exceeds it.
  const oldLightTier=upgrades.lightTier||0;
  let oldBonus=0; for(let i=0;i<Math.min(oldLightTier,OLD_COIN_VALUE_STEPS.length);i++)oldBonus+=OLD_COIN_VALUE_STEPS[i];
  if(oldBonus>0){
    const newLightTier=Math.min(COIN_VALUE_LEVELS,Math.ceil(oldBonus/COIN_VALUE_STEP-1e-9));
    if(newLightTier>oldLightTier)upgrades.lightTier=newLightTier;
  }
  // Per-jar reach/magnetReach/duration/lightValue: same "reconstruct old
  // value, find smallest new tier that meets or exceeds it" principle,
  // applied independently per jar (a player's progress on one jar was
  // always independent of every other, and stays that way here).
  // E26 Round 2: oldBase/oldMax now come from the frozen PRE_E26R2_
  // STAT_RANGE, not the live jarStatBase()/jarStatMax() -- those changed
  // for the first time this phase, so the old "ceiling never changed"
  // shortcut no longer holds for any of the four stats. reach/magnetReach/
  // lightValue no longer have a flat step to divide by, so their new tier
  // is found by searching STAT_LEVELS' own (monotonic) curve instead;
  // duration keeps the old flat-step division since it has no hand-
  // authored table.
  ['reach','magnetReach','duration','lightValue'].forEach(statKey=>{
    const oldStep=OLD_PER_JAR_STAT_STEP[statKey];
    JARS.forEach(jar=>{
      const tiersObj=upgrades[jarStatTiersField(statKey)];
      const oldTierOwned=(tiersObj&&tiersObj[jar.key])||0;
      if(oldTierOwned<=0)return;
      const oldRange=PRE_E26R2_STAT_RANGE[statKey][jar.key];
      const oldVal=Math.min(oldRange.base+oldTierOwned*oldStep,oldRange.max);
      const newTierCount=jarStatTierCount(statKey,jar);
      let newTierOwned;
      if(statKey==='duration'){
        const newStep=PER_JAR_STAT_STEP[statKey][jar.key];
        newTierOwned=Math.ceil((oldVal-jarStatBase(statKey,jar))/newStep-1e-9);
      } else {
        const levels=STAT_LEVELS[statKey][jar.key];
        newTierOwned=levels.findIndex(v=>v>=oldVal-1e-9);
        if(newTierOwned===-1)newTierOwned=newTierCount;
      }
      newTierOwned=Math.max(0,Math.min(newTierOwned,newTierCount));
      if(newTierOwned>oldTierOwned)tiersObj[jar.key]=newTierOwned;
    });
  });
  upgrades.economyV2Migrated=true;
}

function nightEventCoinMult(){ return S.eventActive==='mothSwarm'?1.2:1; }

// E8: Objective Completion Bonus -- a small, FIXED coin reward for

// never multiplying) their existing individual rewards. One named
// constant, referenced here and by the one Night Complete display line
// that shows it, per direct instruction never to duplicate the number.
const OBJECTIVE_COMPLETION_BONUS=10;
function objectiveProgress(kind,type){

      hudOnObjectiveProgress();
    }
  });

  // of tonight's 3 objectives becomes done -- the exact same "grant once,
  // at the moment of completion" discipline every individual objective
  // reward right above already follows, not deferred to Night Complete
  // (which stays purely DISPLAY, same as the existing OBJECTIVE BONUS
  // line's own comment already establishes). S.objectiveActive.length===3
  // is the existing, real "3 real objectives generated" signal (0 during
  // the tutorial, see ensureNightObjectives()) -- no separate tutorial
  // check needed, and no new "objectivesCompletedForBonus" duplicate state:
  // S.objectiveActive.every(o=>o.done) IS the completion signal, read
  // directly. S.objectiveBonusGranted (per-round, cleared by reset()) is

  if(!S.objectiveBonusGranted&&S.objectiveActive.length===3&&S.objectiveActive.every(o=>o.done)){

// ---------- Lumora 2.0 Phase 2: Glow Chain + Risk/Reward ----------
// The catch mechanic itself, the jar/capacity system, and Perfect Delivery's

// pays out at milestones but resets the instant a firefly is missed, and a

// a new Rare Delivery bonus. No new controls, no new screen -- the existing
// jar-fill indicator (drawFullJarAlert()) and misses dots already make the
// "deliver safely or risk one more catch" decision visible without any
// further UI. Both functions below have exactly one real call site each
// (the catch-success site and the miss site) but are pulled out on their
// own, mirroring objectiveProgress()'s own "one canonical increment

// full catch/miss physics.
const CHAIN_MILESTONES=[
  { n:5,  reward:5,  label:'🔥 Glow Chain ×5' },
  { n:10, reward:10, label:'🔥 Glow Chain ×10' },

// milestone fires -- a chain that long in one ~1-2 minute night is already
// an outstanding outlier, and an unbounded escalating reward would be
// exactly the "distort the economy" risk Phase 0/1 were both explicit
// about avoiding. Numbers otherwise land in the same modest 5-30 coin
// range the existing quest/objective rewards already use.
// D2 (Claude Design spec): every CHAIN_MILESTONES threshold/reward above is
// UNCHANGED -- the handoff's own collision analysis (its 7 reference
// screenshots showed the shared single-line banner clipped under the pause
// button at high chain counts, and crossed the D1 GOALS pill at ×5) is why
// milestones/breaks now render through the pill itself (drawChainHUD(), in

const D2_COOL_RGB='150,200,255';
function advanceChain(){

  // rendering section but hoisted, so it's safe to call from here.
  const priorN=S.chain, priorW=priorN>=3?d2ChainMetrics(priorN).w:0;

  if(S.chain===3){
    S.d2ChainEnterT=0.26; // one-shot enter: alpha/scale animate in drawChainHUD()
  } else if(S.chain>3){
    S.d2ChainTickT=0.22; // per-catch number-pop, see drawChainHUD()
    const newW=d2ChainMetrics(S.chain).w;

  }
  if(S.chain>=3)S.d2ChainLastN=S.chain; // held for the exit/break fade after a miss zeroes S.chain
  if(S.chain>S.bestChainThisRound)S.bestChainThisRound=S.chain; // D5: round-scoped peak, survives the chain itself resetting to 0 on a miss
  const m=CHAIN_MILESTONES.find(m=>m.n===S.chain);

    // reward-chip display reads, so the two can never disagree. Rounded

    coins+=chainMilestoneReward(m.reward);

// Rare Delivery's threshold. TYPES[type].rarity is the existing field every

function isRareType(type){ const r=TYPES[type].rarity; return r!=='common'&&r!=='uncommon'; }

function rarestCarriedType(){

  for(const c of S.carried){ const rk=rank[c.type]||0; if(rk>bestRank){ bestRank=rk; best=c.type; } }

// Called once per completed delivery trip (the same site that already

function resolveDeliveryBonuses(){

  // bonus is otherwise discarded, per direct spec ("counts, not booleans").
  if(S.batchPerfect){ bonus+=10; rows.push({kind:'perfect',label:'perfect delivery',value:'+10'}); S.perfectDeliveryCount++; }
  if(S.batchRareCount>=2){
    const r=5*S.batchRareCount; bonus+=r;
    rows.push({kind:'rare',label:'rare delivery ×'+S.batchRareCount,value:'+'+r});
    S.d2DeliveryTintRGB=S.batchRarestType?toRgbTriple(TYPES[S.batchRarestType].glow):D2_COOL_RGB;

    S.d2DeliveryRows=rows;
    S.d2DeliveryTotal=(rows.length>1?1.45:1.25)+0.34;
    S.d2DeliveryT=S.d2DeliveryTotal;
  }

}

// Minimal quest-object validation at the save-load boundary. The array-level
// check below (Array.isArray/length) already existed, but nothing validated
// each quest's OWN shape -- a malformed/tampered save (e.g. a quest entry
// missing `reward`) could crash questRewardLabel()/grantQuestReward(),
// which read q.reward.kind/q.reward.val unconditionally, since those never
// expected anything other than what rollQuests() itself produces. Purely
// defensive: doesn't change what a valid quest looks like, doesn't touch
// rollQuests()/questProgress()/reward granting/generation at all -- just
// checks a loaded entry has the same shape every quest this game has ever
// actually produced already has.
function isValidQuestObject(q){
  return !!q&&typeof q==='object'
    &&typeof q.id==='string'
    &&typeof q.desc==='string'
    &&typeof q.kind==='string'
    &&typeof q.target==='number'&&q.target>0
    &&typeof q.progress==='number'
    &&typeof q.done==='boolean'
    &&!!q.reward&&typeof q.reward==='object'
    &&typeof q.reward.kind==='string'
    &&typeof q.reward.val==='number';
}
// decides fresh-quests-vs-keep-existing; called once prevLastPlayed/loadedQuests
// are both actually known (immediately below for !YT, inside loadData().then() for YT)
function resolveQuests(loadedQuests){
  if(prevLastPlayed<=0||localDayKey(prevLastPlayed)!==localDayKey(lastPlayed)){ rollQuests(); } // new day, or first-ever session -> fresh
  else if(Array.isArray(loadedQuests)&&loadedQuests.length){
    // keep only the entries that actually pass validation -- a single
    // malformed entry in an otherwise-valid array shouldn't cost the player

// within E1's approved 15% threshold of affording their CURRENTLY VIEWED
// upgrade, an optional ad covers exactly the remaining shortfall -- never
// the whole cost, never a flat/fixed amount. Reuses the exact same
// rewarded-ad infrastructure (rewardedAdsAvailable()/YT.ads.
// requestRewardedAd()/coins/saveProgress()) every existing ad already
// uses -- no second ad framework, no new currency, no new save field
// (the only persistent effect is the existing `coins` balance changing,
// through the exact same path a delivery or a purchase already uses).
// REWARDED_AD_IDS.WORKSHOP_SMALL_UPGRADE was reserved for exactly this
// purpose back in the Monetization 2.0 pass ("defined here for
// completeness but deliberately NOT wired to any UI/claim path in this
// pass") -- this is that wiring, not a new ID.
//
// `target` identifies WHICH upgrade line is being offered the ad, one of:
//   {kind:'light'}                          -- the shared Coin Value line
//   {kind:'jarCap', jarKey}                 -- a jar's Capacity line
//   {kind:'jarStat', statKey, jarKey}       -- a jar's Reach/Magnet Reach/Duration/Light Value line
// Always re-derived from LIVE upgrades/coins state, never cached -- the
// same "never trust a value computed when the button was first shown"
// discipline every other exact-price/exact-reward check in this file
// already follows (jarCanAcceptCatch(), grantDeliveryCoins(), etc.).
function almostAffordableCost(target){
  if(target.kind==='light')return TIER_LINES.light.prices[tierOwned('light')];
  const jar=JARS.find(j=>j.key===target.jarKey);
  if(!jar)return Infinity;
  if(target.kind==='jarCap')return jarCapUpgradeCost(jar);
  if(target.kind==='jarStat')return jarStatUpgradeCost(target.statKey,jar);
  return Infinity;
}
function almostAffordableMaxed(target){
  if(target.kind==='light')return tierMaxed('light');
  const jar=JARS.find(j=>j.key===target.jarKey);
  if(!jar)return true;
  if(target.kind==='jarCap')return jarCapMaxed(jar);
  if(target.kind==='jarStat')return jarStatMaxed(target.statKey,jar);
  return true;
}
// E1's own approved threshold, locked -- "the player has at least 85% of
// the required coins" (E4 Section 4). Never adjusted by this feature to
// compensate for a price/income concern -- see this phase's own report.
const ALMOST_AFFORDABLE_THRESHOLD=0.15;
function almostAffordableShortfall(target){
  if(almostAffordableMaxed(target))return 0;
  const cost=almostAffordableCost(target);
  return Math.max(0,cost-coins);
}
// The single source of truth for "should this specific card show Watch Ad
// instead of the normal Upgrade button right now" -- called both by the
// draw code (to decide what to render) and the pointerdown handler (to
// decide what a tap on that exact button rect should do), so the two can
// never disagree about which state is showing.
function almostAffordableEligible(target){
  if(almostAffordableMaxed(target))return false;
  if(!rewardedAdsAvailable())return false; // never show an ad offer the platform can't actually deliver
  const cost=almostAffordableCost(target);
  if(coins>=cost)return false; // already affordable -- the normal Upgrade button is the only relevant action
  const shortfall=cost-coins;
  return (shortfall/cost)<=ALMOST_AFFORDABLE_THRESHOLD;
}
// Session-level pending guard (not persisted), same shape as
// workshopFavorPending/mysteryChestPending above -- rejects a second call
// while one is already in flight, covering double-taps and any duplicate/
// retried callback the platform might otherwise deliver.
let almostAffordablePending=false;
function requestAlmostAffordable(target){
  if(almostAffordablePending)return;
  if(!upgrades.tutorialDone)return;
  if(!almostAffordableEligible(target))return; // re-verify at request time, not just trust the button having been shown a frame ago
  almostAffordablePending=true;
  let result;
  try{ result=YT.ads.requestRewardedAd(REWARDED_AD_IDS.WORKSHOP_SMALL_UPGRADE); }
  catch(e){ almostAffordablePending=false; return; }
  Promise.resolve(result).then(res=>{
    almostAffordablePending=false;
    if(res===true){
      // Recalculated HERE, at the moment the reward is actually granted --
      // never the amount shown when the ad was requested. If the player's
      // balance changed while the ad played (a real delivery, another
      // reward, buying a different upgrade) the reward shrinks to match,
      // and if they now already afford it (or the line got maxed in the
      // meantime), it's exactly 0 -- never a duplicate/excess grant, never
      // an exploit, one ad can only ever cover ONE shortfall.
      const reward=almostAffordableShortfall(target);
      if(reward>0){
        coins+=reward;
        if(!YT){ try{ localStorage.setItem('gk2_coins',''+coins); }catch(e){} }
        saveProgress(); // the existing coin balance's own persistence path -- no new save field
      }
    }
  },()=>{ almostAffordablePending=false; }); // failure/cancel/rejection: no coins, Workshop stays exactly as usable as before
}
// Shared tap-dispatch for every upgrade button in the Workshop -- if this
// EXACT target is currently showing "Watch Ad" (per almostAffordableEligible(),
// the same function the draw code checks), route the tap to the ad
// request instead of the normal purchase function. One shared function so
// this decision can never be made differently by the draw code and the
// hit-test.
function handleUpgradeButtonTap(target,buyFn){
  if(almostAffordableEligible(target))requestAlmostAffordable(target);
  else buyFn();
}
// steps aren't necessarily uniform per line, so every *ForRun() sums the
// OWNED steps rather than multiplying tier-count by a single flat step value.
function tierBonusSum(key){ const line=TIER_LINES[key], n=tierOwned(key); let s=0; for(let i=0;i<n;i++)s+=line.steps[i]; return s; }
// LUMORA clarifications pass: capacity no longer runs through TIER_LINES at
// all -- see jarCurrentCapacity() (declared alongside JARS, near `let
// upgrades=`) for the per-jar max-ceiling model that replaced it.
function jarCapacityForRun(){ return jarCurrentCapacity(currentJar()); }
// Phase 1 economy architecture: reach/duration now read the EQUIPPED jar's
// own per-jar progress, same pattern as capacity just above -- no more
// shared tierBonusSum('jarReach'/'magnetReach'/'duration'). magnetDurationForRun
// keeps its `base` param for call-site compatibility even though the real
// base now lives on the jar object, not the caller.
function jarReachForRun(){ return jarCurrentStat('reach',currentJar()); }
function magnetReachForRun(){ return jarCurrentStat('magnetReach',currentJar()); }
function magnetDurationForRun(base){ return jarCurrentStat('duration',currentJar()); }
function coinMultiplierForRun(){ return 1+tierBonusSum('light'); }
// Phase 1 economy pass: the ONE place a raw fractional coin value (a
// delivered firefly's TYPES[type].coins, already scaled by
// coinMultiplierForRun()) becomes spendable `coins`. Accumulates into
// coinFraction rather than rounding this single catch in isolation --
// crossing a whole number moves that whole part into `coins` and keeps
// the leftover fraction for next time, so nothing earned is ever lost to
// rounding, and nothing is ever spendable before it's actually whole.
function grantDeliveryCoins(rawValue){
  coinFraction+=rawValue;
  const whole=Math.floor(coinFraction);
  if(whole>0){ coins+=whole; coinFraction-=whole; }
  if(!YT){ try{ localStorage.setItem('gk2_coins',''+coins); localStorage.setItem('gk2_coinFraction',''+coinFraction); }catch(e){} }
}

// FLAT for the entire s<10 stretch, then jump at 10, then sit flat again
// until 20 -- three plateaus, hard jumps at the boundaries, and ZERO ramp
// at all below score 10. That flat opening decade is what "easy from the
// first minute" actually was, not a slow ramp -- there wasn't a ramp yet.
// Stage 0's deliberate ~5-second gentle hook is untouched: every s=0 value
// below is byte-identical to before (maxFlies 3, patience 12-14, speed
// 16-26, no moths). Only how soon the game climbs AWAY from that hook
// changed -- tier boundaries compressed 10->5 and 20->13, so the old
// "score 10" difficulty now arrives by score 5, and the old "score 20"
// (hardest, was previously a further 10 points away) arrives by score 13 --
// both comfortably inside a typical first minute instead of well past it.
// blue/shy TYPE unlocks (s>=10/s>=15, per the firefly reference table) and
// magRate (a player-favoring bonus pickup, not a challenge axis) are left
// exactly as they were -- content pacing and player aid timing aren't what
// this pass targets, density/patience/speed is.
// The hard-tier boundary specifically landed on 13, not 12: the Elder
// firefly's own unlock gate is S.score>=12 (see the elder-timer block
// below), and an initial 12 here would have made the hardest settings
// (maxFlies 6, patience 9-11, mothRate 6-9) kick in on the EXACT score
// Elder first becomes catchable -- coupling the rarest, highest-value
// firefly's first opportunity to the worst odds of landing it. That
// coupling was accidental (12/20 were picked as round compressed numbers,
// without cross-checking the Elder gate), not desired, so the boundary was
// moved one point to keep Elder's unlock inside the medium tier, same as
// it was under the old curve (where s=12 sat mid-way through a 10-20
// medium tier, nowhere near the hardest settings).

// 1) Leave-patience: fireflies were leaving (going uncaught long enough to
//    fly off and count as a miss) too fast for new players. Patience stays
//    at the gentle s<5 value (12-14) all the way out to score 60, instead of
//    dropping through the medium (10-12) and hard (9-11) tiers at the usual
//    5/13 boundaries. At s>=60 it reverts to exactly the same hard-tier
//    value (9-11) the curve has always used there -- "normal speed," not a
//    new value of its own.
// 2) maxFlies: reduced "by only a little," per direct request -- only the
//    hardest tier (6, normally s>=13) is trimmed to 5 for 13<=s<60. The s<5
//    gentle hook (3) and s<13 tier (4) are both left byte-identical --
//    already modest, and the s<5 value specifically is the documented
//    Depth Pass Part 1 hook, not something to touch here. At s>=60 maxFlies

    // contract, so this is a no-op change for everyone else.
    speed:    (s<5?rand(16,26) : rand(22,36))*contractSpeedMult(),
    blue:     s>=10, shy: s>=15,

// Trail System Redesign: an explicit safety ceiling on ACTIVE particles
// before spawning any more trail particles -- S.parts is shared with every
// other particle source in the file (catch streaks, fountain droplets,
// delivery sparks' own trailing bits, puff() bursts, Aurora's ambient
// sparkle), so this only throttles NEW trail spawns once the shared array
// is already busy; it never removes anything else's particles.
const TRAIL_PARTICLE_CAP=140;
// Layered, movement-scaled trail: 4 particle layers (soft glow / medium /
// spark / tiny highlight), each with its own size/peak-alpha/life/drift, so
// the trail reads as a natural drifting cluster rather than one thick
// colored line. Emission rate and lifetime both scale with S.jar.spd
// (faster jar -> more particles + a slightly longer-lived, so visually
// longer, trail) -- below a "basically stationary" speed floor nothing new
// spawns at all, so already-emitted particles simply fade out (see the
// shared decay loop in update()) instead of a trail persisting behind a
// parked jar. Aurora Trail is picked up automatically via activeTrailHues()
// -- no separate Aurora-specific branch needed here.
function spawnTrailParticles(dt){
  const hues=activeTrailHues();
  if(!hues||hues.length===0)return;
  const spd=S.jar.spd;
  if(spd<14||S.parts.length>=TRAIL_PARTICLE_CAP)return;
  const intensity=clamp((spd-14)/140,0,1);
  // cycles through the trail's own palette over time (not per-particle
  // random) so a multi-hue trail (Moonlit/Starlight/Celestial/Aurora) reads
  // as a coherent slow gradient shift, not confetti.
  const hue=hues[Math.floor(S.t*1.6)%hues.length];
  const bx=S.jar.x, by=S.jar.y-10;
  if(Math.random()<dt*(3+intensity*9))S.parts.push({x:bx+rand(-5,5),y:by+rand(-5,5),vx:rand(-3,3),vy:rand(-3,3),life:0.5+intensity*0.3,maxL:0.5+intensity*0.3,color:hue,r:rand(3.5,5),a:0.35});
  if(Math.random()<dt*(5+intensity*14))S.parts.push({x:bx+rand(-6,6),y:by+rand(-6,6),vx:rand(-4,4),vy:rand(-4,4),life:0.35+intensity*0.25,maxL:0.35+intensity*0.25,color:hue,r:rand(2,3),a:0.6});
  if(Math.random()<dt*(6+intensity*16))S.parts.push({x:bx+rand(-7,7),y:by+rand(-7,7),vx:rand(-5,5),vy:rand(-5,5),life:0.22+intensity*0.15,maxL:0.22+intensity*0.15,color:hue,r:rand(1,1.8),a:0.85});
  if(Math.random()<dt*(1+intensity*3))S.parts.push({x:bx+rand(-6,6),y:by+rand(-6,6),vx:rand(-3,3),vy:rand(-3,3),life:0.18+intensity*0.12,maxL:0.18+intensity*0.12,color:'rgba(255,250,240,1)',r:rand(1,1.4),a:0.9});
}

// E3 Shop Progression UI: lightweight progression markers for E2's long
// upgrade ladders -- pure display, no reward/currency/popup attached (per
// direct instruction). Expressed as FRACTIONS of a line's own max level,
// not the literal absolute numbers 5/15/30/45/60 -- those only made
// literal sense for Coin Value's specific 60-level line; expressing them
// as ~8%/25%/50%/75%/100% instead means every line, from Coin Value's 60
// levels down to Simple Capacity's 8, gets the same proportional milestone
// rhythm rather than a hardcoded number that wouldn't fit a short ladder.
// Reads no new persisted state -- purely a function of a level/max pair
// the caller already has.
const PROGRESSION_MILESTONE_FRACTIONS=[1/12,1/4,1/2,3/4,1];
function progressionMilestones(maxLevel){
  const seen={}, out=[];
  PROGRESSION_MILESTONE_FRACTIONS.forEach(f=>{
    const lvl=Math.max(1,Math.min(maxLevel,Math.round(f*maxLevel)));
    if(!seen[lvl]){ seen[lvl]=true; out.push(lvl); }
  });
  return out;
}
// The smallest milestone strictly above `level`, or null if none remain
// (already at or past the final milestone -- the max-level state already
// communicates completion on its own, so there's deliberately no "next
// milestone" text once maxed).
function nextProgressionMilestone(level,maxLevel){
  const ms=progressionMilestones(maxLevel);
  for(let i=0;i<ms.length;i++)if(ms[i]>level)return ms[i];
  return null;
}
// Whether `level` itself lands exactly on one of this line's own
// milestones (section 10's "if the player reaches 45/60, show MILESTONE
// 45" case) -- distinct from nextProgressionMilestone(), which only ever
// looks forward.
function isProgressionMilestone(level,maxLevel){
  return progressionMilestones(maxLevel).indexOf(level)>=0;

// One shared line, used identically by all three upgrade card functions
// below (Coin Value, Capacity, the four per-jar stats) -- "consistency is
// more important than redesigning each stat differently" (E3 section 13).
// Drawn only while NOT maxed (the max-level state already communicates
// completion; showing "next milestone" alongside it would be redundant/
// contradictory). `y` is the text's own baseline (alphabetic).
function drawProgressionMilestoneLine(x,y,level,maxLevel){
  if(isProgressionMilestone(level,maxLevel)){
    ctx.fillStyle=WS_GOLD_BRIGHT; ctx.font='italic 11px Georgia,serif'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText('✦ Milestone reached · Level '+level,x,y);
    return;
  }
  const next=nextProgressionMilestone(level,maxLevel);
  if(next===null)return; // no milestone left to name (shouldn't happen while not maxed, but defensive)
  ctx.fillStyle='rgba(174,184,203,0.65)'; ctx.font='italic 11px Georgia,serif'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('Next milestone · Level '+next,x,y);
}

// catalogs: SHOP_ITEMS' two plain one-shot decor items (deco/fountain --
// the Statue is excluded: it's locked behind restorationPct, carries its
// own owned/equipped distinction, and reads as a late-game landmark, not a
// casual daily discount) and TRAIL_COLORS' five real purchasable trails
// ('none' excluded, price 0, nothing to discount). JARS are deliberately
// NOT included -- jar skins above a price floor carry a real +1 capacity
// bonus while equipped (see the Shop Restructure phase), so discounting
// jar prices would be a backdoor economy change, not a pure cosmetic
// coin sink; decor+trails are the only candidates with zero gameplay stat
// attached to their price.
const DAILY_DEAL_CANDIDATES=[
  {kind:'decor', key:'deco'},
  {kind:'decor', key:'fountain'},
  {kind:'trail', key:'gold'},
  {kind:'trail', key:'violet'},
  {kind:'trail', key:'moonlit'},
  {kind:'trail', key:'starlight'},
  {kind:'trail', key:'celestial'}

// today's calendar day, device-local -- reuses the EXACT existing
// localDayKey() the daily-quest boundary already established above,
// per direct instruction to use existing local-date conventions rather
// than a new one. Read fresh every call (not cached), same as
// localDayKey(lastPlayed) elsewhere, so it always reflects the CURRENT
// local day the Shop is actually open in, not the day the session began.
function todayKey(){ return localDayKey(Date.now()); }
// A small deterministic string hash (not cryptographic, doesn't need to
// be) -- turns a day key like "2026-7-28" into a stable index, so "same
// day -> same offer" holds without needing Math.random() or any seeded
// RNG state. Same "deterministic day seed" approach direct instruction
// explicitly allows.
function simpleDayHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=((h<<5)-h+str.charCodeAt(i))|0; } return Math.abs(h); }
function dailyDealCandidateInfo(c){
  if(!c)return null;
  if(c.kind==='decor'){
    const item=SHOP_ITEMS[c.key];
    if(!item)return null;
    return {name:item.name, price:item.price, owned:shopItemOwned(item)};
  }
  if(c.kind==='trail'){
    const t=TRAIL_COLORS.find(t=>t.key===c.key);
    if(!t)return null;
    return {name:t.name, price:t.price, owned:!!upgrades.ownedTrails[c.key]};
  }
  return null;
}
// Walks the FIXED candidate list starting at today's hashed index, wrapping
// around, and returns the first one the player doesn't already own -- pure
// function of (today, current ownership), never persisted state, so it's
// only ever called at the moment a NEW day's offer needs picking (see
// ensureDailyDeal() below), not every time the offer is read. Returns null
// if every single candidate is already owned -- "no eligible items -> no
// fake offer", handled by the caller.
function pickDailyDealCandidate(){
  const day=todayKey();
  const startIdx=simpleDayHash(day)%DAILY_DEAL_CANDIDATES.length;
  for(let i=0;i<DAILY_DEAL_CANDIDATES.length;i++){
    const c=DAILY_DEAL_CANDIDATES[(startIdx+i)%DAILY_DEAL_CANDIDATES.length];
    const info=dailyDealCandidateInfo(c);
    if(info&&!info.owned)return c;
  }

// The one canonical function that decides today's offer -- read by draw

// Persists {day,kind,key} in upgrades.dailyDeal ONLY when the calendar day
// actually changes -- picking is deliberately NOT re-run on every access,
// specifically so that buying today's offered item doesn't cause it to
// silently swap to a different item for the rest of the same day (it
// would, if re-picked live, since the just-bought item would now read as
// owned and pickDailyDealCandidate() would walk past it). Once an item is
// selected for a day it stays that day's Daily Deal, shown as claimed
// (not swapped) after purchase -- existing ownership is still the ONLY

function ensureDailyDeal(){
  const day=todayKey();
  if(!upgrades.dailyDeal||upgrades.dailyDeal.day!==day){
    const picked=pickDailyDealCandidate();
    upgrades.dailyDeal={day:day, kind:picked?picked.kind:null, key:picked?picked.key:null};
    persistUpgradesLocal(); // local fallback only, same as rollQuests()/persistQuests() -- the real cloud save still rides the existing saveProgress() triggers, not forced here
  }
  if(!upgrades.dailyDeal.kind)return null; // every candidate was already owned the day this was picked -- gracefully nothing to offer
  return {kind:upgrades.dailyDeal.kind, key:upgrades.dailyDeal.key};
}
// basePrice = existingPrice, discountedPrice = floor(basePrice*0.80), per
// direct instruction -- never a duplicate hardcoded price. Floored at 1 so
// a hypothetical very-low-price future item could never round to 0/free.
function dailyDealPrice(basePrice){ const p=Math.floor(basePrice*0.8); return (isFinite(p)&&p>=1)?p:1; }
function buyDailyDeal(){
  const deal=ensureDailyDeal();
  if(!deal)return false;
  const info=dailyDealCandidateInfo(deal);
  if(!info||info.owned)return false; // already claimed today (or already owned some other way) -- no double purchase, no re-grant
  const discounted=dailyDealPrice(info.price);
  if(coins<discounted)return false;
  // Reuse the EXISTING purchase function for this item type byte-for-byte
  // -- never a second grant/ownership code path -- by temporarily pointing
  // the SAME price field it already reads at the discounted amount, then
  // restoring it immediately after. Synchronous, single-threaded, no ad
  // involved -- there is no window for anything else to observe (or get
  // stuck with) the temporarily-discounted price.
  let ok=false;
  if(deal.kind==='decor'){
    const item=SHOP_ITEMS[deal.key], realPrice=item.price;
    item.price=discounted;
    try{ ok=tryPurchase(deal.key); } finally { item.price=realPrice; }
  } else if(deal.kind==='trail'){
    const t=TRAIL_COLORS.find(t=>t.key===deal.key), realPrice=t.price;
    t.price=discounted;
    try{ ok=tryBuyOrEquipTrail(deal.key); } finally { t.price=realPrice; }
  }
  return ok;
}
