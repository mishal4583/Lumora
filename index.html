const W=540, H=960;
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false}); // canvas is always fully opaque; skip alpha compositing for cheaper mobile rasterization
let scale=1, dpr=Math.min(window.devicePixelRatio||1,2);
let lastVW=0, lastVH=0; // last viewport size we actually sized for — lets the render loop notice changes even when a 'resize' event never fires (e.g. some fullscreen enter/exit paths)
// Zero-viewport init fix: YouTube's own Playables docs document that the
// game may initially load inside a hidden WebView whose viewport starts at
// 0x0, and game code MUST initialize/render regardless. The old
// scale=Math.min(vw/W,vh/H) went straight to 0 whenever vw/vh were 0,
// zeroing cv.width/cv.height and making ctx.setTransform degenerate (a
// 0-scale matrix) -- draw() kept being called every frame, but painted
// nothing into a zero-area buffer, and firstFrameReady()/gameReady() (both
// gated on cv.width>0 in loop(), intentionally, so they never fire before a
// real frame exists) then had no real frame to ever detect, so they never
// fired at all. That's the exact loading-spinner symptom: the Test Suite
// waits on gameReady(), which was permanently blocked. It's also exactly
// why entering fullscreen "fixed" it -- fullscreen forces the host to
// finally give the page a real, non-zero viewport, which drove vw/vh
// non-zero, which let this same function compute a real scale for the
// first time, which finally made cv.width>0 true on the very next frame.
// Fix: fall back to scale=1 (the virtual resolution's own 1:1 pixel size)
// whenever the real viewport isn't available yet, so the canvas's INTERNAL
// drawing resolution (cv.width/cv.height) and the transform are always
// valid and non-zero from the very first call -- draw() actually paints a
// real frame immediately, independent of any external viewport event, and
// firstFrameReady()/gameReady() can fire on their normal schedule. This is
// a presentation-layer fallback only: the virtual resolution (W/H=540/960)
// and every gameplay coordinate are completely unchanged. Once a real
// viewport does arrive, this same function (already re-invoked by loop()'s
// per-frame poll below on any innerWidth/innerHeight change) recomputes the
// real scale/letterboxing exactly as before -- this just stops "no real
// viewport yet" from meaning "never initialize."
function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  lastVW=vw; lastVH=vh;
  scale=(vw>0&&vh>0)?Math.min(vw/W, vh/H):1;
  cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px';
  cv.width=Math.round(W*scale*dpr); cv.height=Math.round(H*scale*dpr);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
window.addEventListener('resize',resize); resize();

// ---------- glow sprites ----------
const glowCache={};
function glowSprite(color,r){
  r=Math.max(1,Math.round(r)); // quantize so pulsing radii (sin-driven) hit the cache instead of allocating a new canvas every frame
  const key=color+'|'+r;
  if(glowCache[key])return glowCache[key];
  const s=document.createElement('canvas'); s.width=s.height=Math.ceil(r*2);
  const g=s.getContext('2d');
  const gr=g.createRadialGradient(r,r,0,r,r,r);
  gr.addColorStop(0,color); gr.addColorStop(0.35,color.replace('1)','0.45)')); gr.addColorStop(1,color.replace('1)','0)'));
  g.fillStyle=gr; g.fillRect(0,0,r*2,r*2);
  glowCache[key]=s; return s;
}

const WIND_CUTOFF_BY_TIER=[420,380,300,260,340,400];
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=audioEnabled?0.6:0; master.connect(AC.destination);
    const len=AC.sampleRate*3, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=WIND_CUTOFF_BY_TIER[heartTier(best)-1];
    windLP=lp;
    const ag=AC.createGain(); ag.gain.value=0.05;
    const lfo=AC.createOscillator(), lg=AC.createGain();
    lfo.frequency.value=0.07; lg.gain.value=0.025;
    lfo.connect(lg); lg.connect(ag.gain);
    src.connect(lp); lp.connect(ag); ag.connect(master);
    src.start(); lfo.start();
    humOsc=AC.createOscillator(); humGain=AC.createGain();
    humOsc.type='sine'; humOsc.frequency.value=220; humGain.gain.value=0.0001;
    const h2=AC.createOscillator(); h2.type='sine'; h2.frequency.value=331;
    const h2g=AC.createGain(); h2g.gain.value=0.4;
    h2.connect(h2g); h2g.connect(humGain); humOsc.connect(humGain); humGain.connect(master);
    humOsc.start(); h2.start();
  }catch(e){ AC=null; }
}
function tone(freq,dur,vol,type,when,glideTo){
  if(!AC)return;
  const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}

// One derived value drives all three systems below — the Heart's own visual
// state, the seasonal palette, and the environmental-detail props — so they
// can never drift out of sync with each other. It's computed fresh from
// `best` (the same all-time score already persisted via saveData/loadData
// for sendScore) wherever it's needed; nothing caches or re-derives it
// independently. Tier 6 (Luminary) is the ceiling — scores past 25 don't
// invent a 7th tier, matching the plan's tier table.
const HEART_TIER_THRESH=[0,5,10,15,20,25]; // minimum bestScore to REACH tier (index+1)
function heartTier(scoreVal){
  let t=1;
  for(let i=1;i<HEART_TIER_THRESH.length;i++){ if(scoreVal>=HEART_TIER_THRESH[i])t=i+1; }
  return t;
}

// two thresholds that already exist elsewhere in the codebase (25 = Luminary,
// 35 = the Lumora Bloom milestone) — no new number invented, no new save field.
function heartBloomProgress(scoreVal){ return clamp((scoreVal-25)/10,0,1); }

function treeline(g,baseY,amp,color,seed){
  g.fillStyle=color; g.beginPath(); g.moveTo(0,H); g.lineTo(0,baseY);
  let x=0;

    const w=30+((Math.sin(seed+x*0.7)+1)*22);
    const h=amp*(0.55+0.45*Math.sin(seed*3+x*0.13));

function house(g,x,y,w,h,roofH,color){

  g.quadraticCurveTo(x+w*0.5,y-h-roofH,x+w*0.88,y-h-roofH*0.45);
  g.quadraticCurveTo(x+w,y-h-roofH*0.35,x+w,y-h);

// vegetation layer below -- reused per spot rather than one-off inline
// shapes, same "one small helper, called from renderBG only" discipline as
// house()/treeline() above it. Purely a dark flat silhouette so it can never
// read as a light source or compete with fireflies/decor.
function bush(g,x,y,scale,color){
  g.fillStyle=color;

// untouched and still used below for smooth forest-canopy fills, where a
// soft wavy edge reads better than jagged peaks.
function ridgeline(g,baseY,amp,color,seed){
  g.fillStyle=color; g.beginPath(); g.moveTo(0,H); g.lineTo(0,baseY);

    const w=44+((Math.sin(seed+i*1.7)+1)*32);

function forestTree(g,x,y,scale,color,pine){

// nothing else ever read this constant.

function jarStatMax(statKey,jarObj){ return jarObj[statKey+'Max']; }

// formula-based now (was a fixed-length prices array) -- correctly scales
// to however many tiers THIS jar actually has for THIS stat, same reason
// Capacity's cost curve was always a formula, never an array. Aurora
// Endgame Jar pass: JAR_COST_MULTIPLIER applied last, same as Capacity's
// own cost curve above -- every per-jar stat line prices Aurora's tiers
// higher than Simple's at the same tier index, not just longer overall.

// step above are identical to the old shared values — see JARS note),
// capped by however many tiers the equipped jar's own range supports.

// Depth Pass Part 1 retune: maxFlies/patience/speed/mothRate used to sit
// FLAT for the entire s<10 stretch, then jump at 10, then sit flat again
// until 20 -- three plateaus, hard jumps at the boundaries, and ZERO ramp
// at all below score 10. That flat opening decade is what "easy from the
// first minute" actually was, not a slow ramp -- there wasn't a ramp yet.
// Stage 0's deliberate ~5-second gentle hook is untouched: every s=0 value
// below is byte-identical to before (maxFlies 3, patience 12-14, speed
// 16-26, no moths). Only how soon the game climbs AWAY from that hook
// changed -- tier boundaries compressed 10->5 and 20->13, so the old
// "score 10" difficulty now arrives by score 5, and the old "score 20"
// (hardest, was previously a further 10 points away) arrives by score 13 --
// both comfortably inside a typical first minute instead of well past it.
// blue/shy TYPE unlocks (s>=10/s>=15, per the firefly reference table) and
// magRate (a player-favoring bonus pickup, not a challenge axis) are left
// exactly as they were -- content pacing and player aid timing aren't what
// this pass targets, density/patience/speed is.
// The hard-tier boundary specifically landed on 13, not 12: the Elder
// firefly's own unlock gate is S.score>=12 (see the elder-timer block
// below), and an initial 12 here would have made the hardest settings
// (maxFlies 6, patience 9-11, mothRate 6-9) kick in on the EXACT score
// Elder first becomes catchable -- coupling the rarest, highest-value
// firefly's first opportunity to the worst odds of landing it. That
// coupling was accidental (12/20 were picked as round compressed numbers,
// without cross-checking the Elder gate), not desired, so the boundary was
// moved one point to keep Elder's unlock inside the medium tier, same as
// it was under the old curve (where s=12 sat mid-way through a 10-20
// medium tier, nowhere near the hardest settings).
function diff(){
  const s=S.score+S.carried.reduce((a,c)=>a+TYPES[c.type].pts,0);
  return {
    maxFlies: s<5?3 : s<13?4 : 6,
    patience: s<5?rand(12,14) : s<13?rand(10,12) : rand(9,11),
    speed:    s<5?rand(16,26) : rand(22,36),
    blue:     s>=10, shy: s>=15,
    mothRate: s<5?0 : s<13?rand(9,13) : rand(6,9),
    magRate:  s<8?0 : s<20?rand(15,20) : rand(10,14)
  };
}

function spawnFly(forceType){
  if(screen!=='play')return;
  const d=diff();
  const side=Math.random()<0.5?-1:1;
  let type='y';
  if(forceType)type=forceType;
  else{
    const r=Math.random();
    // widths (not absolute thresholds) so boosting shy's window can never
    // silently shrink blue's, or vice versa — each stays independently sized,
    // still fully gated behind the SAME d.shy/d.blue unlock booleans as before.
    // Weather only ever scales a width that's already nonzero; a locked-out
    // type's width stays exactly 0 regardless of weather.
    const shyW=d.shy?(S.weather==='nightRain'?0.30:S.weather==='aurora'?0.22:0.16):0;
    const blueW=d.blue?(S.weather==='shootingStars'?0.30:0.26):0;
    if(r<shyW)type='g';
    else if(r<shyW+blueW)type='b';
  }
  if(type==='g'&&!S.seenShy){ S.seenShy=true; S.shyHint=4.5; }
  if(type==='e'){ S.capMsg='an elder firefly…'; S.capMsgT=3; }
  if(type==='m'){ S.capMsg='something rare glimmers…'; S.capMsgT=3; }
  S.flies.push({
    x: side<0? -20 : W+20, y: rand(H*0.16,H*0.6),
    ang: side<0? rand(-0.4,0.4) : Math.PI+rand(-0.4,0.4),
    spd: d.speed*(type==='b'?1.2:type==='g'?0.9:type==='e'?0.45:type==='m'?0.7:1),
    type, patience:d.patience, maxP:d.patience,
    state:'drift', lockT:0, orbitT:0, wob:rand(0,6.28), wobF:rand(0.8,1.6),
    pause:0, alpha:0, flick:rand(0,6.28), scatter:0, rest:0, animT:0, animA:0, animR:0
  });
}

function puff(x,y,color,n,spd,life){
  for(let i=0;i<n;i++){

// Trail System Redesign: an explicit safety ceiling on ACTIVE particles
// before spawning any more trail particles -- S.parts is shared with every
// other particle source in the file (catch streaks, fountain droplets,
// delivery sparks' own trailing bits, puff() bursts, Aurora's ambient
// sparkle), so this only throttles NEW trail spawns once the shared array
// is already busy; it never removes anything else's particles.
const TRAIL_PARTICLE_CAP=140;
// Layered, movement-scaled trail: 4 particle layers (soft glow / medium /
// spark / tiny highlight), each with its own size/peak-alpha/life/drift, so
// the trail reads as a natural drifting cluster rather than one thick
// colored line. Emission rate and lifetime both scale with S.jar.spd
// (faster jar -> more particles + a slightly longer-lived, so visually
// longer, trail) -- below a "basically stationary" speed floor nothing new
// spawns at all, so already-emitted particles simply fade out (see the
// shared decay loop in update()) instead of a trail persisting behind a
// parked jar. Aurora Trail is picked up automatically via activeTrailHues()
// -- no separate Aurora-specific branch needed here.
function spawnTrailParticles(dt){
  const hues=activeTrailHues();
  if(!hues||hues.length===0)return;
  const spd=S.jar.spd;
  if(spd<14||S.parts.length>=TRAIL_PARTICLE_CAP)return;
  const intensity=clamp((spd-14)/140,0,1);
  // cycles through the trail's own palette over time (not per-particle
  // random) so a multi-hue trail (Moonlit/Starlight/Celestial/Aurora) reads
  // as a coherent slow gradient shift, not confetti.
  const hue=hues[Math.floor(S.t*1.6)%hues.length];
  const bx=S.jar.x, by=S.jar.y-10;
  if(Math.random()<dt*(3+intensity*9))S.parts.push({x:bx+rand(-5,5),y:by+rand(-5,5),vx:rand(-3,3),vy:rand(-3,3),life:0.5+intensity*0.3,maxL:0.5+intensity*0.3,color:hue,r:rand(3.5,5),a:0.35});
  if(Math.random()<dt*(5+intensity*14))S.parts.push({x:bx+rand(-6,6),y:by+rand(-6,6),vx:rand(-4,4),vy:rand(-4,4),life:0.35+intensity*0.25,maxL:0.35+intensity*0.25,color:hue,r:rand(2,3),a:0.6});
  if(Math.random()<dt*(6+intensity*16))S.parts.push({x:bx+rand(-7,7),y:by+rand(-7,7),vx:rand(-5,5),vy:rand(-5,5),life:0.22+intensity*0.15,maxL:0.22+intensity*0.15,color:hue,r:rand(1,1.8),a:0.85});
  if(Math.random()<dt*(1+intensity*3))S.parts.push({x:bx+rand(-6,6),y:by+rand(-6,6),vx:rand(-3,3),vy:rand(-3,3),life:0.18+intensity*0.12,maxL:0.18+intensity*0.12,color:'rgba(255,250,240,1)',r:rand(1,1.4),a:0.9});
}

        S.villageGlowTarget=1; playBells(); capMilestoneFx('the Lumora Bloom begins!');

        S.finaleActive=true; S.finaleT=0;

      }

    }

}

// virtual-space radius that always covers a real 24px (half of 48dp) reach,
// regardless of device/viewport. Hit-test-only -- the drawn circle (btn.r)

// visible icon" example. Only applied to the small corner buttons that were

function itemsForVendor(v){ return Object.keys(SHOP_ITEMS).filter(k=>SHOP_ITEMS[k].vendor===v).map(k=>Object.assign({key:k},SHOP_ITEMS[k])); }

cv.addEventListener('pointerdown',e=>{

    return;

    // Enter/Space is deliberately inert while a confirm modal is open — no
    // keyboard shortcut should be able to trigger Restart/Go Home's
    // destructive action, only an explicit tap/click on CONFIRM_ACTION_BTN.
    if((e.key==='Enter'||e.key===' '||e.key==='Spacebar')&&pauseReason==='user'&&!pauseConfirm){ resumeGame(); e.preventDefault(); }
    return;
  }
  if(showWelcomeBack){ // same swallow-all-input guard as pointerdown above
    if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){ showWelcomeBack=false; e.preventDefault(); }
    return;
  }
  if(tutorialPanelOpen){ // same swallow-all-input guard as pointerdown above -- only Got It has a keyboard equivalent, matching every other modal's "no shortcut for the secondary/destructive action" precedent
    if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){ tutorialAdvance(); e.preventDefault(); }
    return;
  }
  if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){
    initAudio(); if(AC&&audioEnabled&&AC.state==='suspended')AC.resume();
    if(screen==='title'){ beginPlay(); }
    else if(S&&S.over&&S.overT>0.35){ reset(); }
    e.preventDefault(); return;
  }
  const dir=keyDir(e.key);
  if(dir){
    initAudio(); if(AC&&audioEnabled&&AC.state==='suspended')AC.resume();
    KEYS[dir]=1; e.preventDefault();
  }
});
window.addEventListener('keyup',e=>{ const dir=keyDir(e.key); if(dir)KEYS[dir]=0; });

// ---------- update ----------
function update(dt){
  S.t+=dt;
  sessionT+=dt; // long-session pacing: keeps advancing across reset(), not persisted, resets on reload
  if(luckBoostT>0)luckBoostT-=dt; // session-level like sessionT — a quest reward earned late in a round carries into the next one, not wasted by reset()
  // Village Heart / season / detail tier: re-render the (otherwise-static) bg
  // canvas only when the derived tier actually changes, not every frame —
  // heartTier(best) is the one source of truth every other Stage 1 visual reads
  const curHeartTier=heartTier(best);
  if(curHeartTier!==lastHeartTier){
    lastHeartTier=curHeartTier;
    bgPrev.getContext('2d').drawImage(bg,0,0); // snapshot the outgoing look before overwriting bg, so it can be crossfaded FROM
    renderBG(curHeartTier);
    bgFadeT=0; // start the dissolve -- covers both "tier changed mid-session" and "the very first real tier just arrived after loadData resolved"
    if(AC&&windLP)windLP.frequency.setTargetAtTime(WIND_CUTOFF_BY_TIER[curHeartTier-1],AC.currentTime,2);
  }
  if(bgFadeT>=0){ bgFadeT+=dt; if(bgFadeT>=BG_FADE_DUR)bgFadeT=-1; }
  // continuously eases toward the true tier rather than snapping to it -- this is what
  // keeps the Heart, environmental detail, and moon tint from popping independently
  heartDisplayTier+=(curHeartTier-heartDisplayTier)*Math.min(1,dt*1.1);
  if(Math.abs(curHeartTier-heartDisplayTier)<0.01)heartDisplayTier=curHeartTier;
  // same continuous-ease pattern, same rate, for the Luminary sub-progress —
  // this is what keeps a mid-session 25->35 push from popping at the new boundary
  const bloomTarget=heartBloomProgress(best);
  heartBloomDisplay+=(bloomTarget-heartBloomDisplay)*Math.min(1,dt*1.1);
  if(Math.abs(bloomTarget-heartBloomDisplay)<0.002)heartBloomDisplay=bloomTarget;
  if(S.hitch>0){ S.hitch-=dt; return; }
  if(S.milestoneFlash>0)S.milestoneFlash=Math.max(0,S.milestoneFlash-dt*1.2);
  if(S.mothFlash>0)S.mothFlash=Math.max(0,S.mothFlash-dt);
  if(S.mothHint>0)S.mothHint=Math.max(0,S.mothHint-dt);
  if(S.shyHint>0)S.shyHint=Math.max(0,S.shyHint-dt);
  if(S.bloomBanner>0)S.bloomBanner=Math.max(0,S.bloomBanner-dt);
  if(S.capMsgT>0)S.capMsgT=Math.max(0,S.capMsgT-dt);
  if(S.deliverExplainT>0)S.deliverExplainT=Math.max(0,S.deliverExplainT-dt);
  if(S.missHintT>0)S.missHintT=Math.max(0,S.missHintT-dt);
  if(S.villageGlowTarget)S.villageGlow=Math.min(1,S.villageGlow+dt*0.5);
  // sky evolution (the universe celebrates after 35)
  // House Quality + Celestial pass follow-up: 50->15, per direct feedback --
  // the difficulty curve makes 50 genuinely hard to reach before a round
  // ends (5 misses), so most players never saw this at all. Purely a
  // visual-timing constant, not a gameplay value -- doesn't touch spawn
  // rate/difficulty/scoring, only when this decorative effect starts.
  if(S.score>=15){ S.shootT-=dt; if(S.shootT<=0){ S.shots.push({x:rand(60,W-60),y:rand(40,H*0.3),vx:rand(-260,-160),vy:rand(70,130),life:0.9}); S.shootT=rand(5,11); } }
  for(let i=S.shots.length-1;i>=0;i--){ const s=S.shots[i]; s.life-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; if(s.life<=0)S.shots.splice(i,1); }
  // aurora priority chain — score>=75 wins OUTRIGHT and unconditionally, ahead
  // of both the finale preview and any weather roll, so a genuine unlock can
  // never be cheapened by chance (confirmed ordering, Stage 3 kickoff).
  // 1) permanent slow unlock at score>=75 (unchanged)
  // 2) fast preview ramp borrowed for the Lumora Bloom window at 35 (unchanged)
  // 3) NEW: weather-triggered ramp — a rate between the two above, since this
  //    is meant to read as a genuine (if occasional) sky event, not a flicker
  // 4) decay back to 0 otherwise (unchanged)
  if(S.score>=75)S.aurora=Math.min(1,S.aurora+dt*0.2);
  else if(S.finaleActive)S.aurora=Math.min(1,S.aurora+dt*1.0);
  else if(S.weather==='aurora')S.aurora=Math.min(1,S.aurora+dt*0.4);
  else if(S.aurora>0)S.aurora=Math.max(0,S.aurora-dt*0.3);
  // weather state machine: clear <-> one of five types, round-scoped only (S.weather/
  // S.weatherT), no persistence — matching spawning's own existing round-scoped nature.
  // Affects only the type-roll widths/timers below; diff() itself is untouched, so the
  // score-driven difficulty curve stays exactly as hard, same precedent as Part C's upgrades.
  S.weatherT-=dt;
  if(S.weatherT<=0){
    if(S.weather==='clear'){
      S.weather=WEATHER_TYPES[Math.floor(rand(0,WEATHER_TYPES.length))];
      S.weatherT=rand(12,20); // active duration
      // own message slot, not S.capMsg — that's already used for elder-spawn/
      // milestone-gift text and a weather roll landing on the same frame as
      // one of those would otherwise silently clobber whichever fired second
      S.weatherBannerT=3.5; S.weatherMsg=WEATHER_INFO[S.weather].msg;
    } else {
      S.weather='clear';
      S.weatherT=rand(18,30); // cooldown before the next roll
    }
  }
  if(S.weatherBannerT>0)S.weatherBannerT=Math.max(0,S.weatherBannerT-dt);
  if(S.score>=30)S.constA=Math.min(1,S.constA+dt*0.15); // 100->30, same reasoning as the shooting-star threshold above
  LIGHTS.forEach((L,i)=>{ if(S.score>=L.thr)S.lightAnim[i]=Math.min(1,S.lightAnim[i]+dt*1.5); });
  // milestone "awaken" fades — cat/windmill used to pop in instantly at their
  // score gate; fade them in over ~0.8s instead so the milestone reads as a
  // brief transition, matching how the village lights already fade in above
  if(S.score>=20)S.catA=Math.min(1,S.catA+dt*1.25);
  if(S.score>=25)S.millA=Math.min(1,S.millA+dt*1.25);
  // Lumora Bloom sequence timer — a golden firefly-ribbon rises for the first
  // ~2.2s of the window; the whole window self-deactivates after ~3.4s
  if(S.finaleActive){
    S.finaleT+=dt;
    if(S.finaleT<2.2&&Math.random()<dt*30){
      S.parts.push({x:W/2+rand(-70,70),y:H-140,vx:rand(-10,10),vy:-rand(90,140),life:1.6,maxL:1.6,color:GLOW_Y,r:rand(2,4)});
    }
    if(S.finaleT>3.4)S.finaleActive=false;
  }

  // ambient + music scheduling
  if(AC){
    S.cricketT-=dt; if(S.cricketT<=0){ sCricket(); S.cricketT=rand(0.6,2.4); }
    S.owlT-=dt; if(S.owlT<=0){ sOwl(); S.owlT=rand(14,30); }
    if(S.score>=15){ S.arpT-=dt; if(S.arpT<=0){ playArp(); S.arpT=2; } }
    if(S.score>=25){ S.bassT-=dt; if(S.bassT<=0){ playBass(); S.bassT=4; } }
    if(S.score>=35){ S.bellT-=dt; if(S.bellT<=0){ playBells(); S.bellT=7; } }
  }
  // ambient bats (detail, not hazard)
  S.batT-=dt;
  if(S.batT<=0){ const s=Math.random()<0.5?-1:1; S.bats.push({x:s<0?-20:W+20,y:rand(60,H*0.3),vx:(s<0?1:-1)*rand(60,90),flap:rand(0,6)}); S.batT=rand(14,28); }
  for(let i=S.bats.length-1;i>=0;i--){ const b=S.bats[i]; b.x+=b.vx*dt; b.y+=Math.sin(b.flap+=dt*9)*12*dt; if(b.x<-30||b.x>W+30)S.bats.splice(i,1); }
  // chimney smoke (>=15)
  if(S.score>=15){
    if(Math.random()<dt*2.2)S.smoke.push({x:401+rand(-2,2),y:H-215,vy:-rand(9,14),vx:rand(-2,4),life:rand(3,4.5),maxL:4.5,r:rand(3,5)});
  }
  for(let i=S.smoke.length-1;i>=0;i--){ const p=S.smoke[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=dt*2.2; if(p.life<=0)S.smoke.splice(i,1); }
  // Village Fountain idle droplets — purchase-gated, not score-gated. Lives in
  // update() (state) rather than drawFountain() (render-only), unlike the one
  // pre-existing draw-time particle spawn already flagged as a Stage 0 quirk.
  if(upgrades.fountain&&Math.random()<dt*3)S.parts.push({x:FOUNTAIN_X+rand(-6,6),y:FOUNTAIN_Y-4,vx:rand(-3,3),vy:-rand(8,14),life:0.5,maxL:0.5,color:'rgba(180,220,245,1)',r:1.2});
  // windmill (>=25)
  if(S.score>=25)S.mill+=dt*0.9;
  // festival fireworks + lantern balloons (>=35)
  if(S.score>=35&&!S.over){
    S.fwT-=dt;
    if(S.fwT<=0){
      const fx=rand(60,W-60), fy=rand(H*0.14,H*0.34), hue=Math.random()<0.5?GLOW_Y:GLOW_P;
      for(let i=0;i<22;i++){ const a=rand(0,6.28), v=rand(30,95); S.fireworks.push({x:fx,y:fy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(0.8,1.4),maxL:1.4,color:hue}); }
      sFirework(); S.fwT=rand(2.5,4.5);
    }
    S.balT-=dt;
    if(S.balT<=0){ S.balloons.push({x:rand(40,W-40),y:H-120,vy:-rand(11,17),sw:rand(0,6.28),life:14}); S.balT=rand(3,6); }
  }
  for(let i=S.fireworks.length-1;i>=0;i--){ const p=S.fireworks[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=26*dt; p.vx*=0.985; if(p.life<=0)S.fireworks.splice(i,1); }
  for(let i=S.balloons.length-1;i>=0;i--){ const b=S.balloons[i]; b.life-=dt; b.y+=b.vy*dt; b.x+=Math.sin(b.sw+=dt*0.8)*8*dt; if(b.life<=0||b.y<-30)S.balloons.splice(i,1); }

  if(S.over){ S.overT+=dt; return; }

  const d=diff();
  // keyboard jar movement (SHOULD: directional input) — nudges the same target the pointer drags
  if(screen==='play'&&(KEYS.up||KEYS.down||KEYS.left||KEYS.right)){
    const kspd=320, kx=(KEYS.right?1:0)-(KEYS.left?1:0), ky=(KEYS.down?1:0)-(KEYS.up?1:0);
    S.jar.tx=clamp(S.jar.tx+kx*kspd*dt,30,W-30);
    S.jar.ty=clamp(S.jar.ty+ky*kspd*dt,H*0.13,H-170);
  }
  // jar motion + speed tracking (for shy fireflies)
  S.jar.px=S.jar.x; S.jar.py=S.jar.y;
  S.jar.x=lerp(S.jar.x,S.jar.tx,1-Math.pow(0.0008,dt));
  S.jar.y=lerp(S.jar.y,S.jar.ty,1-Math.pow(0.002,dt));
  S.jar.spd=dist(S.jar.px,S.jar.py,S.jar.x,S.jar.y)/Math.max(dt,0.001);
  // Trail System Redesign: layered, movement-scaled emission -- see
  // spawnTrailParticles() below. Still reuses S.parts, same as the
  // fountain's droplets and every other ambient particle system here -- no
  // new rendering pipeline, just a richer emission shape.
  spawnTrailParticles(dt);
  // Aurora Endgame Jar pass, item 2: a faint ambient "celestial" sparkle
  // drifts near the jar whenever Aurora is equipped, independent of
  // movement -- a separate decoration from the trail-color cosmetic above
  // (jar identity, not an owned/equipped trail), reusing the same S.parts
  // system. Purely visual, gated on jar identity only.
  if(currentJar().aurora&&Math.random()<dt*3)S.parts.push({x:S.jar.x+rand(-22,22),y:S.jar.y-14+rand(-20,14),vx:rand(-3,3),vy:-rand(4,10),life:0.9,maxL:0.9,color:auroraShimmerColor(1),r:rand(1,2)});
  S.jar.pulse=Math.max(0,S.jar.pulse-dt*2.4);
  S.jar.wob+=dt;
  if(S.magnetT>0)S.magnetT-=dt;
  if(S.lockCd>0)S.lockCd-=dt;
  if(AC&&humGain){
    const fillv=clamp(S.carried.length/S.cap,0,1.4);
    humGain.gain.setTargetAtTime(fillv*0.011*(S.carried.length>S.cap?1.8:1),AC.currentTime,0.4);
    humOsc.frequency.setTargetAtTime(200+fillv*70,AC.currentTime,0.6);
  }
  if(hintStage>0)S.hintFade=Math.max(0,S.hintFade-dt*1.5);

  // spawns
  const active=S.flies.filter(f=>f.state==='drift'||f.state==='locked').length;
  S.spawnT-=dt;
  // Firefly Festival: "huge Curious population" — curious has no roll condition of
  // its own (it's just whatever's left after shy/blue don't trigger), so festival
  // is expressed as more fireflies on screen at once + a faster cadence, rather
  // than touching the type-roll. diff().maxFlies itself (score-driven) is untouched.
  const festivalCapBoost=S.weather==='festival'?3:0;
  if(S.spawnT<=0&&active<d.maxFlies+festivalCapBoost){
    spawnFly();
    S.spawnT=S.weather==='festival'?rand(0.3,0.6):rand(0.7,1.5);
  }
  if(d.mothRate>0){ S.mothT-=dt; if(S.mothT<=0){ spawnMoth(); S.mothT=d.mothRate; } }
  if(d.magRate>0&&!S.magnet){ S.magT-=dt; if(S.magT<=0){ spawnMagnet(); S.magT=d.magRate; } }
  // elder firefly: rare, only after the game has opened up. Clear Moon, Aurora's
  // milder "rare combinations", and a completed "Catch 2 Elder" quest's luck
  // boost all speed up this SAME timer's countdown (capped via Math.max, not
  // multiplied together, so overlapping boosts stay bounded) -- the S.score>=12
  // gate above is completely untouched, so none of them can make an Elder
  // appear before its normal unlock, only more often once that's already true.
  // Remove In-Run Capacity Growth (final): the old "&&S.cap<JAR_MAX" half of
  // this gate existed only to stop spawning Elders once gainCap() couldn't
  // grow capacity any further -- now that Elder catches never touch capacity
  // at all, that rationale is gone. Removing it also fixes a real bug this
  // change would otherwise have introduced: with purchased Capacity able to
  // reach/exceed JAR_MAX (see Glassblower's extended tiers), that old clause
  // would have permanently blocked Elder from ever spawning again for any
  // well-upgraded player.
  if(S.score>=12){
    const elderRateMult=Math.max(S.weather==='clearMoon'?2.2:1, S.weather==='aurora'?1.4:1, luckBoostT>0?2.2:1);
    S.elderT-=dt*elderRateMult;
    if(S.elderT<=0&&!S.flies.some(f=>f.type==='e')){ spawnFly('e'); S.elderT=rand(35,55); }
  }
  // Mystery Firefly: single rare high-value type, weather-agnostic (Section 6.3
  // is its own subsection, not part of the 6.2 weather-affinity table) — its own
  // score gate (>=20) and dedicated timer, same architecture as Elder above,
  // not folded into the normal type-roll.
  if(S.score>=20){
    S.mysteryT-=dt;
    if(S.mysteryT<=0&&!S.flies.some(f=>f.type==='m')){ spawnFly('m'); S.mysteryT=rand(60,90); }
  }
  // firefly bloom event
  if(S.score+S.carried.length>=8){
    S.bloomT-=dt;
    if(S.bloomT<=0){
      const roundS=S; // guard against a reset() happening mid-flight and reassigning S to a new round
      for(let i=0;i<7;i++)setTimeout(()=>{ if(roundS===S&&!roundS.over)spawnFly('y'); },i*180);
      S.bloomBanner=3; S.bloomT=rand(30,45);
      sMagnet();
    }
  }

  // Base Stats Pass Part 1: passive/buffed base radius cut 130/230 -> 70/170.
  // Lumora UI port: jarReachForRun()/magnetReachForRun() replace the old
  // single magnetRadiusForRun(base) -- passive and buffed reach are now two
  // independently purchasable tiers (see TIER_LINES), not one shared bonus
  // applied to both.
  const radius=S.magnetT>0?magnetReachForRun():jarReachForRun();
  const maxLocks=S.magnetT>0?3:1;
  const jx=S.jar.x, jy=S.jar.y-14;

  // acquire locks
  if(S.lockCd<=0&&jarCanAcceptCatch()){
    let locks=S.flies.filter(f=>f.state==='locked').length;
    while(locks<maxLocks){
      let bestF=null,bd=radius;
      for(const f of S.flies){
        if(f.state!=='drift')continue;
        if(f.type==='g'&&S.jar.spd>120)continue; // shy: only lock when moving gently
        const dd=dist(f.x,f.y,jx,jy);
        if(dd<bd){bd=dd;bestF=f;}
      }
      if(!bestF)break;
      bestF.state='locked'; bestF.lockT=0;
      bestF.orbitT=bestF.type==='b'?1.1:0; // playful circles first
      locks++;
    }
  }

  // moth interrupt
  for(const m of S.moths){
    if(dist(m.x,m.y,jx,jy)<72){
      if(!m.bumped){ m.bumped=true; puff(m.x,m.y,GLOW_M,4,40,0.4); }
      const locked=S.flies.filter(f=>f.state==='locked');
      if(locked.length&&S.lockCd<=0){
        locked.forEach(f=>{
          f.state='drift';
          const a=Math.atan2(f.y-jy,f.x-jx)+rand(-0.5,0.5);
          f.x+=Math.cos(a)*8; f.y+=Math.sin(a)*8;
          f.ang=a; f.scatter=0.6; f.rest=2;
          puff(f.x,f.y,GLOW_M,6,55,0.5);
        });
        sScatter(); S.lockCd=1.2; S.mothFlash=2.2;
        // Immediate cause-and-effect feedback (a real gameplay improvement,
        // not tutorial-gated -- every player benefits, not just new ones):
        // a short (~0.65s) red flash, decoupled from S.mothFlash's own
        // longer-lived banner above so neither one's duration constrains
        // the other. Same trigger, same "actually scared a locked firefly"
        // condition -- not merely brushing past a moth with nothing to
        // scare, per direct instruction not to fire on mere proximity.
        S.mothWarnT=0.65;
      }
    }
  }

  // fireflies
  for(let i=S.flies.length-1;i>=0;i--){
    const f=S.flies[i];
    f.alpha=Math.min(1,f.alpha+dt*2);
    f.flick+=dt*(3+(1-f.patience/f.maxP)*7);
    if(f.type==='e'&&Math.random()<dt*8)S.parts.push({x:f.x,y:f.y,vx:rand(-4,4),vy:rand(-2,6),life:1.1,maxL:1.1,color:GLOW_W,r:1.4});
    if(f.state==='drift'){
      if(f.rest>0)f.rest-=dt; else f.patience-=dt;
      f.wob+=dt*f.wobF;
      // shy flees a fast jar
      if(f.type==='g'&&f.scatter<=0){
        const dd=dist(f.x,f.y,jx,jy);
        if(dd<170&&S.jar.spd>260){
          f.scatter=0.7; f.ang=Math.atan2(f.y-jy,f.x-jx)+rand(-0.4,0.4);
          sShyFlee(); puff(f.x,f.y,GLOW_G,4,40,0.4);
        }
      }
      if(f.pause>0)f.pause-=dt;
      else{
        if(Math.random()<dt*0.12)f.pause=rand(0.4,1.1);
        f.ang+=Math.sin(f.wob)*dt*(f.scatter>0?2.2:0.9);
        const sp=f.spd*(f.scatter>0?2.4:1);
        f.x+=Math.cos(f.ang)*sp*dt;
        f.y+=Math.sin(f.ang)*sp*dt+Math.sin(f.wob*2.3)*10*dt;
      }
      if(f.scatter>0)f.scatter-=dt;
      if(f.x<20)f.ang=rand(-0.6,0.6);
      if(f.x>W-20)f.ang=Math.PI+rand(-0.6,0.6);
      if(f.y<H*0.1)f.ang=rand(0.4,2.7);
      if(f.y>H*0.78)f.ang=-rand(0.4,2.7);
      if(f.patience<=0){
        f.state='leaving'; f.vy=-30;
        S.misses++; sMiss(); puff(f.x,f.y,GLOW_M,5,26,0.9);
        if(!missHintShown){ missHintShown=true; S.missHintT=4; } // one-time reminder: fireflies drift off if kept waiting too long — first round only
        if(S.misses>=5){
          S.over=true; S.overT=0; sOver(); saveProgress(); recordNightEconomy();
          // Night Complete tips: picked once, right here, rather than
          // re-rolled every drawOver() frame -- same "pick once at the
          // moment of the event" discipline as S.batchPerfect above.
          S.tip=NIGHT_TIPS[Math.floor(Math.random()*NIGHT_TIPS.length)];
          // send the all-time best, not this round's score — must match what's in the cloud save
          if(YT&&YT.engagement&&YT.engagement.sendScore){ try{ YT.engagement.sendScore({value:best}); }catch(e){} }
          if(humGain)humGain.gain.setTargetAtTime(0.0001,AC.currentTime,0.3);
          S.flies.forEach(o=>{ if(o.state==='drift'){o.state='leaving';o.vy=-30;} });
        }
      }
    } else if(f.state==='locked'){
      f.patience-=dt*0.4; f.lockT+=dt;
      if(f.orbitT>0){ // playful: one circle around the jar first
        f.orbitT-=dt;
        const oa=f.wob+=(dt*5.5);
        const r=lerp(26,64,clamp(f.orbitT/1.1,0,1));
        f.x=lerp(f.x,jx+Math.cos(oa)*r,Math.min(1,dt*8));
        f.y=lerp(f.y,jy+Math.sin(oa)*r*0.8,Math.min(1,dt*8));
      } else {
        const dd=dist(f.x,f.y,jx,jy);
        const spd=(70+f.lockT*190)*(S.magnetT>0?1.5:1);
        const a=Math.atan2(jy-f.y,jx-f.x);
        const perp=Math.sin(f.lockT*6+f.wob)*Math.max(0,1-f.lockT*0.7)*34;
        f.x+=Math.cos(a)*spd*dt+Math.cos(a+Math.PI/2)*perp*dt;
        f.y+=Math.sin(a)*spd*dt+Math.sin(a+Math.PI/2)*perp*dt;
        // Capacity Enforcement Bug: this is the FIRST of the two enforcement
        // points. A firefly must not even start the guaranteed-to-complete
        // dive-into-the-jar animation unless jarCanAcceptCatch() is true right
        // now -- otherwise it commits to a 0.42s animation that used to end in
        // an unconditional push regardless of what happened to S.carried in
        // the meantime. If there's no room, it just keeps orbiting/homing
        // (the physics above already ran this frame) and re-checks every
        // frame, so it's caught the instant room actually opens up.
        if(dd<28&&jarCanAcceptCatch()){ f.state='caught'; f.animT=0; f.animA=Math.atan2(f.y-jy,f.x-jx); f.animR=dd; }
      }
    } else if(f.state==='caught'){
      f.animT+=dt;
      const t=f.animT/0.42;
      f.animA+=dt*11; const r=f.animR*(1-t);
      f.x=jx+Math.cos(f.animA)*r; f.y=jy+Math.sin(f.animA)*r;
      // catch light-streak: a brief fading trail along the spiral-into-jar flight
      if(Math.random()<dt*40)S.parts.push({x:f.x,y:f.y,vx:0,vy:0,life:0.25,maxL:0.25,color:TYPES[f.type].glow,r:1.2});
      if(t>=1){
        // Capacity Enforcement Bug: this is the SECOND, mathematically-decisive
        // enforcement point -- checked fresh, synchronously, immediately before
        // the only line in the whole file that actually grows S.carried. Even
        // though the transition above already filters most cases, two fireflies
        // can still both enter 'caught' in the same room-available frame and
        // then both finish their dives in the same later frame (their 0.42s
        // animations aren't atomic with each other) -- this final check is what
        // makes overflow actually impossible, not just unlikely: JS is single-
        // threaded, so as long as this check is evaluated fresh at the push
        // site itself, a same-frame double-completion still can't both pass it.
        if(jarCanAcceptCatch()){
          S.caughtN++;
          journal[f.type]++; if(!YT){ try{localStorage.setItem('gk2_journal',JSON.stringify(journal));}catch(e){} } // Journal: lifetime catches per type, tracked from here forward (no backfill for history predating this)
          questProgress('catch',f.type); // same catch moment as the Journal increment above
          S.carried.push({type:f.type,ph:rand(0,6.28),sp:rand(0.7,1.4)});
          if(f.type==='e')capMilestoneFx('the elder blesses your jar!'); // no capacity change any more -- see capMilestoneFx
          S.jar.pulse=1; sCatch(S.caughtN);
          puff(jx,jy,TYPES[f.type].glow,10,70,0.7);
          // Aurora Endgame Jar pass, item 3: a second, smaller aurora-tinted
          // burst layered on top of the normal catch puff, Aurora-only. Same
          // puff() system, no new particle mechanics -- purely a visual
          // flourish, same sound/journal/quest/score effects as any other catch.
          if(currentJar().aurora)puff(jx,jy,auroraShimmerColor(1),6,45,0.5);
          if(hintStage===0)hintStage=1;
          if(!villageHintShown&&S.carried.length>=S.cap){ villageHintShown=true; S.deliverHint=8; } // guide to the village once the jar is actually full — first round only
          S.flies.splice(i,1); continue;
        } else {
          // Room vanished mid-dive (another catch filled the last slot while
          // this one was animating) -- reject the catch rather than overflow.
          // Not spliced/removed, no journal/quest/coin credit: this firefly
          // gets a real second chance once the jar has room again, it doesn't
          // just silently vanish uncounted.
          f.state='locked';
        }
      }
    } else if(f.state==='leaving'){
      f.vy-=dt*20;
      f.y+=f.vy*dt; f.x+=Math.sin(f.wob+=dt*2)*14*dt;
      f.alpha=Math.max(0,f.alpha-dt*0.7);
      if(f.y<-30||f.alpha<=0){ S.flies.splice(i,1); continue; }
    }
  }

  // delivery: jar in village zone releases carried fireflies
  if(S.carried.length>0&&S.jar.y>DELIVER_Y){
    if(!S.wasDelivering){
      S.wasDelivering=true; S.batchPerfect=(S.carried.length===S.cap);
      S.deliverWaves.push({x:jx,cy0:jy,t:0}); // the delivery light-wave: travels from the jar down toward the village
    }
    S.deliverT-=dt;
    if(S.deliverT<=0){
      S.deliverT=0.14;
      const c=S.carried.shift();
      // find target: next unlit light, else random lit one
      let tgt=null;
      for(let li=0;li<LIGHTS.length;li++){ if(S.lightAnim[li]<=0){ tgt=LIGHTS[li]; break; } }
      if(!tgt)tgt=LIGHTS[Math.floor(rand(0,LIGHTS.length))];
      // Aurora Endgame Jar pass, item 4: jarAurora is baked in at spawn time
      // (not re-checked live) so a mid-flight jar switch -- which can't
      // actually happen during 'play' anyway -- can never retroactively
      // change an in-flight spark's trail.
      S.sparks.push({x:jx,y:jy,tx:tgt.x,ty:tgt.y,t:0,type:c.type,cx:jx+rand(-90,90),cy:Math.min(jy,tgt.y)-rand(40,110),jarAurora:currentJar().aurora});
      S.deliverHint=0;
    }
  } else S.deliverT=0;
  if(S.wasDelivering&&S.carried.length===0&&S.sparks.length===0){
    S.wasDelivering=false;
    if(S.batchPerfect)capMilestoneFx('perfect delivery!'); // no capacity change any more -- see capMilestoneFx
    S.batchPerfect=false;
    if(!refillHintShown){ refillHintShown=true; S.deliverExplainT=4; } // one-time reminder: jar's empty, go catch more — first round only
  }

  // delivery sparks (bezier flight to houses)
  for(let i=S.sparks.length-1;i>=0;i--){
    const s=S.sparks[i];
    // Glowkeeper's Blessing: the ONE modification to delivery speed -- only
    // how fast s.t (the bezier flight's own 0->1 progress) advances. Every
    // downstream effect at s.t>=1 below (score, grantDeliveryCoins(),
    // questProgress(), best, milestoneCheck()) is completely untouched and
    // still fires exactly once per spark regardless of how fast it got
    // there -- this cannot affect the economy, only how long the animation
    // takes to reach that point.
    s.t+=dt/0.9*(isGlowkeeperStatueEquipped()?1.15:1);
    // Aurora Endgame Jar pass, item 4: a trailing ribbon of aurora-colored
    // particles along the same bezier flight drawSparks() renders, Aurora-
    // only. Reuses S.parts, same as every other particle effect here --
    // purely decorative, no effect on score/coins/journal/quest credit,
    // which are all still granted exactly once below on s.t>=1.
    if(s.jarAurora&&Math.random()<0.4){
      const mt=1-s.t;
      const px=mt*mt*s.x+2*mt*s.t*s.cx+s.t*s.t*s.tx, py=mt*mt*s.y+2*mt*s.t*s.cy+s.t*s.t*s.ty;
      S.parts.push({x:px,y:py,vx:rand(-3,3),vy:rand(-3,3),life:0.35,maxL:0.35,color:auroraShimmerColor(1),r:rand(1,1.8)});
    }
    // Glowkeeper's Blessing visual response: a much rarer trailing sparkle
    // than Aurora's own ribbon above (0.08 vs 0.4 -- Aurora stays the more
    // visually impressive of the two, per direct instruction) -- purely
    // decorative, same S.parts reuse, no economy effect whatsoever.
    if(isGlowkeeperStatueEquipped()&&Math.random()<0.08){
      const mt=1-s.t;
      const px=mt*mt*s.x+2*mt*s.t*s.cx+s.t*s.t*s.tx, py=mt*mt*s.y+2*mt*s.t*s.cy+s.t*s.t*s.ty;
      S.parts.push({x:px,y:py,vx:rand(-2,2),vy:rand(-2,2),life:0.3,maxL:0.3,color:'rgba(255,214,140,1)',r:rand(0.8,1.3)});
    }
    if(s.t>=1){
      const prev=S.score;
      S.score+=TYPES[s.type].pts; S.deliveredN++;
      // Phase 1 economy pass: THREE independent layers now, stacked
      // multiplicatively -- TYPES[type].coins (the raw firefly value, same
      // for every player) x the EQUIPPED JAR's own Light Value (per-jar
      // economic identity -- Simple converts light into coins poorly,
      // Aurora converts it well) x coinMultiplierForRun() (the shared,
      // LOCKED 1.00-1.30x Coin Value line, unaffected by which jar is
      // equipped). Not rounded per catch (values are fractional) --
      // accumulates via grantDeliveryCoins(), same delivery moment as score.
      grantDeliveryCoins(TYPES[s.type].coins*jarCurrentStat('lightValue',currentJar())*coinMultiplierForRun());
      questProgress('deliver',s.type); // any type counts toward "deliver 20 fireflies" — same delivery moment as coins/score above
      sDeliver(S.deliveredN);
      puff(s.tx,s.ty,TYPES[s.type].glow,8,45,0.6);
      // Glowkeeper's Blessing: a brief pulse on the statue's own held light
      // when a delivery actually lands (see drawGlowkeeperStatue()'s idle/
      // active/pulse states) -- display-only, decremented like every other
      // transient timer below, no effect on anything already granted above.
      if(isGlowkeeperStatueEquipped())S.statuePulse=0.5;
      if(S.score>best){ best=S.score; if(!YT){ try{localStorage.setItem('gk2_best',''+best);}catch(e){} } }
      milestoneCheck(prev);
      S.sparks.splice(i,1);
    }
  }
  if(S.deliverHint>0)S.deliverHint-=dt;
  if(S.statuePulse>0)S.statuePulse-=dt;
  if(S.mothWarnT>0)S.mothWarnT-=dt;
  if(S.tutCarryHintT>0)S.tutCarryHintT-=dt;
  if(S.tutMothHintT>0)S.tutMothHintT-=dt;
  if(S.tutMagnetHintT>0)S.tutMagnetHintT-=dt;

  // moths: purely ambient/decorative (see the Capacity Enforcement Bug
  // comment above CARRY_OVERFLOW_HEADROOM -- the overloaded-jar homing
  // mechanic that used to live here was removed, not just dead-coded)
  for(let i=S.moths.length-1;i>=0;i--){
    const m=S.moths[i];
    m.wob+=dt*1.4; m.flap+=dt*22;
    m.x+=m.vx*dt; m.y+=Math.sin(m.wob)*36*dt;
    if(m.x<-40||m.x>W+40)S.moths.splice(i,1);
  }
  // magnet
  if(S.magnet){
    const m=S.magnet;
    m.wob+=dt*1.2; m.sp+=dt*4;
    m.x+=m.vx*dt; m.y+=Math.sin(m.wob)*24*dt;
    if(dist(m.x,m.y,jx,jy)<56){ S.magnetT=magnetDurationForRun(5); sMagnet(); puff(m.x,m.y,GLOW_W,14,90,0.8); S.magnet=null; }
    else if(m.x<-40||m.x>W+40)S.magnet=null;
  }
  // particles
  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i];
    p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.97; p.vy*=0.97;
    if(p.life<=0)S.parts.splice(i,1);
  }
  // delivery light-wave: expands and travels from the jar toward the village silhouette, then fades
  for(let i=S.deliverWaves.length-1;i>=0;i--){
    const w=S.deliverWaves[i];
    w.t+=dt/0.9;
    if(w.t>=1){ S.deliverWaves.splice(i,1); continue; }
    w.p=w.t;
    w.cy=lerp(w.cy0,H-90,w.p);
    w.r=lerp(10,220,w.p);
  }
  tutorialCheckAdvance(); // tail of update() -- runs after every other mutation above, so it always sees this frame's freshest S.flies/S.caughtN/S.moths/S.magnet/S.carried
}

// ---------- drawing ----------
function drawMoon(){
  const px=W/2, py=52, r=17;
  const prog=clamp(S.score/35,0,1);
  const pul=1+0.02*Math.sin(S.t*0.9);
  // moon tint follows the same eased heartDisplayTier as the Heart/detail — a
  // smooth blend between adjacent tiers' colors, not an instant swap
  const mLo=Math.max(1,Math.min(6,Math.floor(heartDisplayTier))), mHi=Math.min(6,mLo+1), mFrac=clamp(heartDisplayTier-mLo,0,1);
  const moonColor=lerpColor(SEASON_PALETTES[mLo].moon,SEASON_PALETTES[mHi].moon,mFrac);
  ctx.save();
  ctx.globalAlpha=0.9;
  ctx.drawImage(glowSprite(GLOW_W,50*pul),px-50*pul,py-50*pul,100*pul,100*pul);
  if(S.score>=60){
    ctx.globalAlpha=0.28+0.08*Math.sin(S.t*0.7);
    ctx.strokeStyle='#e9e2c4'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(px,py,30,0,6.28); ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#2c3358';
  ctx.beginPath(); ctx.arc(px,py,r,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(px,py,r,0,6.28); ctx.clip();
  const off=(1-prog)*r*1.7;
  ctx.fillStyle=moonColor;
  ctx.beginPath(); ctx.arc(px,py,r,0,6.28); ctx.fill();
  if(prog<1){ ctx.fillStyle='#2c3358'; ctx.beginPath(); ctx.arc(px-off,py-off*0.25,r*0.98,0,6.28); ctx.fill(); }
  ctx.restore();
}

// Garden Lantern -- Background Seam + Decoration Visual Fix pass: previously
// just a glow sprite plus a small dot (read as "a glowing dot", per direct
// feedback), now an actual small lantern (post, caged housing, warm glass,
// cap) with the glow/core anchored to the housing instead of floating over
// the ground point. 3 deterministic variants (post height / housing shape /
// cap style) picked by array index, never Math.random(), so they're stable
// frame-to-frame -- currently only 2 spots exist so only variants 0 and 1
// actually show, but the function supports a 3rd for any future spot.
// DECOR_LANTERN_SPOTS' x,y stay the ground anchor (unchanged, same as
// before); the lantern structure is drawn rising ABOVE that point, same
// spirit as a real lamppost rising from its base.
function drawGardenLantern(x,y,variant,flick){
  const postH=variant===2?15:12;
  const hy=y-postH-6; // housing center
  ctx.save();
  // slight ground illumination
  ctx.globalAlpha=0.28*flick;
  ctx.fillStyle='rgba(255,205,130,1)';
  ctx.beginPath(); ctx.ellipse(x,y+1,11,3.4,0,0,6.28); ctx.fill();
  ctx.globalAlpha=1;
  // post
  ctx.strokeStyle='#2a2018'; ctx.lineWidth=2.2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-postH); ctx.stroke();
  // housing -- caged square for variants 0/1 (differ by width + cap), a
  // small round globe for variant 2
  ctx.strokeStyle='#332619'; ctx.lineWidth=1.3;
  if(variant===2){
    ctx.beginPath(); ctx.arc(x,hy,4.6,0,6.28); ctx.stroke();
  } else {
    const hw=variant===1?5.4:4.6;
    ctx.strokeRect(x-hw/2,hy-5.5,hw,11);
    ctx.beginPath(); ctx.moveTo(x-hw/2,hy); ctx.lineTo(x+hw/2,hy); ctx.stroke(); // mid cross-bar, caged look
  }
  // warm glass fill
  ctx.fillStyle='rgba(255,198,115,'+(0.75*flick)+')';
  if(variant===2){ ctx.beginPath(); ctx.arc(x,hy,3.2,0,6.28); ctx.fill(); }
  else { const hw=variant===1?5.4:4.6; ctx.fillRect(x-hw/2+0.7,hy-4.7,hw-1.4,9.4); }
  // small cap
  ctx.fillStyle='#241a10';
  if(variant===1){ ctx.beginPath(); ctx.ellipse(x,hy-6,3.8,1.5,0,0,6.28); ctx.fill(); } // flat cap
  else { ctx.beginPath(); ctx.moveTo(x-3.6,hy-5.5); ctx.lineTo(x,hy-10); ctx.lineTo(x+3.6,hy-5.5); ctx.closePath(); ctx.fill(); } // pointed cap
  // subtle soft halo + warm amber core, anchored on the housing (not the ground)
  ctx.globalAlpha=flick;
  ctx.drawImage(glowSprite(GLOW_Y,12),x-12,hy-12,24,24);
  ctx.globalAlpha=1;
  ctx.fillStyle='#ffe6a8';
  ctx.beginPath(); ctx.arc(x,hy,1.5,0,6.28); ctx.fill();
  ctx.restore();
}

// Displayed size -- deliberately modest, comparable to the Fountain's own
// landmark footprint (drawFountain() above spans roughly 48px wide x 32px
// tall at its widest), never the "giant character" scale the source art
// could tempt. The embedded asset (60x135) is ~2.3x this size purely so it
// downscales crisply at DPR up to 2 -- it is never drawn at its own native
// resolution.
const STATUE_DISPLAY_W=26, STATUE_DISPLAY_H=58;
// Placement fix: the original H-168 put the statue in the SAME depth band
// as the midground houses (houseTypeB/D at H-196/H-198, see renderBG()) and
// x=372 is EXACTLY the x of the big central foreground house
// (house(g,372,H-92,86,90,44,...), which spans x:372-458, roof peak at
// y=734) -- so the statue was rendering on that house's roof, not on the
// ground. Confirmed by marker-probing the actual renderBG() coordinates
// directly in-browser rather than guessing another arbitrary H-relative
// value. The open, undecorated plaza ground clear of every house AND of
// LANTERN_SPOTS/DECOR_LANTERN_SPOTS/FLOWERPOT is the strip left of the
// central house and left of the Fountain -- x=345 keeps ~35px clearance
// from the nearest lantern spot (392,H-66) and (310,H-38), y=H-60 sits on
// the same foreground ground line the Fountain (FOUNTAIN_Y=H-52) and the
// edge-cottage row (H-42 to H-80) already use, not the elevated band. Still
// "slightly behind" the Fountain in the sense of being the plaza's second
// landmark, not centered on it -- the Fountain remains the one central
// landmark, per direct instruction.
const STATUE_X=345, STATUE_Y=H-60;
function drawGlowkeeperStatue(){
  // Absent entirely until owned AND equipped -- no silhouette, no
  // placeholder, no hidden dark version, no glow. Matches drawFountain()/
  // drawDecorDeco()'s own "draws nothing at all when unowned" precedent.
  if(!(upgrades.statueOwned&&upgrades.statueEquipped))return;
  if(!statueImgLoaded)return; // graceful no-op for the rare frame before the data URI finishes decoding -- never blocks or delays anything else
  const x=STATUE_X, y=STATUE_Y, w=STATUE_DISPLAY_W, h=STATUE_DISPLAY_H;
  // Three glow states per direct spec -- idle (always, very subtle) / active
  // (brighter while a delivery is actually in flight toward the village) /
  // pulse (a brief flare exactly when a delivery lands, S.statuePulse -- set
  // in update()'s delivery-arrival block, decremented like every other
  // transient timer). Anchored on the held-light area (~22% down from the
  // top of the crop, where the source artwork's orb sits), not the ground.
  const delivering=S.carried&&S.carried.length>0&&S.jar&&S.jar.y>DELIVER_Y;
  const pulse=Math.max(0,S.statuePulse||0);
  const glowA=Math.min(0.55,0.16+0.05*Math.sin(S.t*1.3)+(delivering?0.1:0)+pulse*0.4);
  const glowR=(delivering?15:11)+pulse*7;
  const gx=x, gy=y-h*0.78;
  ctx.save();
  ctx.globalAlpha=glowA;
  ctx.drawImage(glowSprite('rgba(255,214,140,1)',glowR),gx-glowR,gy-glowR,glowR*2,glowR*2);
  ctx.globalAlpha=1;
  ctx.drawImage(STATUE_IMG,x-w/2,y-h,w,h);
  ctx.restore();
}
function drawEnvironmentalDetail(dTier){
  ctx.fillStyle='#3a2818'; // tier 1+: the pot itself, always fully present
  ctx.beginPath(); ctx.moveTo(FLOWERPOT_X-6,FLOWERPOT_Y); ctx.lineTo(FLOWERPOT_X-8,FLOWERPOT_Y-10); ctx.lineTo(FLOWERPOT_X+8,FLOWERPOT_Y-10); ctx.lineTo(FLOWERPOT_X+6,FLOWERPOT_Y); ctx.closePath(); ctx.fill();
  const bloomA=clamp(dTier-1,0,1); // flowers bloom in the pot
  if(bloomA>0){
    const petalColors=['#e6a0b0','#f0c987','#c9a8e6'];
    ctx.globalAlpha=bloomA;
    [[-4,-13],[0,-16],[4,-13]].forEach(([dx,dy],i)=>{
      ctx.fillStyle=petalColors[i%petalColors.length];
      ctx.beginPath(); ctx.arc(FLOWERPOT_X+dx,FLOWERPOT_Y+dy,2.4,0,6.28); ctx.fill();
    });
    ctx.globalAlpha=1;
  }
  const birdA=clamp(dTier-2,0,1); // birds appear, perched and still — decorative only
  if(birdA>0){
    ctx.globalAlpha=birdA; ctx.fillStyle='#0a0e1e';
    BIRD_SPOTS.forEach(b=>{
      ctx.beginPath(); ctx.moveTo(b.x-4,b.y); ctx.quadraticCurveTo(b.x,b.y-3,b.x+4,b.y); ctx.quadraticCurveTo(b.x,b.y-1,b.x-4,b.y); ctx.fill();
    });
    ctx.globalAlpha=1;
  }
  const butterflyA=clamp(dTier-3,0,1); // butterflies drift gently near the flowers
  if(butterflyA>0){
    for(let i=0;i<3;i++){
      const a=S.t*0.7+i*2.4;
      const bx=FLOWERPOT_X+Math.cos(a)*16, by=FLOWERPOT_Y-18+Math.sin(a*1.6)*10;
      ctx.globalAlpha=butterflyA*(0.7+0.3*Math.sin(S.t*4+i));
      ctx.drawImage(glowSprite(i%2?'rgba(230,200,230,1)':'rgba(255,220,180,1)',5),bx-5,by-5,10,10);
    }
    ctx.globalAlpha=1;
  }
  const lanternA=clamp(dTier-4,0,1); // a couple of small always-on decorative lanterns
  if(lanternA>0){
    LANTERN_SPOTS.forEach(L=>{
      const flick=0.85+0.15*Math.sin(S.t*6+L.x);
      ctx.globalAlpha=lanternA*flick;
      ctx.drawImage(glowSprite(GLOW_Y,12),L.x-12,L.y-12,24,24);
      ctx.fillStyle='#ffd987'; ctx.beginPath(); ctx.arc(L.x,L.y,2.6,0,6.28); ctx.fill();
      ctx.globalAlpha=1;
    });
  }
  // Village Heart Removal pass: the wind chimes that used to hang here were
  // explicitly positioned relative to HEART_X/HEART_Y ("hanging near the
  // Heart") -- with the tree itself removed, they'd float with no anchor at
  // all, which would just be a second unexplained floating decoration in
  // its place. Removed as part of the same pass, not left orphaned.
}
function drawVillage(){
  const tier=heartTier(best); // the settled (discrete) tier — used for the mist tint, which is subtle enough not to need crossfading
  const pal=SEASON_PALETTES[tier];
  if(bgFadeT>=0){ // mid-crossfade: dissolve from the previous look into the current one, never an instant swap
    ctx.drawImage(bgPrev,0,0);
    ctx.globalAlpha=Math.min(1,bgFadeT/BG_FADE_DUR);
    ctx.drawImage(bg,0,0);
    ctx.globalAlpha=1;
  } else {
    ctx.drawImage(bg,0,0);
  }
  for(const s of stars){
    if(s.thr>S.score)continue;
    const tw=0.4+0.6*Math.abs(Math.sin(S.t*s.s+s.p));
    ctx.globalAlpha=tw*0.8;
    ctx.fillStyle='#e8ecff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;
  // aurora (>=75)
  if(S.aurora>0){
    for(let i=0;i<3;i++){
      const yy=70+i*46+Math.sin(S.t*0.4+i*2)*14;
      const g=ctx.createLinearGradient(0,yy-40,0,yy+40);
      const hue=i===0?'140,235,190':i===1?'150,190,250':'200,160,240';
      g.addColorStop(0,'rgba('+hue+',0)');
      g.addColorStop(0.5,'rgba('+hue+','+(0.07*S.aurora)+')');
      g.addColorStop(1,'rgba('+hue+',0)');
      ctx.fillStyle=g; ctx.fillRect(0,yy-40,W,80);
    }
  }
  // shooting stars (>=50)
  for(const s of S.shots){
    ctx.globalAlpha=Math.min(1,s.life*2);
    ctx.strokeStyle='#fff6e0'; ctx.lineWidth=1.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*0.14,s.y-s.vy*0.14); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // constellations (>=100)
  if(S.constA>0){
    ctx.globalAlpha=S.constA*0.5;
    ctx.strokeStyle='#aeb8e6'; ctx.lineWidth=1;
    for(const c of CONST){
      ctx.beginPath(); c.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
      ctx.fillStyle='#e8ecff';
      for(const [x,y] of c){ ctx.beginPath(); ctx.arc(x,y,2,0,6.28); ctx.fill(); }
    }
    ctx.globalAlpha=1;
  }
  // bats
  ctx.fillStyle='#0a0e1e';
  for(const b of S.bats){
    const w=Math.abs(Math.sin(b.flap))*6+2;
    ctx.beginPath(); ctx.ellipse(b.x-3,b.y,w,2,-0.4,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.ellipse(b.x+3,b.y,w,2,0.4,0,6.28); ctx.fill();
  }
  // drifting mist (tinted per season, same tier as everything else this frame)
  for(const m of mists){
    m.x+=m.s*0.016; if(m.x>W+m.w)m.x=-m.w;
    ctx.globalAlpha=m.a;
    ctx.drawImage(glowSprite(pal.mist,m.w/2),m.x-m.w/2,m.y-30,m.w,60);
  }
  ctx.globalAlpha=1;
  // long-session pacing: a slow, subtle sky-brightness drift over a single sitting
  // (sessionT is session-level, NOT persisted, NOT tied to tier/best — resets on reload)
  // Background Seam fix: this was a second hard-edged flat-alpha fillRect
  // (cutting off dead at H*0.6) -- the same class of bug as the violet

  const drift=0.5+0.5*Math.sin(sessionT*(2*Math.PI/1100));

  driftG.addColorStop(0,'rgba(255,233,200,'+(0.05*drift)+')');
  driftG.addColorStop(0.7,'rgba(255,233,200,'+(0.025*drift)+')');
  driftG.addColorStop(1,'rgba(255,233,200,0)');
  ctx.fillStyle=driftG;
  ctx.fillRect(0,0,W,H*0.6);
  ctx.globalAlpha=1;
  if(S.villageGlow>0){
    const g=ctx.createRadialGradient(W/2,H-110,20,W/2,H-110,W*0.75);
    g.addColorStop(0,'rgba(255,190,100,'+(0.22*S.villageGlow)+')');
    g.addColorStop(1,'rgba(255,190,100,0)');

  }

// rendering; anchors to the same (rightX,y) point the old bare call used,
// so nothing about the balance's position or data source changes.
// Golden Typography Color Refinement: optional `color` (NEW, 4th param) --
// omitted, keeps the exact prior look.
function drawCoinBalancePill(rightX,y,amount,color){
  const size=16;
  ctx.save(); ctx.font='600 '+size+'px Georgia,serif';
  const text=Math.round(amount).toLocaleString();
  const textW=ctx.measureText(text).width;
  const r=size*0.28, gap=size*0.4;
  const contentW=r*2+gap+textW, padX=14, h=30;
  const pillW=contentW+padX*2, pillLeft=rightX-pillW;
  ctx.fillStyle='rgba(10,14,36,0.7)'; ctx.strokeStyle='rgba(174,184,203,0.28)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(pillLeft,y-h/2,pillW,h,h/2); ctx.fill(); ctx.stroke();
  ctx.restore();
  lumCurrency(rightX-padX,y,amount,'right',size,color);
}
// pill button, 4 variants matching LumoraButton.tsx -- btn is {x,y,w,h}, the
// same object inRect() hit-tests against, never duplicated coordinates
function lumButton(btn,label,variant,disabled){
  variant=variant||'primary';
  ctx.save();
  ctx.globalAlpha=disabled?0.4:1;
  ctx.beginPath(); ctx.roundRect(btn.x-btn.w/2,btn.y-btn.h/2,btn.w,btn.h,btn.h/2);
  if(variant==='primary'){
    const g=ctx.createLinearGradient(0,btn.y-btn.h/2,0,btn.y+btn.h/2);
    g.addColorStop(0,LUM_GOLD); g.addColorStop(1,LUM_AMBER);
    ctx.save(); ctx.shadowColor='rgba(251,210,107,0.45)'; ctx.shadowBlur=24;
    ctx.fillStyle=g; ctx.fill(); ctx.restore();
    ctx.fillStyle=LUM_NIGHT_DEEP;
  } else if(variant==='outline'){
    ctx.fillStyle='rgba(25,33,67,0.4)'; ctx.fill();
    ctx.strokeStyle='rgba(174,184,203,0.22)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=LUM_CREAM;
  } else if(variant==='quiet'){
    ctx.fillStyle='rgba(25,33,67,0.6)'; ctx.fill();
    ctx.fillStyle=LUM_CREAM;
  } else if(variant==='glass'){
    // Premium Transparent Glassmorphism Redesign: a NEW variant -- the
    // Workshop's own Upgrade/Buy buttons used the solid bright-gold
    // 'primary' fill before, which read as a standard HTML button rather
    // than part of the glass UI. 'primary' itself is untouched (title nav,
    // pause confirm still use it), so this only affects call sites that
    // opt in explicitly (see cardButtonRect() usages below).
    const bg=ctx.createLinearGradient(0,btn.y-btn.h/2,0,btn.y+btn.h/2);
    bg.addColorStop(0,'rgba(70,60,110,0.32)'); bg.addColorStop(1,'rgba(28,24,54,0.36)');
    ctx.fillStyle=bg; ctx.fill();
    // Golden Typography Color Refinement: border/text retinted to the
    // antique-gold system (was the older LUM_CHAMPAGNE-based rgba).
    ctx.strokeStyle='rgba(183,123,47,0.45)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=WS_GOLD_PRICE;
  } else { // ghost
    ctx.fillStyle=LUM_HAZE;
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='600 '+(btn.fontSize||13)+'px Georgia,serif';
  try{ ctx.letterSpacing='1.4px'; }catch(e){}
  ctx.fillText(label.toUpperCase(),btn.x,btn.y+1);
  try{ ctx.letterSpacing='0px'; }catch(e){}
  ctx.restore();
}

// ---------- first-night tutorial ----------
// Resolves which live gameplay object (if any) the current step should
// highlight -- reads the exact same state the trigger conditions in
// tutorialCheckAdvance() already watch, nothing duplicated. 'village' has
// no single object (it's the delivery zone itself), handled separately in
// drawTutorialHighlight() below.
function tutorialHighlightTarget(kind){
  if(kind==='firefly')return S.flies.length?{x:S.flies[0].x,y:S.flies[0].y}:null;
  if(kind==='moth')return S.moths.length?{x:S.moths[0].x,y:S.moths[0].y}:null;
  if(kind==='magnet')return S.magnet?{x:S.magnet.x,y:S.magnet.y}:null;
  return null;
}
// A subtle animated cue from the jar toward the target -- a few small
// traveling glow dots along the straight line between them, plus a soft
// pulsing ring around the target itself (or, for 'village', a dashed line
// at the actual delivery boundary, echoing the existing "the village"
// marker's own visual language rather than inventing a new one). Purely
// derived from S.t and existing live positions -- no new per-frame state.
function drawTutorialHighlight(kind){
  if(!kind)return;
  const jx=S.jar.x, jy=S.jar.y;
  const pulse=0.5+0.5*Math.sin(S.t*4);
  if(kind==='village'){
    ctx.save();
    ctx.globalAlpha=0.4+0.3*pulse;
    ctx.strokeStyle='rgba(255,214,110,0.85)'; ctx.lineWidth=2;
    ctx.setLineDash([8,8]);
    ctx.beginPath(); ctx.moveTo(26,DELIVER_Y); ctx.lineTo(W-26,DELIVER_Y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    for(let i=0;i<3;i++){
      const t=(S.t*0.5+i/3)%1;
      const cy=lerp(jy,DELIVER_Y,t);
      ctx.globalAlpha=(1-t)*0.7;
      ctx.drawImage(glowSprite(GLOW_Y,7),jx-7,cy-7,14,14);
    }
    ctx.globalAlpha=1;
    return;
  }
  const tgt=tutorialHighlightTarget(kind);
  if(!tgt)return;
  for(let i=0;i<3;i++){
    const t=(S.t*0.6+i/3)%1;
    const cx=lerp(jx,tgt.x,t), cy=lerp(jy,tgt.y,t);
    ctx.globalAlpha=(1-t)*0.7;
    ctx.drawImage(glowSprite(kind==='moth'?'rgba(214,90,90,1)':GLOW_Y,6),cx-6,cy-6,12,12);
  }
  ctx.globalAlpha=1;
  ctx.save();
  ctx.globalAlpha=0.5+0.4*pulse;
  ctx.strokeStyle=kind==='moth'?'rgba(214,90,90,1)':'rgba(255,214,110,1)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(tgt.x,tgt.y,22+pulse*6,0,6.28); ctx.stroke();
  ctx.restore();
}

// Moth-collision feedback -- always-on gameplay polish, NOT tutorial-gated
// (every player benefits, not just new ones during the MOTH step). Fires
// from S.mothWarnT, set in update()'s existing "moth interrupt" block at
// the exact moment a moth actually scares a locked-in firefly -- the real
// existing consequence, not mere proximity. ~0.65s one-shot decay, same
// layered-gradient edge technique as drawFullJarAlert() but red and much
// briefer, per direct instruction against a huge/permanent overlay.
function drawMothWarningFlash(){
  if(S.mothWarnT<=0)return;
  const a=Math.max(0,Math.min(1,S.mothWarnT/0.65));
  ctx.save();
  const bandW=20;
  const mkGrad=(x0,y0,x1,y1)=>{ const g=ctx.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,'rgba(214,70,70,'+(0.5*a)+')'); g.addColorStop(1,'rgba(214,70,70,0)'); return g; };
  ctx.fillStyle=mkGrad(0,0,0,bandW); ctx.fillRect(0,0,W,bandW);
  ctx.fillStyle=mkGrad(0,H,0,H-bandW); ctx.fillRect(0,H-bandW,W,bandW);
  ctx.fillStyle=mkGrad(0,0,bandW,0); ctx.fillRect(0,0,bandW,H);
  ctx.fillStyle=mkGrad(W,0,W-bandW,0); ctx.fillRect(W-bandW,0,bandW,H);
  ctx.globalAlpha=a*0.85;
  ctx.strokeStyle='rgba(214,70,70,1)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(S.jar.x,S.jar.y,34+(1-a)*16,0,6.28); ctx.stroke();
  ctx.globalAlpha=Math.min(1,a*1.6);
  ctx.fillStyle='#f2a0a0'; ctx.font='700 18px Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText('⚠ MOTH!',S.jar.x,S.jar.y-58);
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='top';
}

// Home Page Premium UI Refinement pass: `premium` mode rewritten per
// direct feedback that the previous version (bright radial gold fill,
// three glow rings, four diamond points, a tiny star) had overshot into
// "too bright and visually heavy" -- explicitly "DO NOT copy the elaborate
// glowing medallion" this time. Now: a DARK translucent glass interior
// (same violet-navy family as lumGlassPanel, for visual consistency with
// the rest of the UI), one thin gold border + one subtle secondary inner
// border, a small soft ambient glow (not a bloom), a restrained top-left
// highlight arc (not a full radial fill), and gold text (was dark brown --
// the interior is dark now, so the text needs to be the light element for
// contrast). The other two call sites (WELCOME_CLOSE_BTN's "continue", the
// pause menu's RESUME_BTN) still omit `premium` and get the exact original
// flat-gold orb with dark brown text, completely unchanged.
function glowOrb(btn,label,premium){
  const pl=1+0.03*Math.sin(S.t*3);
  if(premium){
    // Home Page Premium UI Refinement pass, "light inspiring" tweak: the
    // dark-glass version read as too flat/inert, per direct feedback --
    // added a slow-breathing warm light living INSIDE the glass (like a
    // candle behind it), and a touch more presence to the outer ambient
    // glow. Border/rings/text untouched from the previous restrained pass.
    const breathe=0.5+0.5*Math.sin(S.t*0.7);
    ctx.globalAlpha=0.45+0.12*breathe;
    ctx.drawImage(glowSprite(GLOW_Y,btn.r*1.35),btn.x-btn.r*1.35,btn.y-btn.r*1.35,btn.r*2.7,btn.r*2.7);
    ctx.globalAlpha=1;
    const ig=ctx.createRadialGradient(btn.x,btn.y,0,btn.x,btn.y,btn.r*pl);
    ig.addColorStop(0,'rgba(42,34,62,0.88)'); ig.addColorStop(1,'rgba(16,12,28,0.94)');
    ctx.fillStyle=ig;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.clip();
    // warm inner light -- a soft glowing core, breathing slowly, so the
    // dark glass reads as lit from within rather than just dark
    const core=ctx.createRadialGradient(btn.x,btn.y,0,btn.x,btn.y,btn.r*0.85);
    core.addColorStop(0,'rgba(255,214,140,'+(0.22+0.1*breathe)+')');
    core.addColorStop(0.6,'rgba(243,199,95,'+(0.08+0.05*breathe)+')');
    core.addColorStop(1,'rgba(243,199,95,0)');
    ctx.fillStyle=core; ctx.fillRect(btn.x-btn.r,btn.y-btn.r,btn.r*2,btn.r*2);
    const hl=ctx.createRadialGradient(btn.x-btn.r*0.32,btn.y-btn.r*0.35,0,btn.x-btn.r*0.32,btn.y-btn.r*0.35,btn.r*0.95);
    hl.addColorStop(0,'rgba(255,231,163,0.2)'); hl.addColorStop(1,'rgba(255,231,163,0)');
    ctx.fillStyle=hl; ctx.fillRect(btn.x-btn.r,btn.y-btn.r,btn.r*2,btn.r*2);
    ctx.restore();
    ctx.strokeStyle='#F3C75F'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.stroke();
    ctx.strokeStyle='rgba(255,231,163,0.32)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl-6,0,6.28); ctx.stroke();
    ctx.save();
    ctx.shadowColor='rgba(255,214,140,0.5)'; ctx.shadowBlur=6+3*breathe;
    ctx.fillStyle='#FFE7A3'; ctx.font='600 22px Georgia,serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,btn.x,btn.y);
    ctx.restore();
    return;
  } else {
    ctx.drawImage(glowSprite(GLOW_Y,btn.r*1.6),btn.x-btn.r*1.6,btn.y-btn.r*1.6,btn.r*3.2,btn.r*3.2);
    ctx.fillStyle='#f0b95c';
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r*pl,0,6.28); ctx.fill();
    ctx.fillStyle='#3a2a14'; ctx.font='600 24px Georgia,serif';
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,btn.x,btn.y);
}

// Home Page Premium UI pass: visual/UI polish only, per direct instruction
// -- renderBG()/drawVillage()/drawMoon() (the SHARED background/village/
// moon rendering, also used by actual gameplay) are deliberately untouched
// here; only this screen's own scrim/foreground chrome changed. Layout
// reordered to match the requested hierarchy: BEGIN -> Shop/Village/
// Journal -> Best Score -> studio branding (Best Score used to sit ABOVE
// the nav row; now below it, per direct instruction) -- text/position
// only, no hit-test coordinates besides titleNavRects()'s own size moved.
function drawTitle(){
  const a=Math.min(1,S.t*0.7);
  // scrim over the still-animating village
  const cx=W/2, cy=H/2, rad=Math.hypot(W,H)/2;
  const scrim=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  scrim.addColorStop(0,'rgba(8,10,26,0.18)');
  scrim.addColorStop(1,'rgba(8,10,26,0.66)');
  ctx.globalAlpha=a; ctx.fillStyle=scrim; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  // ambient drifting fireflies -- a tiny solid core + two soft wing curves
  // on top of the glow, same shape language as the real in-round drawFly()
  // (core dot + quadratic wing strokes), not just a bare glow blob (which
  // read as "a ball", per direct feedback).
  for(const f of titleFlies){

  const br=0.5+0.5*Math.sin(S.t*0.55), hr=200+br*36;
  ctx.globalAlpha=a*(0.16+0.14*br);

  ctx.fillStyle='#B9B3D6'; ctx.font='italic 21px Georgia,serif';
  try{ ctx.letterSpacing='1.5px'; }catch(e){}
  const subY=H*0.30+62, subText='a glowkeeper story';
  ctx.fillText(subText,W/2,subY);
  const subW=ctx.measureText(subText).width;
  try{ ctx.letterSpacing='0px'; }catch(e){}
  ctx.fillStyle='rgba(243,199,95,0.55)'; ctx.font='11px Georgia,serif';
  ctx.fillText('✦',W/2-subW/2-16,subY);
  ctx.fillText('✦',W/2+subW/2+16,subY);
  ctx.globalAlpha=1;
  ornament(H*0.30+100,a,60);
  ctx.globalAlpha=a;
  // Home Page Premium UI Refinement pass: the drifting gold motes that used

  // itself needed to read as "quiet magical artifact", not "giant glowing
  // power button", and extra particles around it worked against that.

  // Journal -- Settings excluded, Quests removed by the LUMORA
  // clarifications pass in favor of the Village's own Tonight's Quest
  // card). Single source of truth via titleNavRects(), shared with the

  const NAV_ACCENTS={shop:'rgba(243,199,95,0.9)', village:'rgba(164,214,150,0.75)', journal:'rgba(190,150,230,0.75)'};

  // glass capsule BELOW it (matching the requested hierarchy), with a
  // tiny procedural trophy instead of a colored emoji.

    ctx.fillStyle='rgba(185,179,214,0.85)'; ctx.font='500 11px Georgia,serif';

  ctx.fillStyle='rgba(90,98,136,0.75)'; ctx.font='12px Georgia,serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';

// ---------- shop (Stage 2 Part B) ----------
// Reuses the same procedural-canvas approach as everything else (drawHeart,
// drawVillage, renderBG, drawJar) — no images, no new asset pipeline. Vendor
// "avatars" are simple painted busts from the existing palette (cream, forest
// green, midnight blue, warm amber, soft orange, deep indigo), not portraits.
function wrapText(text,x,y,maxWidth,lineHeight,align){
  ctx.textAlign=align||'center';
  const words=text.split(' ');
  let line='', ly=y;
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxWidth&&line){ ctx.fillText(line,x,ly); line=words[i]+' '; ly+=lineHeight; }
    else line=test;
  }
  ctx.fillText(line,x,ly);
  return ly+lineHeight;
}
// Lumora UI port: no more little procedural vendor-character portraits --
// the new design language is jar/light iconography, not shopkeeper sprites.
// drawJarPreview is the shared, lightweight jar renderer for every shop/UI
// context that needs to show a jar WITHOUT the full gameplay state drawJar()
// depends on (S.carried/S.jar position/pulse/shake) -- same vector path as
// drawJar() for visual consistency, parameterized by an arbitrary jar object
// and fill percentage instead.
// Shop UI Visual Redesign, quality pass: per direct feedback that the shop
// jars read as flat placeholder blobs next to the reference art. Same
// silhouette as before (and as drawJar()'s real gameplay jar -- untouched,
// this function is shop-presentation only), but shaded like the reference:
// a grounding shadow, cylindrical glass shading (dark-light-dark across the
// body instead of one flat fill), a genuine light-catching highlight
// streak, a wood-toned (not flat-color) lid with a metal rim, and -- in
// `detailed` mode only (the large hero card) -- a second highlight, a
// bright core point, and a few scattered sparkle flecks, matching the
// reference's own hero-vs-grid detail split (its big Crystal Lantern hero
// has visible internal sparkle; its small grid jars don't).
function drawJarPreview(cx,cy,scale,jarObj,fillPct,detailed){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(scale,scale);
  // grounding drop shadow
  ctx.globalAlpha=0.3;
  ctx.fillStyle='#000000';
  ctx.beginPath(); ctx.ellipse(1,25,19,5,0,0,6.28); ctx.fill();
  ctx.globalAlpha=1;
  const bodyPath=()=>{
    ctx.beginPath();
    ctx.moveTo(-19,-30);
    ctx.quadraticCurveTo(-27,-24,-27,-8);
    ctx.quadraticCurveTo(-27,16,-18,20);
    ctx.lineTo(18,20);
    ctx.quadraticCurveTo(27,16,27,-8);
    ctx.quadraticCurveTo(27,-24,19,-30);
    ctx.closePath();
  };
  ctx.fillStyle=jarObj.glass; ctx.strokeStyle=jarObj.glassStroke; ctx.lineWidth=2.5;
  bodyPath(); ctx.fill(); ctx.stroke();
  // cylindrical shading, clipped to the glass body -- darker at both far
  // edges, a soft lit band left-of-center, so the glass reads as ROUND
  // rather than a flat tinted rectangle.
  ctx.save();
  bodyPath(); ctx.clip();
  const shade=ctx.createLinearGradient(-27,0,27,0);
  shade.addColorStop(0,'rgba(0,0,0,0.18)');
  shade.addColorStop(0.3,'rgba(255,255,255,0.06)');
  shade.addColorStop(0.6,'rgba(0,0,0,0)');
  shade.addColorStop(1,'rgba(0,0,0,0.24)');
  ctx.fillStyle=shade; ctx.fillRect(-27,-30,54,50);
  ctx.restore();
  // glass highlight streak(s) -- the single clearest "this is glass, not
  // plastic" cue the reference relies on. Always at least one; detailed
  // mode adds a thinner second streak for extra richness at hero scale.
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2.2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-17,-23); ctx.quadraticCurveTo(-22,-9,-20,10); ctx.stroke();
  if(detailed){
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(-9,-25); ctx.quadraticCurveTo(-12,-13,-11,-1); ctx.stroke();
  }
  // lid -- a wood-toned gradient (light top edge -> base tone -> darker
  // underside) instead of one flat fill, plus fine grain lines at hero
  // scale, then the existing darker metal rim band underneath.
  const lidG=ctx.createLinearGradient(0,-38,0,-28);
  lidG.addColorStop(0,lerpColorAny(jarObj.lid,'#ffffff',0.3));
  lidG.addColorStop(0.5,jarObj.lid);
  lidG.addColorStop(1,lerpColorAny(jarObj.lid,'#000000',0.3));
  ctx.fillStyle=lidG;
  ctx.beginPath(); ctx.roundRect(-21,-38,42,10,4); ctx.fill();
  if(detailed){
    ctx.strokeStyle='rgba(0,0,0,0.16)'; ctx.lineWidth=1;
    [-35.5,-33,-30.5].forEach(ly=>{ ctx.beginPath(); ctx.moveTo(-18,ly); ctx.lineTo(18,ly); ctx.stroke(); });
  }
  ctx.fillStyle=jarObj.lidRim; ctx.beginPath(); ctx.roundRect(-19,-31,38,3,2); ctx.fill();
  // inner glow (unchanged formula/position from before)
  const igRGB=toRgbTriple(jarObj.glow);
  const ig=ctx.createRadialGradient(0,0,2,0,0,26);
  ig.addColorStop(0,'rgba('+igRGB+','+(0.25+fillPct*0.55)+')');
  ig.addColorStop(1,'rgba('+igRGB+',0)');
  ctx.fillStyle=ig; ctx.fillRect(-27,-30,54,50);
  // bright core + a few scattered sparkle flecks -- detailed (hero) only
  if(detailed){
    ctx.fillStyle='#ffffff';
    ctx.globalAlpha=0.9; ctx.beginPath(); ctx.arc(-2,-2,2,0,6.28); ctx.fill(); ctx.globalAlpha=1;
    [[-9,-10],[7,-13],[10,4],[-8,9],[2,12]].forEach(([fx,fy],i)=>{
      ctx.globalAlpha=0.3+0.4*Math.abs(Math.sin(S.t*1.7+i*1.9));
      ctx.beginPath(); ctx.arc(fx,fy,0.9,0,6.28); ctx.fill();
    });
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
// lerpColor requires both inputs to already be hex -- jar lid/lidRim
// values always are, but this small wrapper guards against a future
// non-hex value (an rgba() lid tone, say) reaching lerpColor and throwing,
// by falling back to the plain color unmodified instead of crashing the
// whole shop screen over a cosmetic gradient stop.
function lerpColorAny(hex,target,t){
  return hex&&hex[0]==='#'?lerpColor(hex,target,t):hex;
}

// Trail System Redesign: a compact preview using the SAME glowSprite()
// infrastructure the real trail particles use (not a separate preview
// renderer) -- a short arc of small dots in the trail's own hues, gently
// bobbing via S.t so it doesn't read as a dead swatch. No new particle
// simulation, no animation loop of its own -- matches section 16's "if
// animation would add unnecessary complexity, use a compact static-style
// preview" guidance.
// Premium Transparent Glassmorphism Redesign: added a soft curved ribbon
// stroke beneath the existing sparkle dots (still the SAME positions/
// animation/glowSprite infrastructure as before) so the preview reads as
// one continuous flowing particle trail rather than isolated dots, per
// direct feedback ("a small elegant flowing particle ribbon rather than a
// flat line"). Cheap addition -- one extra stroke with a handful of
// lineTo() calls, no new particle simulation.
function drawTrailPreview(cx,cy,hues){
  if(!hues||!hues.length){
    ctx.strokeStyle='rgba(174,184,203,0.3)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.arc(cx,cy,15,0,6.28); ctx.stroke();
    return;
  }
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<=12;i++){
    const t=i/12, a=Math.PI*0.7+t*Math.PI*0.9, r=15-t*9;
    const px=cx+Math.cos(a)*13, py=cy+Math.sin(a)*9+Math.sin(S.t*1.5+t*3)*1.4;
    if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  const ribbonRGB=toRgbTriple(hues[0]);
  ctx.strokeStyle='rgba('+ribbonRGB+',0.3)'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.stroke();
  ctx.restore();
  for(let i=0;i<4;i++){
    const t=i/3, a=Math.PI*0.7+t*Math.PI*0.9, r=15-t*9;
    const px=cx+Math.cos(a)*13, py=cy+Math.sin(a)*9+Math.sin(S.t*1.5+i)*1.4;
    ctx.globalAlpha=0.5+0.5*(1-t);
    ctx.drawImage(glowSprite(hues[i%hues.length],r*0.9),px-r*0.9,py-r*0.9,r*1.8,r*1.8);
  }
  ctx.globalAlpha=1;
}

// Phase 1 economy architecture: generic per-jar stat card, same visual
// shape as drawJarCapacityCard() just above, parameterized by statKey so
// Jar Reach/Magnet Reach/Magnet Duration don't need three near-duplicate
// draw functions. `fmt` formats a raw stat value for display (e.g. adds
// 's' for duration); `unit` is appended in the tier-count line only if
// truthy (kept off for reach/magnet reach, which read fine as bare counts).
// Premium Transparent Glassmorphism Redesign: optional `accent` (NEW, 6th
// param) -- a soft vertical color strip on the card's left edge, "each
// should have its own subtle accent" (Jar Reach: champagne/gold, Magnet
// Reach: cool violet/blue, Light Value: warm cyan). Omitted entirely if
// not passed, so this stays additive.
function lumEdgeAccent(rect,color){
  ctx.save();
  const g=ctx.createLinearGradient(0,rect.y,0,rect.y+rect.h);
  g.addColorStop(0,color.replace(',1)',',0)'));
  g.addColorStop(0.5,color.replace(',1)',',0.55)'));
  g.addColorStop(1,color.replace(',1)',',0)'));
  ctx.strokeStyle=g; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(rect.x+4,rect.y+16); ctx.lineTo(rect.x+4,rect.y+rect.h-16); ctx.stroke();
  ctx.restore();
}
