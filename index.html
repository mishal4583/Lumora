// ---------- daily quests (Stage 3 Part C) ----------
// quests[] itself (QUEST_POOL/rollQuests/grantQuestReward) lives up near the
// top of the file with the rest of session-persistent state. questRewardLabel
// is the one piece of quest-presentation logic still needed here — the
// standalone screen it used to serve was removed in the LUMORA
// clarifications pass; see the "Tonight's Quest" card in drawVillageScreen().
function questRewardLabel(q){
  if(q.reward.kind==='coins')return q.reward.val+' coins';
  if(q.reward.kind==='deco')return 'Garden Lanterns';
  if(q.reward.kind==='luck')return q.reward.val+'s luck boost';
  return '';
}
// Village + Decoration correction pass: grantQuestReward()'s 'deco' branch
// has always had a live fallback (grant the coin-equivalent instead, once
// Garden Lanterns are already owned) -- but since all 3 quests reroll every
// single day, that fallback becomes the COMMON case for deliver20 after day
// 1, not a rare edge case. questRewardLabel(q) alone always says "Garden
// Lanterns" regardless of which will actually happen. This one function is
// the single source of truth for "will this deco reward actually fall back
// to coins" — reads the exact same live upgrades.deco check
// grantQuestReward() itself uses, so preview and reality can never drift apart.
function questWillFallbackToCoins(q){ return q.reward.kind==='deco'&&upgrades.deco; }
// pre-completion preview: what will ACTUALLY happen if this quest is
// finished right now. Reuses questRewardLabel() for every case except the
// live fallback above.
function questRewardPreviewLabel(q){ return questWillFallbackToCoins(q)?(q.reward.val+' coins'):questRewardLabel(q); }
// post-completion: what ACTUALLY happened, read from q.grantedKind/
// grantedVal -- recorded once, at the exact moment grantQuestReward() ran
// (not recomputed from live state, since upgrades.deco may have changed
// again by the time this renders). Falls back to the live preview for a
// quest that was already done() before this field existed — safe migration
// for an old save, same "degrade gracefully" discipline as every other field.
function questGrantedLabel(q){
  if(q.grantedKind==='coins')return q.grantedVal+' coins';
  if(q.grantedKind==='deco')return 'Garden Lanterns';
  if(q.grantedKind==='luck')return q.grantedVal+'s luck boost';
  return questRewardPreviewLabel(q);
}
// natural-language completion line for the "Quest Complete" state, branching
// on the recorded kind (not string-sniffing questGrantedLabel()'s text) so
// it stays correct regardless of the exact wording above.
function questGrantedMessage(q){
  const kind=q.grantedKind||(questWillFallbackToCoins(q)?'coins':q.reward.kind); // same old-save migration fallback as questGrantedLabel()
  const val=q.grantedVal!=null?q.grantedVal:q.reward.val;
  if(kind==='deco')return 'Garden Lanterns added to the village.';
  if(kind==='luck')return 'A '+val+'s luck boost was granted.';
  return val+' coins added.';
}

// ---------- Glowkeeper Story (Journal narrative pass) ----------
// Static story data only -- no new engine, no new progression currency.
// Unlock gating reuses restorationPct(best) directly against the SAME pct
// thresholds VILLAGE_MILESTONES already uses (10/25/40/60/80/100), so a
// chapter unlocks in lockstep with the milestone of the same name. No
// second save field: unlock state is derived live from `best`, same as
// the Village screen's own milestone list.
const STORY_CHAPTERS=[
  {key:'first-night', pct:0,   title:'The First Night',
   text:'I found the old jar beneath the workshop tonight. It was covered in dust. I almost left it there. Then something moved inside. A single firefly. I don\'t know who left the jar. I don\'t know why the fireflies came back. But tonight, I carried the light home.'},
  {key:'first-window', pct:10, title:'First Window',
   text:'Tonight, I saw a light in one of the windows. Just one. Someone is still awake. I stood beneath it for a while. I don\'t think they saw me. But somehow, it felt like they were waiting.'},
  {key:'bakery', pct:25, title:'The Bakery',
   text:'The bakery opened this morning. There was flour on the doorstep. Smoke curled from the chimney. And for the first time in years, the village smelled like bread. I had forgotten that smell. I didn\'t realize I had missed it.'},
  {key:'lantern-garden', pct:40, title:'Lantern Garden',
   text:'Someone planted flowers beneath the old lanterns. I don\'t remember seeing them yesterday. Perhaps the villagers planted them. Perhaps the garden simply needed a little light. Either way, the path home feels different tonight.'},
  {key:'fountain', pct:60, title:'The Fountain',
   text:'The fountain is running again. I heard laughter in the square tonight. Children were chasing one another around the water. I stayed at the edge of the square and watched. Nobody noticed the Glowkeeper. That\'s alright. The village doesn\'t need to know my name. It only needs its lights back.'},
  {key:'bell-tower', pct:80, title:'Bell Tower',
   text:'The bell rang tonight. I had forgotten its sound. People came outside. Doors opened. Windows filled with warm light. For a moment, everyone looked toward the same place. Up. Toward the stars.'},
  {key:'dawn-chorus', pct:100, title:'Dawn Chorus',
   text:'Tonight, every window is lit. The bakery is warm. The garden is glowing. Water runs through the fountain. The bell has rung. And somewhere beyond the rooftops, birds have begun to sing. I thought the village needed the light. Perhaps I was wrong. Perhaps it was only waiting for someone to remind it that it still had its own. The whole village burns gently until sunrise.'}
];
// Post-100% teaser -- deliberately NOT a second story system (per direct
// instruction), just 3 more static fragments gated on the SAME pct:100
// threshold Dawn Chorus already uses. No explanation, no further unlock
// state -- a hook left for later, not a system.
const OLD_GLOWKEEPER_TEASER='Some stories are written in darkness.';
const OLD_GLOWKEEPER_FRAGMENTS=[
  'There was another Glowkeeper before me. I found their name carved beneath the workshop table.',
  'I asked the oldest villager about them. She wouldn\'t tell me their name. She only said: \'They knew where the fireflies went.\'',
  'I found an old photograph today. Someone is standing outside the workshop. Holding the same kind of jar I carry now.'
];
function storyChapterUnlocked(ch){ return restorationPct(best)>=ch.pct; }
function storyKeyUnlocked(key){
  if(key==='old-glowkeeper')return storyChapterUnlocked(STORY_CHAPTERS[STORY_CHAPTERS.length-1]);
  const ch=STORY_CHAPTERS.find(c=>c.key===key);
  return ch?storyChapterUnlocked(ch):false;
}
// Reads restorationPct(best) live, same as everything else here -- not a
// snapshot, so a Capacity-Enforcement-style staleness bug can't happen.
function latestUnlockedChapterKey(){
  let latest=STORY_CHAPTERS[0].key;
  STORY_CHAPTERS.forEach(ch=>{ if(storyChapterUnlocked(ch))latest=ch.key; });
  return latest;
}
const JOURNAL_TABS=[{key:'story',label:'Story'},{key:'fireflies',label:'Fireflies'}];
// single source of truth for both the tab draw and its hit-test, same
// discipline as shopTabRects()/jarCardRects() elsewhere in the file.
function journalTabRects(){
  const n=JOURNAL_TABS.length, pad=20, gap=8, tabW=(W-pad*2-gap*(n-1))/n, y=128, h=32;
  return JOURNAL_TABS.map((t,i)=>({key:t.key,label:t.label,x:pad+tabW/2+i*(tabW+gap),y,w:tabW,h}));
}
// Chapters below Dawn Chorus, plus "The Old Glowkeeper" once Dawn Chorus
// itself is unlocked -- recomputed every call (not baked into a fixed
// count), so the list grows the instant restoration crosses 100%, same as
// every other live-state rect function in this file.
function storyRowRects(){
  const rows=STORY_CHAPTERS.map(c=>({key:c.key,title:c.title}));
  if(storyChapterUnlocked(STORY_CHAPTERS[STORY_CHAPTERS.length-1]))rows.push({key:'old-glowkeeper',title:'The Old Glowkeeper'});

  return rows.map((r,i)=>({key:r.key,title:r.title,x:W/2,y:top+h/2+i*(h+gap),w:W-40,h}));
}
function drawStoryList(){
  storyRowRects().forEach(rect=>{

    ctx.fillText(unlocked?'tap to read':'the story continues as the village is restored',left+38,top+rect.h/2+16);
    ctx.fillStyle=unlocked?LUM_GOLD:'rgba(174,184,203,0.4)'; ctx.font='600 10px Georgia,serif'; ctx.textAlign='right';

}
// Full-page reading view for one chapter (or, for 'old-glowkeeper', the
// teaser + its 3 fragments together -- no per-fragment unlock gate, per

function drawStoryReading(){

// ---------- Journal screen (Lumora UI port) ----------
// Ported from src/pages/JournalScreen.tsx + FireflyCard.tsx -- moved OUT of
// the shop entirely (was Collector's tab) to its own top-level screen,
// matching the source design's own route list. Discovery reuses the
// existing journal[type]>0 signal, same as the old Collector grid; Object.
// keys(TYPES) (not a hardcoded list) for the same reason the old grid used
// it -- Mystery Firefly must show up here without a second fix.
// Glowkeeper Story pass: top 190->230, making room for the new Story |
// Fireflies tab row above it (only this tab's own content moved).
function journalRowRects(){
  const order=Object.keys(TYPES), top=230, h=78, gap=10;

// Glowkeeper Story pass: the Journal is now the storybook (journalTab
// defaults to 'story') with the original firefly-discovery grid moved to
// its own tab, not removed -- still reads the exact same journal[type]
// counts it always has. journalReading (a chapter key or null) switches
// this whole screen into drawStoryReading() instead of the tab+list view;
// the corner button becomes a "back to chapter list" control while reading
// (still JOURNAL_CLOSE_BTN, same circle, same position -- just relabeled),
// and only closes the screen for real (to journalFrom) once back at the list.
function drawJournalScreen(){
  const cx=W/2, cy=H/2, rad=Math.hypot(W,H)/2;
  const scrim=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  scrim.addColorStop(0,'rgba(8,10,26,0.6)');
  scrim.addColorStop(1,'rgba(8,10,26,0.85)');
  ctx.fillStyle=scrim; ctx.fillRect(0,0,W,H);
  wordmark(H*0.06,32,1);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(174,184,203,0.85)'; ctx.font='italic 16px Georgia,serif';
  ctx.fillText('the glowkeeper\'s journal',W/2,H*0.06+34);
  ctx.fillStyle='rgba(25,33,67,0.6)'; ctx.strokeStyle='rgba(174,184,203,0.3)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(JOURNAL_CLOSE_BTN.x,JOURNAL_CLOSE_BTN.y,JOURNAL_CLOSE_BTN.r,0,6.28); ctx.fill(); ctx.stroke();
  ctx.fillStyle=LUM_CREAM; ctx.font='600 18px Georgia,serif';
  ctx.fillText(journalReading?'‹':'✕',JOURNAL_CLOSE_BTN.x,JOURNAL_CLOSE_BTN.y+1);

  if(journalReading){ drawStoryReading(); ctx.textAlign='center'; ctx.textBaseline='top'; return; }

  journalTabRects().forEach(t=>{
    const active=t.key===journalTab;
    ctx.beginPath(); ctx.roundRect(t.x-t.w/2,t.y-t.h/2,t.w,t.h,t.h/2);
    if(active){
      const g=ctx.createLinearGradient(0,t.y-t.h/2,0,t.y+t.h/2);
      g.addColorStop(0,LUM_GOLD); g.addColorStop(1,LUM_AMBER);
      ctx.fillStyle=g;
    } else ctx.fillStyle='rgba(25,33,67,0.5)';
    ctx.fill();
    if(!active){ ctx.strokeStyle='rgba(174,184,203,0.22)'; ctx.lineWidth=1; ctx.stroke(); }
    ctx.fillStyle=active?LUM_NIGHT_DEEP:'rgba(174,184,203,0.85)';
    ctx.font=(active?'700 ':'600 ')+'11px Georgia,serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.label.toUpperCase(),t.x,t.y+1);
  });

  if(journalTab==='story'){
    drawStoryList();
  } else {
    const order=Object.keys(TYPES);
    const discoveredCount=order.filter(t=>journal[t]>0).length;
    ctx.fillStyle=LUM_HAZE; ctx.font='13px Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(discoveredCount+' of '+order.length+' species recorded',W/2,172);

    ctx.beginPath(); ctx.arc(TRACKER_TOGGLE.x,TRACKER_TOGGLE.y,TRACKER_TOGGLE.r,0,6.28);
    ctx.fillStyle=trackerOn?LUM_GOLD:'rgba(25,33,67,0.6)'; ctx.fill();
    ctx.strokeStyle='rgba(174,184,203,0.4)'; ctx.lineWidth=1.3; ctx.stroke();
    if(trackerOn){ ctx.fillStyle=LUM_NIGHT_DEEP; ctx.font='600 13px Georgia,serif'; ctx.fillText('✓',TRACKER_TOGGLE.x,TRACKER_TOGGLE.y+1); }
    ctx.fillStyle='rgba(174,184,203,0.85)'; ctx.font='italic 12px Georgia,serif'; ctx.textAlign='left';
    ctx.fillText('Tracker — a gentle hint toward fireflies you haven\'t met yet',TRACKER_TOGGLE.x+24,TRACKER_TOGGLE.y+1);

    journalRowRects().forEach(rect=>{
      const T=TYPES[rect.key], caught=journal[rect.key]||0, discovered=caught>0;
      lumPanel(rect.x,rect.y,rect.w,rect.h,16);
      const moteX=rect.x+40, moteY=rect.y+rect.h/2;
      ctx.save();
      ctx.shadowColor=discovered?T.glow:'transparent'; ctx.shadowBlur=discovered?18:0;
      ctx.fillStyle=discovered?T.glow:'rgba(90,98,136,0.5)';
      ctx.beginPath(); ctx.arc(moteX,moteY,13,0,6.28); ctx.fill();
      ctx.restore();
      const tx=rect.x+76;
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.fillStyle=LUM_CREAM; ctx.font='500 16px Georgia,serif';
      ctx.fillText(discovered?T.name:'Undiscovered',tx,rect.y+28);
      ctx.fillStyle='rgba(174,184,203,0.8)'; ctx.font='italic 12px Georgia,serif'; ctx.textBaseline='top';
      wrapText(discovered?T.desc:'Catch one to record it in the journal.',tx,rect.y+38,rect.w-76-70,14,'left');
      ctx.fillStyle='rgba(174,184,203,0.7)'; ctx.font='500 10px Georgia,serif'; ctx.textAlign='right'; ctx.textBaseline='alphabetic';
      ctx.fillText('CAUGHT',rect.x+rect.w-16,rect.y+28);
      ctx.fillStyle=LUM_CREAM; ctx.font='500 18px Georgia,serif';
      ctx.fillText(caught+'',rect.x+rect.w-16,rect.y+50);
    });
  }
  ctx.textAlign='center'; ctx.textBaseline='top';
}
// ---------- welcome-back overlay (Stage 3 Part C, Section 6.5) ----------
// Drawn ON TOP of the title screen (see showWelcomeBack), never a separate
// `screen` value — so it structurally cannot delay or reorder gameReady,
// which only ever checks screen==='title'. Content is derived entirely from
// existing data (best + LIGHTS' own thresholds via homesRestoredCount()) —
// no new stat invented. Dismiss mirrors the shop's own close-button + Esc
// convention, plus a generous "tap anywhere near the button" target since
// this is the overlay's only action.
// Lumora UI port: ported from src/pages/WelcomeBackScreen.tsx -- eyebrow +
// glow title, a 2-up Village/Coins stat grid, a "Tonight's Night" card
// reading the SAME live weather system already driving gameplay (not a
// second, parallel weather picker), Continue button. Kept as a non-blocking
// overlay on top of the title screen, same architecture as before (see the
// comment on showWelcomeBack itself for why that matters for gameReady).
function drawWelcomeBack(){
  const cx=W/2, cy=H/2, rad=Math.hypot(W,H)/2;
  const vig=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  vig.addColorStop(0,'rgba(8,10,26,0.9)');

  const titleEnd=wrapText('The village kept your lights burning',W/2,H*0.18+26,420,30,'center');
  ctx.restore();

  const statY=titleEnd+24, statW=200, gap=16, statX0=W/2-statW-gap/2, statX1=W/2+gap/2;
  lumPanel(statX0,statY,statW,90,16);
  lumPanel(statX1,statY,statW,90,16);

  ctx.fillText(restorationPct(best)+'%',statX0+18,statY+62);

  ctx.fillStyle=LUM_CREAM; ctx.font='500 26px Georgia,serif';
  ctx.fillText(coins.toLocaleString(),statX1+18,statY+62);

  const weatherR={x:W/2-160,y:statY+110,w:320,h:88};
  lumPanel(weatherR.x,weatherR.y,weatherR.w,weatherR.h,16);
  lumEyebrow('Tonight\'s Night',weatherR.x+18,weatherR.y+24,'left');
  ctx.fillStyle=LUM_CREAM; ctx.font='500 15px Georgia,serif'; ctx.textAlign='left'; ctx.textBaseline='top';
  wrapText(WEATHER_INFO[S.weather]?WEATHER_INFO[S.weather].msg:'A quiet night — still air, no rare weather yet.',weatherR.x+18,weatherR.y+38,weatherR.w-36,18,'left');

  ctx.textAlign='center'; ctx.textBaseline='middle';
  glowOrb(WELCOME_CLOSE_BTN,'continue');
  ctx.textBaseline='top';
}
// Lumora UI port: ported from src/components/game/PauseOverlay.tsx --
// "Paused" title, Resume (primary), Restart Night (new, see RESTART_BTN's
// own comment for what was deliberately left out and why). Score/best
// readout preserved from the original.
function drawPaused(){
  const cx=W/2, cy=H/2, rad=Math.hypot(W,H)/2;
  const vig=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  vig.addColorStop(0,'rgba(8,10,26,0.62)');
  vig.addColorStop(1,'rgba(8,10,26,0.9)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  lumEyebrow('Paused',W/2,H*0.28,'center');
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  lumGlow('The night waits',W/2,H*0.28+36,26,'center');
  ctx.fillStyle=LUM_CREAM; ctx.font='600 22px Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('✦ '+S.score,W/2,H*0.32+90);
  ctx.fillStyle='rgba(174,184,203,0.85)'; ctx.font='500 15px Georgia,serif';
  ctx.fillText('best '+best,W/2,H*0.32+118);
  if(pauseReason==='user'){
    if(pauseConfirm==='restart'){
      drawConfirmModal('Restart this night?','Your current night progress will be lost. Any fireflies currently held in your jar will be discarded. Your permanent coins, upgrades, equipped jar, village restoration, and journal progress will remain safe.','Restart Night');
    } else if(pauseConfirm==='gohome'){
      drawConfirmModal('Leave this night?','Your current collected light will be lost. Permanent progress will remain safe.','Go Home');
    } else {
      glowOrb(RESUME_BTN,'resume');
      lumButton(RESTART_BTN,'Restart Night','outline');
      lumButton(GOHOME_BTN,'Go Home','quiet');
    }
  }
  ctx.textBaseline='top';
}
function draw(){
  drawVillage();
  drawMoon();
  if(screen==='play'){
    if(S.magnet)drawMagnet(S.magnet);
    for(const f of S.flies)drawFly(f);
    for(const m of S.moths)drawMoth(m);
    drawDeliverWaves();
    drawSparks();
    drawJar();
    for(const p of S.parts){
      // Trail System Redesign: optional peak-alpha multiplier (p.a), used by
      // the new layered trail particles below so different layers (soft
      // glow/medium/spark/highlight) can have different peak brightness, not
      // just different life/size. Backward-compatible: every OTHER particle
      // source in the file (catch streaks, fountain droplets, puff(), etc.)
      // never sets p.a, so `?? 1` leaves their existing behavior byte-for-byte
      // unchanged.
      ctx.globalAlpha=Math.max(0,p.life/p.maxL)*(p.a??1);
      ctx.drawImage(glowSprite(p.color,p.r*4),p.x-p.r*4,p.y-p.r*4,p.r*8,p.r*8);
    }
    ctx.globalAlpha=1;
    drawHUD();
    if(S.carried.length>=S.cap&&!S.over)drawFullJarAlert();
    drawMothWarningFlash(); // always-on gameplay feedback, independent of the tutorial
    if(S.over)drawOver();
    if(paused)drawPaused();
    if(tutorialPanelOpen)drawTutorialPanel(); // topmost overlay, same precedent as drawPaused()/drawOver() above
  } else if(screen==='shop'){
    drawShop();
  } else if(screen==='village'){
    drawVillageScreen();
  } else if(screen==='journal'){
    drawJournalScreen();
  } else {
    drawTitle();
    // welcome-back is an overlay ON TOP of the title screen, not its own
    // `screen` value — see maybeShowWelcomeBack()'s comment for why that
    // matters for the gameReady lifecycle hook
    if(showWelcomeBack)drawWelcomeBack();
  }
}

// ---------- loop ----------
let lastT=performance.now();
function loop(now){
  if(cv.width===0||window.innerWidth!==lastVW||window.innerHeight!==lastVH)resize(); // catches viewport changes even without a 'resize' event (e.g. fullscreen exit in some hosts)
  let dt=Math.min(0.033,(now-lastT)/1000); lastT=now;
  // First-Night Tutorial: an open tutorial panel gates simulation the exact
  // same way `paused` already does -- fireflies/moths/timers all freeze,
  // draw() still runs every frame so the frozen scene + panel actually
  // render. Does not touch paused/pauseReason at all, per direct
  // instruction not to interfere with the existing pause/resume system.
  if(!paused&&!tutorialPanelOpen)update(dt);
  draw(); // renders the title screen (our splash/main-menu) on the very first call

  // Lifecycle Hook 1: the first visual frame is now on screen.
  if(!firstFrameSent&&cv.width>0){
    firstFrameSent=true;
    if(YT&&YT.game&&YT.game.firstFrameReady){ try{ YT.game.firstFrameReady(); }catch(e){} }
  }
  // Lifecycle Hook 2: the title screen is our main menu and is interactive
  // (its "begin" button is hit-testable) as soon as it's drawn — signal
  // gameReady the moment that screen is actually showing.
  if(!gameReadySent&&cv.width>0&&screen==='title'){
    gameReadySent=true;
    if(YT&&YT.game&&YT.game.gameReady){ try{ YT.game.gameReady(); }catch(e){} }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// NOTE: no Page Visibility API usage — pause/resume is driven exclusively by ytgame.system hooks (platform requirement).
</script>
